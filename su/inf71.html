<style>

const state = {graded: {}, startedAt: new Date()};
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function render(){
  const cards = document.getElementById('cards');
  const jump = document.getElementById('jump');
  DATA.forEach((d,i)=>{
    const opt = document.createElement('option');
    opt.value='card-'+i; opt.textContent = `${String(i+1).padStart(2,'0')}. ${d.name}()`;
    jump.appendChild(opt);
    const article=document.createElement('article');
    article.className='card'; article.id='card-'+i;
    article.dataset.search=(d.name+' '+d.summary+' '+d.detail).toLowerCase();
    article.innerHTML=`
      <div class="card-head"><span class="badge">내장 함수 ${i+1} / ${DATA.length}</span>
      <h3>${esc(d.name)}()</h3><p class="summary">${esc(d.summary)}</p></div>
      <div class="section"><div class="label">기본 문법</div><code class="inline">${esc(d.syntax)}</code></div>
      <div class="section"><div class="label">상세 설명</div><div>${esc(d.detail)}</div></div>
      <div class="section"><div class="label">예시 코드</div><pre><code>${esc(d.code)}</code></pre></div>
      <div class="section"><div class="label">확인 문제</div>
      <p><strong>${i+1}. ${esc(d.name)}()와 예시 코드에 관한 설명으로 옳은 것을 모두 고르시오.</strong> <span class="badge">3개 선택</span></p>
      <div>${d.options.map((o,j)=>`<label class="option"><input type="checkbox" name="q${i}" value="${j}" onchange="updateProgress()"><span>${j+1}. ${esc(o)}</span></label>`).join('')}</div>
      <div class="quiz-actions"><button class="secondary" onclick="gradeOne(${i})">이 문항 채점</button><button class="danger" onclick="clearOne(${i})">선택 지우기</button></div>
      <div class="result" id="result-${i}"></div></div>`;
    cards.appendChild(article);
  });
  jump.addEventListener('change',()=>{if(jump.value) document.getElementById(jump.value).scrollIntoView({behavior:'smooth',block:'start'})});
}

function selected(i){
 return [...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(x=>Number(x.value)).sort((a,b)=>a-b);
}
function same(a,b){return a.length===b.length && a.every((v,i)=>v===b[i]);}
function gradeOne(i){
 const d=DATA[i], sel=selected(i), ok=same(sel,[...d.answers].sort((a,b)=>a-b));
 state.graded[i]=ok;
 const r=document.getElementById('result-'+i);
 const answerText=d.answers.map(x=>x+1).join(', ');
 const chosen=sel.length?sel.map(x=>x+1).join(', '):'선택 없음';
 r.className='result show '+(ok?'correct':'incorrect');
 r.innerHTML=`<strong>${ok?'정답입니다.':'오답입니다.'}</strong><br>선택: ${chosen} / 정답: ${answerText}
 <ol class="explain">${d.explanations.map((e,j)=>`<li><strong>${j+1}번:</strong> ${esc(e)}</li>`).join('')}</ol>`;
 updateProgress();
 return ok;
}
function clearOne(i){
 document.querySelectorAll(`input[name="q${i}"]`).forEach(x=>x.checked=false);
 delete state.graded[i];
 const r=document.getElementById('result-'+i); r.className='result'; r.innerHTML='';
 updateProgress();
}
function updateProgress(){
 const count=DATA.reduce((n,_,i)=>n+(selected(i).length>0?1:0),0);
 document.getElementById('answered').textContent=`응답 ${count} / ${DATA.length}`;
 document.getElementById('bar').style.width=(count/DATA.length*100)+'%';
 const correct=Object.values(state.graded).filter(Boolean).length;
 document.getElementById('correctStat').textContent=`개별 채점 정답 ${correct}`;
}
function saveStudent(){
 const no=document.getElementById('studentNo').value.trim();
 const name=document.getElementById('studentName').value.trim();
 alert(no&&name?`${no} ${name} 학생 정보가 확인되었습니다.`:'학번과 이름을 모두 입력하세요.');
}
function safeName(s){return s.replace(/[\\/:*?"<>|\s]+/g,'_').replace(/^_+|_+$/g,'') || '미입력';}
function stamp(d){
 const p=n=>String(n).padStart(2,'0');
 return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function gradeAll(){
 const no=document.getElementById('studentNo').value.trim();
 const name=document.getElementById('studentName').value.trim();
 if(!no||!name){alert('학번과 이름을 먼저 입력하세요.'); return;}
 const unanswered=DATA.filter((_,i)=>selected(i).length===0).length;
 if(unanswered && !confirm(`미응답 문항이 ${unanswered}개 있습니다. 그대로 채점할까요?`)) return;
 let correct=0;
 DATA.forEach((_,i)=>{if(gradeOne(i)) correct++;});
 const score=Math.round(correct/DATA.length*100);
 const now=new Date();
 const box=document.getElementById('finalBox');
 box.className='show';
 box.innerHTML=`<h2>최종 결과</h2><div class="score">${score}점</div><p>${DATA.length}문항 중 ${correct}문항 정답</p>
 <p>학번: ${esc(no)} / 이름: ${esc(name)} / 제출 시각: ${now.toLocaleString('ko-KR')}</p>`;
 const lines=[];
 lines.push('파이썬 내장 함수 71개 자동 평가 결과');
 lines.push('='.repeat(70));
 lines.push(`학번: ${no}`);
 lines.push(`이름: ${name}`);
 lines.push(`점수: ${score}점`);
 lines.push(`정답 문항: ${correct} / ${DATA.length}`);
 lines.push(`응시 시작: ${state.startedAt.toLocaleString('ko-KR')}`);
 lines.push(`제출 시각: ${now.toLocaleString('ko-KR')}`);
 lines.push('');
 DATA.forEach((d,i)=>{
   const sel=selected(i), ans=[...d.answers].sort((a,b)=>a-b), ok=same(sel,ans);
   lines.push(`[문항 ${i+1}] ${d.name}() - ${ok?'정답':'오답'}`);
   lines.push(`문제: ${d.name}()와 예시 코드에 관한 설명으로 옳은 것을 모두 고르시오.`);
   d.options.forEach((o,j)=>lines.push(`  ${j+1}. ${o}`));
   lines.push(`학생 선택: ${sel.length?sel.map(x=>x+1).join(', '):'선택 없음'}`);
   lines.push(`정답: ${ans.map(x=>x+1).join(', ')}`);
   lines.push('상세 풀이:');
   d.explanations.forEach((e,j)=>lines.push(`  ${j+1}번 - ${e}`));
   lines.push('-'.repeat(70));
 });
 const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download=`${safeName(no)}_${safeName(name)}_${score}_내장함수_${stamp(now)}.txt`;
 document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
 box.scrollIntoView({behavior:'smooth',block:'center'});
}
function searchCards(){
 const q=document.getElementById('search').value.trim().toLowerCase();
 document.querySelectorAll('.card').forEach(c=>c.classList.remove('search-hit'));
 if(!q) return;
 const hit=[...document.querySelectorAll('.card')].find(c=>c.dataset.search.includes(q));
 if(hit){hit.classList.add('search-hit');hit.scrollIntoView({behavior:'smooth',block:'center'});}
 else alert('검색 결과가 없습니다.');
}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')searchCards()});
render(); updateProgress();
</script>
