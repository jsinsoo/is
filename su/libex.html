<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>활용 영역별 파이썬 라이브러리 특색 학습평가</title>
<style>
:root{--navy:#17324d;--blue:#246a9b;--teal:#128277;--bg:#f3f7fb;--line:#d8e2ec;--ink:#182433;--muted:#657485;--good:#e8f8ee;--bad:#fff0f0;--note:#fff9e8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.72}
header{background:linear-gradient(135deg,var(--navy),var(--blue) 60%,var(--teal));color:#fff;padding:42px 20px 34px}header .inner,main{max-width:1450px;margin:auto}h1{margin:0 0 8px;font-size:clamp(29px,4vw,48px)}header p{margin:0;opacity:.94}
.toolbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
button,select,input{font:inherit;border-radius:8px}button{border:0;background:var(--blue);color:#fff;padding:9px 13px;cursor:pointer}button.alt{background:#52606d}button.green{background:var(--teal)}select,input{border:1px solid var(--line);background:#fff;padding:9px 11px}
main{padding:22px 14px 75px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:22px;box-shadow:0 7px 22px rgba(20,45,70,.06);scroll-margin-top:82px}
.student{display:grid;grid-template-columns:90px 1fr 90px 1fr;gap:8px}.label{background:#eef4fa;font-weight:700;text-align:center;padding:10px;border:1px solid var(--line)}.student input{width:100%}
.unit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}.badge{background:var(--navy);color:#fff;border-radius:999px;padding:7px 12px;font-weight:700;white-space:nowrap}

pre{margin:0;white-space:pre;overflow:auto;background:#111827;color:#eef2f7;border-radius:11px;padding:17px;font:13px/1.55 Consolas,"Courier New",monospace}.copy-code{margin-top:8px;background:var(--teal)}.flow{background:#f8fbfe;border-left:5px solid var(--teal);padding:14px;border-radius:8px}.flow ol{margin-bottom:0}.focus{background:var(--note);border:1px solid #ead999;border-radius:9px;padding:11px 13px}
.choice{display:block;border:1px solid var(--line);border-radius:9px;padding:10px;margin:8px 0;cursor:pointer}.choice:hover{background:#f4f8fb}.choice input{margin-right:8px;transform:scale(1.15)}.correct{background:var(--good)}.wrong{background:var(--bad)}.explanation{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}.result{display:none}.score{font-size:31px;font-weight:800;color:var(--blue)}.hidden{display:none!important}

@media print{header,.toolbar,#topBtn,.submit-area,.copy-code{display:none!important}body{background:#fff}main{max-width:none;padding:0}.card{box-shadow:none;break-inside:avoid}.explanation,.result{display:block!important}}
</style>
</head>
<body>
<header><div class="inner"><h1>활용 영역별 파이썬 라이브러리 특색 학습평가</h1><p>124개 라이브러리별 개별 예제 · 코드 흐름 설명 · 특색 있는 선택형 평가 · TXT 결과 저장</p></div></header>
<div class="toolbar"><select id="jump"><option value="">라이브러리 이동</option></select><input id="search" placeholder="라이브러리·영역·기능 검색" oninput="filterUnits()"><button onclick="filterUnits()">검색</button><button class="alt" onclick="resetFilter()">초기화</button><button onclick="window.print()">인쇄 / PDF</button></div>
<main>
<section class="card"><h2>응시자 정보</h2><div class="student"><div class="label">학번</div><input id="sid" placeholder="예: 1101"><div class="label">이름</div><input id="sname" placeholder="예: 홍길동"></div><p>응시 시작 시각: <b id="startTime"></b></p><div class="focus">모든 라이브러리는 활용 영역과 성격에 맞는 서로 다른 예제로 구성했습니다. 각 문항에서 옳은 설명 3개를 모두 골라야 정답이며, 정답 위치는 10개 조합으로 순환 배치했습니다.</div></section>
<div id="units"></div>
<section class="card submit-area" style="text-align:center"><button class="green" onclick="grade()">제출 및 채점</button></section>
<section class="card result" id="result"><h2>채점 결과</h2><div class="score" id="scoreText"></div><p id="summary"></p><button class="green" onclick="saveTxt()">학번_이름_점수_라이브러리_응시시각.txt 저장</button></section>
</main><button id="topBtn" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>

const startDate=new Date();document.getElementById("startTime").textContent=startDate.toLocaleString("ko-KR");
const units=document.getElementById("units"),jump=document.getElementById("jump");
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
DATA.forEach((item,i)=>{
 const op=document.createElement("option");op.value="unit-"+i;op.textContent=`${i+1}. ${item.library}`;jump.appendChild(op);
 const sec=document.createElement("section");sec.className="card unit";sec.id="unit-"+i;sec.dataset.search=(item.library+" "+item.category+" "+item.feature+" "+item.usage).toLowerCase();
 sec.innerHTML=`<div class="unit-head"><span class="badge">${i+1}번</span><div><h2>${item.library}</h2><div>${item.category}</div></div></div>
 <div class="meta"><div><b>구분</b>${item.kind}</div><div><b>핵심 기능</b>${item.feature}</div><div><b>대표 활용</b>${item.usage}</div><div><b>설치</b>${item.install}</div></div>
 <h3>활용 영역에 맞춘 예제 코드</h3><pre>${esc(item.code)}</pre><button class="copy-code" onclick="copyCode(this)">코드 복사</button>
 <h3>예제 코드 상세 설명</h3><div class="flow"><b>핵심 동작:</b> ${item.fact}<ol>${item.notes.map(n=>`<li>${n}</li>`).join("")}</ol></div>
 <h3>${i+1}. ${item.prompt} <small>(3개 선택)</small></h3>
 ${item.choices.map((c,j)=>`<label class="choice" id="c-${i}-${j}"><input type="checkbox" name="q${i}" value="${j}">${j+1}. ${c}</label>`).join("")}
 <div class="explanation" id="e-${i}"></div>`;
 units.appendChild(sec);
});
jump.onchange=()=>{if(jump.value)document.getElementById(jump.value).scrollIntoView({behavior:"smooth"})};
function filterUnits(){const q=document.getElementById("search").value.trim().toLowerCase();document.querySelectorAll(".unit").forEach(x=>x.classList.toggle("hidden",q&&!x.dataset.search.includes(q)));}
function resetFilter(){document.getElementById("search").value="";document.querySelectorAll(".unit").forEach(x=>x.classList.remove("hidden"));}
async function copyCode(btn){const code=btn.previousElementSibling.innerText;try{await navigator.clipboard.writeText(code);const old=btn.textContent;btn.textContent="복사 완료";setTimeout(()=>btn.textContent=old,1200)}catch(e){alert("복사하지 못했습니다.")}}
let submitted=false,submitDate=null,finalScore=0,detailText="";
function same(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}
function grade(){
 const sid=document.getElementById("sid").value.trim(),name=document.getElementById("sname").value.trim();if(!sid||!name){alert("학번과 이름을 입력하세요.");return;}
 let correct=0;detailText="";
 DATA.forEach((item,i)=>{
  const selected=[...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(x=>Number(x.value)).sort((a,b)=>a-b);const answer=[...item.answer].sort((a,b)=>a-b);const ok=same(selected,answer);if(ok)correct++;
  item.choices.forEach((_,j)=>{const label=document.getElementById(`c-${i}-${j}`);label.classList.remove("correct","wrong");if(answer.includes(j))label.classList.add("correct");else if(selected.includes(j))label.classList.add("wrong");});
  const e=document.getElementById(`e-${i}`);e.style.display="block";e.innerHTML=`<b>${ok?"정답":"오답"}</b> · 정답: ${answer.map(x=>x+1).join(", ")}<ol>${item.explanations.map(x=>`<li>${x}</li>`).join("")}</ol>`;
  detailText+=`\n[${i+1}번] ${item.library} - ${ok?"정답":"오답"}\n선택: ${selected.length?selected.map(x=>x+1).join(", "):"미선택"}\n정답: ${answer.map(x=>x+1).join(", ")}\n`;
  item.explanations.forEach((x,j)=>detailText+=`${j+1}번 보기: ${x}\n`);
 });
 finalScore=Math.round(correct/DATA.length*100);submitted=true;submitDate=new Date();document.getElementById("scoreText").textContent=`${finalScore}점 (${correct}/${DATA.length}문항)`;document.getElementById("summary").textContent=`제출 시각: ${submitDate.toLocaleString("ko-KR")}`;document.getElementById("result").style.display="block";document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
function safe(s){return s.replace(/[\\/:*?"<>|]/g,"_")}function stamp(d){const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;}
function saveTxt(){
 if(!submitted){alert("먼저 제출 및 채점을 실행하세요.");return;}const sid=document.getElementById("sid").value.trim(),name=document.getElementById("sname").value.trim();const content=`활용 영역별 파이썬 라이브러리 평가 결과\n학번: ${sid}\n이름: ${name}\n점수: ${finalScore}점\n시작 시각: ${startDate.toLocaleString("ko-KR")}\n제출 시각: ${submitDate.toLocaleString("ko-KR")}\n총 문항: ${DATA.length}\n${detailText}`;const blob=new Blob([content],{type:"text/plain;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${safe(sid)}_${safe(name)}_${finalScore}_라이브러리_${stamp(submitDate)}.txt`;a.click();URL.revokeObjectURL(a.href);
}
