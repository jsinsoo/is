<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLearn - 큐 01~10차시 통합 학습자료</title>
<style>
:root {
  --bg:#eef3f8; --panel:#ffffff; --ink:#172033; --muted:#64748b;
  --line:#d8e1ec; --primary:#1d4ed8; --primary2:#0f766e;
  --soft:#eaf2ff; --shadow:0 12px 32px rgba(15,23,42,.10);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr}
header{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;padding:16px 20px}
.header-inner{max-width:1500px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(23px,3vw,36px);margin:0}
.subtitle{opacity:.94;margin-top:4px}
.badge{padding:6px 11px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);border-radius:999px;font-size:14px}
.toolbar{background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding:10px 14px;box-shadow:0 3px 12px rgba(15,23,42,.05)}
.toolbar-inner{max-width:1500px;margin:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button,select{font:inherit}
button{border:0;border-radius:9px;padding:9px 13px;font-weight:700;cursor:pointer}
button.primary{background:var(--primary);color:white}
button.light{background:#edf2f7;color:#24324a}
button:hover{filter:brightness(.97)}
select{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:white;font-weight:700}
.lesson-tabs{display:flex;gap:6px;flex-wrap:wrap}
.lesson-tab{min-width:44px;background:#edf2f7;color:#334155}
.lesson-tab.active{background:var(--primary);color:white}
.status{margin-left:auto;color:var(--muted);font-size:14px;font-weight:700}
.viewer-wrap{min-height:0;padding:12px}
.viewer-card{height:100%;max-width:1500px;margin:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;position:relative}
iframe{width:100%;height:100%;border:0;background:white;display:block}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:white;color:var(--muted);font-weight:700;z-index:2}
@media(max-width:760px){
  header{padding:12px 14px}
  .subtitle{font-size:14px}
  .toolbar{padding:8px}
  .viewer-wrap{padding:6px}
  .viewer-card{border-radius:10px}
  .status{width:100%;margin-left:0}
}
@media print{
  header,.toolbar{display:none!important}
  body,.app,.viewer-wrap,.viewer-card{height:auto;overflow:visible;background:white;padding:0;border:0;box-shadow:none}
  iframe{height:100vh}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="header-inner">
      <div>
        <h1>QLearn</h1>
        <div class="subtitle">큐 01차시부터 10차시까지 하나로 통합한 상세학습 수업지도안</div>
      </div>
      <span class="badge">10개 차시 · 자동 채점 · TXT 저장 기능 유지</span>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-inner">
      <button class="light" id="prevBtn" type="button">◀ 이전 차시</button>
      <select id="lessonSelect" aria-label="차시 선택">
        <option value="1">큐 01차시</option><option value="2">큐 02차시</option><option value="3">큐 03차시</option><option value="4">큐 04차시</option><option value="5">큐 05차시</option><option value="6">큐 06차시</option><option value="7">큐 07차시</option><option value="8">큐 08차시</option><option value="9">큐 09차시</option><option value="10">큐 10차시</option>
      </select>
      <button class="light" id="nextBtn" type="button">다음 차시 ▶</button>
      <div class="lesson-tabs" id="lessonTabs">
        <button class="lesson-tab" data-lesson="1" type="button">01</button><button class="lesson-tab" data-lesson="2" type="button">02</button><button class="lesson-tab" data-lesson="3" type="button">03</button><button class="lesson-tab" data-lesson="4" type="button">04</button><button class="lesson-tab" data-lesson="5" type="button">05</button><button class="lesson-tab" data-lesson="6" type="button">06</button><button class="lesson-tab" data-lesson="7" type="button">07</button><button class="lesson-tab" data-lesson="8" type="button">08</button><button class="lesson-tab" data-lesson="9" type="button">09</button><button class="lesson-tab" data-lesson="10" type="button">10</button>
      </div>
      <button class="primary" id="openNewBtn" type="button">현재 차시 새 창</button>
      <button class="light" id="printBtn" type="button">현재 차시 인쇄/PDF</button>
      <div class="status" id="status">큐 01차시</div>
    </div>
  </div>

  <div class="viewer-wrap">
    <div class="viewer-card">
      <div class="loading" id="loading">학습자료를 불러오는 중입니다.</div>
      <iframe id="lessonFrame" title="큐 차시별 학습자료"></iframe>
    </div>
  </div>
</div>

<script>
const lessons = [{"lesson": 1, "title": "큐 01차시", "content": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<base target=\\\"_self\\\">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>큐 01차시 상세학습 수업지도안<\/title>\n<style>\n:root{\n  --bg:#f5f7fb; --card:#ffffff; --ink:#172033; --muted:#64748b;\n  --primary:#2563eb; --primary2:#1d4ed8; --soft:#eaf2ff;\n  --green:#15803d; --greenbg:#ecfdf3; --red:#b91c1c; --redbg:#fff1f2;\n  --line:#dbe3ef; --code:#0f172a; --codeink:#e2e8f0; --amber:#b45309;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Malgun Gothic\",\"Apple SD Gothic Neo\",Arial,sans-serif;line-height:1.72}\nheader{background:linear-gradient(135deg,#1d4ed8,#0f766e);color:white;padding:38px 20px}\n.header-inner{max-width:1180px;margin:auto}\nh1{font-size:clamp(28px,4vw,46px);margin:0 0 8px}\n.subtitle{font-size:18px;opacity:.95}\n.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}\n.badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:999px}\n.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}\n.topbar-inner{max-width:1180px;margin:auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}\nbutton,.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}\n.btn-primary{background:var(--primary);color:white}\n.btn-primary:hover{background:var(--primary2)}\n.btn-light{background:#eef2f7;color:#24324a}\nselect,input{font:inherit}\nselect{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:white}\nmain{max-width:1180px;margin:24px auto;padding:0 16px 60px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 8px 26px rgba(15,23,42,.05)}\n.card h2{margin-top:0;font-size:27px}\n.card h3{font-size:21px;margin-top:28px}\n.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n@media(max-width:800px){.grid-2{grid-template-columns:1fr}}\ntable{width:100%;border-collapse:collapse;margin:12px 0}\nth,td{border:1px solid var(--line);padding:10px;vertical-align:top}\nth{background:#eef4ff}\n.callout{border-left:5px solid var(--primary);background:var(--soft);padding:14px 16px;border-radius:10px;margin:14px 0}\n.warning{border-left-color:#d97706;background:#fff7ed}\n.success{border-left-color:var(--green);background:var(--greenbg)}\n.codebox{background:var(--code);color:var(--codeink);padding:18px;border-radius:14px;overflow:auto;position:relative}\npre{margin:0;font-family:Consolas,\"Courier New\",monospace;font-size:15px;line-height:1.6;white-space:pre}\n.line-explain{margin:12px 0 0;padding:0;list-style:none}\n.line-explain li{padding:7px 10px;border-bottom:1px dashed var(--line)}\n.line-no{display:inline-block;min-width:34px;font-weight:800;color:var(--primary)}\n.queue-visual{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:16px;background:#f8fafc;border:1px dashed #94a3b8;border-radius:14px}\n.qitem{min-width:52px;text-align:center;padding:12px 9px;border-radius:10px;background:#dbeafe;border:2px solid #60a5fa;font-weight:800}\n.arrow{font-weight:900;color:#475569}\n.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\n.controls input{padding:9px 10px;border:1px solid var(--line);border-radius:9px;width:170px}\n.quiz{border-top:4px solid #8b5cf6}\n.option{display:block;margin:9px 0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}\n.option:hover{background:#faf8ff}\n.option input{margin-right:9px;transform:scale(1.15)}\n.feedback{display:none;margin-top:14px;padding:14px;border-radius:10px}\n.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}\n.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fda4af;color:#881337}\n.student-box{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n.student-box label{font-weight:700}\n.student-box input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin-top:5px}\n@media(max-width:620px){.student-box{grid-template-columns:1fr}}\n.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}\n.progress>div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#10b981);transition:.4s}\n.score-box{font-size:25px;font-weight:900;text-align:center;padding:18px;border-radius:14px;background:#eff6ff}\n.small{font-size:14px;color:var(--muted)}\n.hidden{display:none!important}\nfooter{max-width:1180px;margin:auto;padding:25px 16px 45px;color:#64748b;text-align:center}\n@media print{\n  .topbar,.controls,.submit-area,.interactive-only{display:none!important}\n  body{background:white}\n  .card{box-shadow:none;break-inside:avoid}\n  header{background:white;color:black;border-bottom:2px solid #333}\n}\n<\/style>\n<\/head>\n<body>\n<header>\n  <div class=\"header-inner\">\n    <h1>큐 01차시 상세학습 수업지도안<\/h1>\n    <div class=\"subtitle\">선입 선출(FIFO) 원리와 큐의 기본 연산을 개념·코드·문제로 완전 학습<\/div>\n    <div class=\"badges\">\n      <span class=\"badge\">수업 시간 50분<\/span>\n      <span class=\"badge\">개념 6개<\/span>\n      <span class=\"badge\">코드 6개<\/span>\n      <span class=\"badge\">5지선다형 6문항<\/span>\n      <span class=\"badge\">자동 채점·TXT 저장<\/span>\n    <\/div>\n  <\/div>\n<\/header>\n\n<nav class=\"topbar\">\n  <div class=\"topbar-inner\">\n    <button class=\"btn-light\" onclick=\"window.scrollTo({top:0,behavior:'smooth'})\">맨 위<\/button>\n    <select id=\"jump\" onchange=\"jumpTo(this.value)\">\n      <option value=\"\">학습 위치 이동<\/option>\n      <option value=\"overview\">수업 개요<\/option>\n      <option value=\"concept1\">1. 큐와 FIFO<\/option>\n      <option value=\"concept2\">2. 삽입 연산<\/option>\n      <option value=\"concept3\">3. 삭제 연산<\/option>\n      <option value=\"concept4\">4. front와 입구<\/option>\n      <option value=\"concept5\">5. 빈 큐 확인<\/option>\n      <option value=\"concept6\">6. 전체 동작 추적<\/option>\n      <option value=\"assessment\">종합 제출<\/option>\n    <\/select>\n    <button class=\"btn-light\" onclick=\"window.print()\">인쇄/PDF<\/button>\n  <\/div>\n<\/nav>\n\n<main>\n<section class=\"card\" id=\"overview\">\n  <h2>1. 수업 개요<\/h2>\n  <div class=\"student-box\">\n    <label>학번\n      <input id=\"studentId\" maxlength=\"20\" placeholder=\"예: 1101\">\n    <\/label>\n    <label>이름\n      <input id=\"studentName\" maxlength=\"20\" placeholder=\"예: 홍길동\">\n    <\/label>\n  <\/div>\n\n  <h3>학습 목표<\/h3>\n  <ol>\n    <li>큐를 선입 선출 방식의 선형 데이터 구조로 설명할 수 있다.<\/li>\n    <li>큐의 삽입과 삭제가 서로 다른 끝에서 수행됨을 설명할 수 있다.<\/li>\n    <li>리스트를 활용한 간단한 큐 코드를 읽고 실행 결과를 예측할 수 있다.<\/li>\n    <li>큐의 상태 변화를 단계별로 추적할 수 있다.<\/li>\n  <\/ol>\n\n  <div class=\"grid-2\">\n    <div>\n      <h3>수업 흐름<\/h3>\n      <table>\n        <tr><th>단계<\/th><th>시간<\/th><th>활동<\/th><\/tr>\n        <tr><td>도입<\/td><td>5분<\/td><td>은행 번호표와 줄서기 사례로 FIFO 발견<\/td><\/tr>\n        <tr><td>전개 1<\/td><td>15분<\/td><td>큐, 삽입, 삭제, front 개념 학습<\/td><\/tr>\n        <tr><td>전개 2<\/td><td>20분<\/td><td>개념별 코드 분석 및 실행 결과 예측<\/td><\/tr>\n        <tr><td>정리<\/td><td>10분<\/td><td>6문항 자동 채점 및 상세 풀이 확인<\/td><\/tr>\n      <\/table>\n    <\/div>\n    <div>\n      <h3>핵심 용어<\/h3>\n      <table>\n        <tr><th>용어<\/th><th>뜻<\/th><\/tr>\n        <tr><td>큐(queue)<\/td><td>먼저 들어온 자료가 먼저 나가는 선형 데이터 구조<\/td><\/tr>\n        <tr><td>FIFO<\/td><td>First In First Out, 선입 선출<\/td><\/tr>\n        <tr><td>삽입(push/enqueue)<\/td><td>큐의 입구 쪽에 새 자료를 저장하는 연산<\/td><\/tr>\n        <tr><td>삭제(pop/dequeue)<\/td><td>출구(front)의 자료를 제거하는 연산<\/td><\/tr>\n        <tr><td>front<\/td><td>가장 먼저 삭제될 자료가 위치한 출구 쪽<\/td><\/tr>\n      <\/table>\n    <\/div>\n  <\/div>\n  <div class=\"callout\">교과서의 은행 번호표 사례처럼, 먼저 번호표를 받은 고객이 먼저 업무를 처리하는 원리가 큐의 핵심입니다.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"concept1\">\n  <h2>2. 개념 1 — 큐와 선입 선출(FIFO)<\/h2>\n  <p><strong>큐(queue)<\/strong>는 자료를 한 줄로 관리하는 선형 데이터 구조입니다. 먼저 저장된 자료가 먼저 제거되므로 <strong>선입 선출<\/strong> 방식이라고 합니다.<\/p>\n  <div class=\"queue-visual\">\n    <span class=\"arrow\">출구(front) ←<\/span>\n    <span class=\"qitem\">1<\/span><span class=\"qitem\">2<\/span><span class=\"qitem\">3<\/span>\n    <span class=\"arrow\">← 입구<\/span>\n  <\/div>\n  <div class=\"callout warning\">그림에서는 1이 가장 먼저 들어왔으므로 가장 먼저 나갑니다. 3은 가장 나중에 들어온 자료입니다.<\/div>\n\n  <h3>개념 코드 1<\/h3>\n  <div class=\"codebox\"><pre>queue = [1, 2, 3]\n\nprint(queue[0])\nprint(queue)<\/pre><\/div>\n  <ul class=\"line-explain\">\n    <li><span class=\"line-no\">1행<\/span><code>queue<\/code> 리스트에 1, 2, 3이 들어 있습니다. 왼쪽의 1이 가장 먼저 들어온 자료입니다.<\/li>\n    <li><span class=\"line-no\">3행<\/span><code>queue[0]<\/code>은 첫 번째 요소인 1을 확인합니다.<\/li>\n    <li><span class=\"line-no\">4행<\/span>현재 큐 전체 상태인 <code>[1, 2, 3]<\/code>을 출력합니다.<\/li>\n  <\/ul>\n  <div class=\"callout success\"><strong>실행 결과<\/strong><br>1<br>[1, 2, 3]<\/div>\n\n  <div class=\"card quiz\" data-q=\"q1\">\n    <h3>문제 1. 위 코드와 큐의 원리에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n    <p class=\"small\">옳은 것 3개, 틀린 것 2개입니다.<\/p>\n    <label class=\"option\"><input type=\"checkbox\" value=\"0\">① queue[0]의 값은 1이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"1\">② 1은 3보다 먼저 큐에 들어온 자료이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"2\">③ FIFO 방식에서는 3이 가장 먼저 제거된다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"3\">④ print(queue)는 [1, 2, 3]을 출력한다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ queue[0]을 출력하면 리스트에서 1이 자동으로 삭제된다.<\/label>\n    <div class=\"feedback\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"card\" id=\"concept2\">\n  <h2>3. 개념 2 — 삽입 연산<\/h2>\n  <p>삽입은 새로운 자료를 큐의 <strong>입구<\/strong>에 넣는 연산입니다. 리스트에서는 <code>append()<\/code>를 이용하여 마지막 위치에 추가할 수 있습니다.<\/p>\n\n  <h3>개념 코드 2<\/h3>\n  <div class=\"codebox\"><pre>queue = []\n\nqueue.append(1)\nqueue.append(2)\nqueue.append(3)\n\nprint(queue)<\/pre><\/div>\n  <ul class=\"line-explain\">\n    <li><span class=\"line-no\">1행<\/span>빈 리스트를 만들어 큐로 사용합니다.<\/li>\n    <li><span class=\"line-no\">3행<\/span>1을 큐에 삽입합니다. 상태는 <code>[1]<\/code>입니다.<\/li>\n    <li><span class=\"line-no\">4행<\/span>2를 입구에 추가합니다. 상태는 <code>[1, 2]<\/code>입니다.<\/li>\n    <li><span class=\"line-no\">5행<\/span>3을 추가합니다. 상태는 <code>[1, 2, 3]<\/code>입니다.<\/li>\n  <\/ul>\n  <div class=\"callout success\"><strong>실행 결과<\/strong><br>[1, 2, 3]<\/div>\n\n  <div class=\"card quiz\" data-q=\"q2\">\n    <h3>문제 2. 위 삽입 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n    <label class=\"option\"><input type=\"checkbox\" value=\"0\">① 처음 queue는 비어 있다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"1\">② append(2)를 실행한 직후 큐는 [1, 2]이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"2\">③ append()는 리스트의 첫 번째 위치에만 값을 넣는다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 마지막 출력 결과는 [1, 2, 3]이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 3은 1보다 먼저 큐에 삽입된다.<\/label>\n    <div class=\"feedback\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"card\" id=\"concept3\">\n  <h2>4. 개념 3 — 삭제 연산<\/h2>\n  <p>삭제는 큐의 출구인 <strong>front<\/strong>에서 가장 먼저 들어온 자료를 제거하는 연산입니다. 리스트에서는 <code>pop(0)<\/code>을 사용할 수 있습니다.<\/p>\n\n  <h3>개념 코드 3<\/h3>\n  <div class=\"codebox\"><pre>queue = [1, 2, 3]\n\nremoved = queue.pop(0)\n\nprint(removed)\nprint(queue)<\/pre><\/div>\n  <ul class=\"line-explain\">\n    <li><span class=\"line-no\">1행<\/span>1, 2, 3이 차례대로 들어 있는 큐입니다.<\/li>\n    <li><span class=\"line-no\">3행<\/span><code>pop(0)<\/code>은 인덱스 0의 값 1을 제거하고 반환합니다.<\/li>\n    <li><span class=\"line-no\">5행<\/span>삭제된 값 1을 출력합니다.<\/li>\n    <li><span class=\"line-no\">6행<\/span>삭제 후 큐는 <code>[2, 3]<\/code>입니다.<\/li>\n  <\/ul>\n  <div class=\"callout success\"><strong>실행 결과<\/strong><br>1<br>[2, 3]<\/div>\n\n  <div class=\"card quiz\" data-q=\"q3\">\n    <h3>문제 3. 위 삭제 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n    <label class=\"option\"><input type=\"checkbox\" value=\"0\">① pop(0)은 첫 번째 요소를 제거한다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"1\">② removed에는 1이 저장된다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 코드 실행 후 queue는 [1, 2]가 된다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 삭제되는 자료는 가장 나중에 들어온 3이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 코드 실행 후 큐의 길이는 2이다.<\/label>\n    <div class=\"feedback\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"card\" id=\"concept4\">\n  <h2>5. 개념 4 — front와 입구 구분<\/h2>\n  <p>큐에서는 삽입과 삭제가 같은 위치에서 일어나지 않습니다. 새 자료는 입구 쪽에 들어오고, 오래 기다린 자료는 front 쪽에서 나갑니다.<\/p>\n\n  <h3>개념 코드 4<\/h3>\n  <div class=\"codebox\"><pre>queue = [\"A\", \"B\", \"C\"]\n\nfront = queue[0]\nrear = queue[-1]\n\nprint(front)\nprint(rear)<\/pre><\/div>\n  <ul class=\"line-explain\">\n    <li><span class=\"line-no\">1행<\/span>A가 가장 먼저, C가 가장 나중에 들어왔습니다.<\/li>\n    <li><span class=\"line-no\">3행<\/span><code>queue[0]<\/code>은 출구 쪽 자료 A를 확인합니다.<\/li>\n    <li><span class=\"line-no\">4행<\/span><code>queue[-1]<\/code>은 마지막 요소 C를 확인합니다.<\/li>\n    <li><span class=\"line-no\">6~7행<\/span>A와 C를 차례대로 출력합니다. 이 코드는 자료를 삭제하지 않습니다.<\/li>\n  <\/ul>\n  <div class=\"callout success\"><strong>실행 결과<\/strong><br>A<br>C<\/div>\n\n  <div class=\"card quiz\" data-q=\"q4\">\n    <h3>문제 4. 위 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n    <label class=\"option\"><input type=\"checkbox\" value=\"0\">① front의 값은 A이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"1\">② rear의 값은 C이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"2\">③ queue[-1]은 첫 번째 요소를 의미한다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 이 코드만으로 A가 큐에서 삭제된다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ A는 C보다 먼저 삭제될 자료이다.<\/label>\n    <div class=\"feedback\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"card\" id=\"concept5\">\n  <h2>6. 개념 5 — 빈 큐 확인<\/h2>\n  <p>빈 큐에서 삭제를 시도하면 오류가 발생할 수 있으므로, 삭제 전 큐가 비어 있는지 확인해야 합니다.<\/p>\n\n  <h3>개념 코드 5<\/h3>\n  <div class=\"codebox\"><pre>queue = []\n\nif len(queue) == 0:\n    print(\"큐가 비어 있습니다.\")\nelse:\n    print(queue.pop(0))<\/pre><\/div>\n  <ul class=\"line-explain\">\n    <li><span class=\"line-no\">1행<\/span>큐를 빈 리스트로 만듭니다.<\/li>\n    <li><span class=\"line-no\">3행<\/span>큐의 길이가 0인지 검사합니다.<\/li>\n    <li><span class=\"line-no\">4행<\/span>비어 있으므로 안내 문장을 출력합니다.<\/li>\n    <li><span class=\"line-no\">5~6행<\/span>큐에 자료가 있을 때만 첫 번째 자료를 삭제합니다.<\/li>\n  <\/ul>\n  <div class=\"callout success\"><strong>실행 결과<\/strong><br>큐가 비어 있습니다.<\/div>\n\n  <div class=\"card quiz\" data-q=\"q5\">\n    <h3>문제 5. 위 빈 큐 확인 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n    <label class=\"option\"><input type=\"checkbox\" value=\"0\">① len(queue)의 값은 0이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"1\">② 조건식 len(queue) == 0은 참이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"2\">③ else 블록의 pop(0)이 실행된다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 실행 결과로 “큐가 비어 있습니다.”가 출력된다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 빈 큐에서 pop(0)을 실행해도 항상 안전하다.<\/label>\n    <div class=\"feedback\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"card\" id=\"concept6\">\n  <h2>7. 개념 6 — 큐의 전체 동작 추적<\/h2>\n  <p>삽입과 삭제가 섞인 코드는 각 연산이 끝날 때마다 큐의 상태를 기록하면 정확하게 이해할 수 있습니다.<\/p>\n\n  <h3>개념 코드 6<\/h3>\n  <div class=\"codebox\"><pre>queue = []\n\nqueue.append(10)\nqueue.append(20)\nprint(queue.pop(0))\nqueue.append(30)\n\nprint(queue)<\/pre><\/div>\n  <table>\n    <tr><th>순서<\/th><th>연산<\/th><th>큐 상태<\/th><th>출력<\/th><\/tr>\n    <tr><td>1<\/td><td>빈 큐 생성<\/td><td>[]<\/td><td>-<\/td><\/tr>\n    <tr><td>2<\/td><td>10 삽입<\/td><td>[10]<\/td><td>-<\/td><\/tr>\n    <tr><td>3<\/td><td>20 삽입<\/td><td>[10, 20]<\/td><td>-<\/td><\/tr>\n    <tr><td>4<\/td><td>첫 자료 삭제<\/td><td>[20]<\/td><td>10<\/td><\/tr>\n    <tr><td>5<\/td><td>30 삽입<\/td><td>[20, 30]<\/td><td>-<\/td><\/tr>\n    <tr><td>6<\/td><td>전체 출력<\/td><td>[20, 30]<\/td><td>[20, 30]<\/td><\/tr>\n  <\/table>\n\n  <div class=\"interactive-only\">\n    <h3>직접 조작해 보기<\/h3>\n    <div class=\"queue-visual\" id=\"simQueue\"><span class=\"small\">현재 큐가 비어 있습니다.<\/span><\/div>\n    <div class=\"controls\">\n      <input id=\"simValue\" placeholder=\"삽입할 값\">\n      <button class=\"btn-primary\" onclick=\"simPush()\">삽입<\/button>\n      <button class=\"btn-light\" onclick=\"simPop()\">삭제<\/button>\n      <button class=\"btn-light\" onclick=\"simReset()\">초기화<\/button>\n    <\/div>\n    <p id=\"simMessage\" class=\"small\"><\/p>\n  <\/div>\n\n  <div class=\"card quiz\" data-q=\"q6\">\n    <h3>문제 6. 위 전체 동작 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n    <label class=\"option\"><input type=\"checkbox\" value=\"0\">① 첫 번째 출력값은 10이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"1\">② pop(0) 실행 직후 큐는 [20]이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 30은 20보다 먼저 큐에 들어왔다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 마지막 큐 상태는 [20, 30]이다.<\/label>\n    <label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 마지막 출력 결과는 [10, 20, 30]이다.<\/label>\n    <div class=\"feedback\"><\/div>\n  <\/div>\n<\/section>\n\n<section class=\"card\" id=\"assessment\">\n  <h2>8. 종합 제출 및 결과 저장<\/h2>\n  <p>각 문항에서 옳다고 판단한 보기 3개를 선택한 뒤 제출하세요. 한 문항은 정답 3개를 모두 선택하고 오답을 선택하지 않아야 정답으로 처리됩니다.<\/p>\n  <div class=\"progress\"><div id=\"progressBar\"><\/div><\/div>\n  <p id=\"progressText\" class=\"small\">응답 완료: 0 / 6<\/p>\n  <div class=\"submit-area\">\n    <button class=\"btn-primary\" onclick=\"gradeQuiz()\">채점하고 TXT 저장<\/button>\n    <button class=\"btn-light\" onclick=\"resetQuiz()\">응답 초기화<\/button>\n  <\/div>\n  <div id=\"scoreBox\" class=\"score-box hidden\"><\/div>\n  <div id=\"saveInfo\" class=\"callout hidden\"><\/div>\n<\/section>\n<\/main>\n\n<footer>\n  큐 01차시 · 개념 기반 목표 지향 학습 · 자동 채점 및 상세 풀이\n<\/footer>\n\n<script>\nconst answers = {\n  q1:[0,1,3],\n  q2:[0,1,3],\n  q3:[0,1,4],\n  q4:[0,1,4],\n  q5:[0,1,3],\n  q6:[0,1,3]\n};\n\nconst explanations = {\n q1:{\n  title:\"큐와 FIFO\",\n  correct:\"① queue[0]은 첫 번째 값 1이다. ② 1은 3보다 먼저 들어왔다. ④ 리스트 전체는 [1, 2, 3]이다.\",\n  wrong:\"③ FIFO에서는 가장 먼저 들어온 1이 먼저 제거된다. ⑤ 단순 조회는 삭제 연산이 아니다.\"\n },\n q2:{\n  title:\"삽입 연산\",\n  correct:\"① 처음에는 빈 리스트이다. ② 1 다음에 2를 append하면 [1, 2]이다. ④ 마지막 상태는 [1, 2, 3]이다.\",\n  wrong:\"③ append()는 리스트 끝에 추가한다. ⑤ 3은 1보다 나중에 삽입된다.\"\n },\n q3:{\n  title:\"삭제 연산\",\n  correct:\"① pop(0)은 인덱스 0을 제거한다. ② 반환값 1이 removed에 저장된다. ⑤ 남은 요소는 2개이다.\",\n  wrong:\"③ 삭제 후 상태는 [2, 3]이다. ④ FIFO에서는 가장 먼저 들어온 1이 삭제된다.\"\n },\n q4:{\n  title:\"front와 입구\",\n  correct:\"① 첫 요소 A가 front이다. ② 마지막 요소 C가 rear 쪽이다. ⑤ A가 C보다 먼저 삭제된다.\",\n  wrong:\"③ -1은 마지막 요소를 가리킨다. ④ 값을 조회하는 것만으로 자료는 삭제되지 않는다.\"\n },\n q5:{\n  title:\"빈 큐 확인\",\n  correct:\"① 빈 리스트의 길이는 0이다. ② 조건은 참이다. ④ 안내 문장이 출력된다.\",\n  wrong:\"③ 조건이 참이므로 else는 실행되지 않는다. ⑤ 빈 리스트의 pop(0)은 오류를 일으킬 수 있다.\"\n },\n q6:{\n  title:\"전체 동작 추적\",\n  correct:\"① pop(0)이 반환한 10이 출력된다. ② 삭제 직후 [20]이다. ④ 30을 삽입한 최종 상태는 [20, 30]이다.\",\n  wrong:\"③ 20이 30보다 먼저 들어왔다. ⑤ 10은 이미 삭제되었으므로 최종 큐에 없다.\"\n }\n};\n\nfunction jumpTo(id){\n  if(id) document.getElementById(id).scrollIntoView({behavior:\"smooth\",block:\"start\"});\n}\n\nfunction selectedFor(q){\n  return [...document.querySelectorAll(`[data-q=\"${q}\"] input:checked`)]\n    .map(x=>Number(x.value)).sort((a,b)=>a-b);\n}\nfunction arraysEqual(a,b){return a.length===b.length && a.every((v,i)=>v===b[i]);}\n\nfunction updateProgress(){\n  let done=0;\n  Object.keys(answers).forEach(q=>{ if(selectedFor(q).length>0) done++; });\n  document.getElementById(\"progressBar\").style.width=(done/6*100)+\"%\";\n  document.getElementById(\"progressText\").textContent=`응답 완료: ${done} / 6`;\n}\ndocument.querySelectorAll('.quiz input').forEach(i=>i.addEventListener('change',updateProgress));\n\nfunction cleanName(s){return s.trim().replace(/[\\\\/:*?\"<>|]/g,\"_\").replace(/\\s+/g,\"_\");}\nfunction nowText(){\n  const d=new Date(), p=n=>String(n).padStart(2,\"0\");\n  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;\n}\nfunction fileTime(){\n  const d=new Date(), p=n=>String(n).padStart(2,\"0\");\n  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;\n}\nfunction labels(nums){return nums.map(n=>\"①②③④⑤\"[n]).join(\", \");}\n\nfunction gradeQuiz(){\n  const sid=document.getElementById(\"studentId\").value.trim();\n  const sname=document.getElementById(\"studentName\").value.trim();\n  if(!sid||!sname){alert(\"학번과 이름을 모두 입력하세요.\");document.getElementById(\"overview\").scrollIntoView({behavior:\"smooth\"});return;}\n  let score=0, report=[];\n  Object.keys(answers).forEach((q,idx)=>{\n    const chosen=selectedFor(q);\n    const ok=arraysEqual(chosen,answers[q]);\n    if(ok) score++;\n    const box=document.querySelector(`[data-q=\"${q}\"] .feedback`);\n    box.className=\"feedback \"+(ok?\"correct\":\"wrong\");\n    box.innerHTML=`<strong>${ok?\"정답\":\"오답\"}<\/strong><br>\n      선택: ${chosen.length?labels(chosen):\"미응답\"}<br>\n      정답: ${labels(answers[q])}<br>\n      <strong>옳은 보기 해설:<\/strong> ${explanations[q].correct}<br>\n      <strong>틀린 보기 해설:<\/strong> ${explanations[q].wrong}`;\n    report.push(\n`[${idx+1}번] ${explanations[q].title}\n판정: ${ok?\"정답\":\"오답\"}\n학생 선택: ${chosen.length?labels(chosen):\"미응답\"}\n정답: ${labels(answers[q])}\n옳은 보기 해설: ${explanations[q].correct}\n틀린 보기 해설: ${explanations[q].wrong}`\n    );\n  });\n  const percent=Math.round(score/6*100);\n  const t=nowText();\n  const result =\n`큐 01차시 학습 평가 결과\n================================\n학번: ${sid}\n이름: ${sname}\n점수: ${score}/6 (${percent}점)\n응시 시각: ${t}\n평가 방식: 각 문항 옳은 보기 3개 모두 선택\n\n${report.join(\"\\n\\n\")}\n\n================================\n총평\n${percent===100?\"큐의 FIFO 원리와 삽입·삭제 과정을 정확하게 이해했습니다.\":percent>=70?\"핵심 개념을 대체로 이해했습니다. 오답 문항의 큐 상태 변화를 다시 추적해 보세요.\":\"삽입 위치와 삭제 위치, front의 의미를 중심으로 개념과 코드를 다시 학습하세요.\"}\n`;\n  const blob=new Blob([\"\\ufeff\"+result],{type:\"text/plain;charset=utf-8\"});\n  const a=document.createElement(\"a\");\n  a.href=URL.createObjectURL(blob);\n  a.download=`${cleanName(sid)}_${cleanName(sname)}_${percent}_큐01차시_${fileTime()}.txt`;\n  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);\n\n  const scoreBox=document.getElementById(\"scoreBox\");\n  scoreBox.classList.remove(\"hidden\");\n  scoreBox.textContent=`${sname} 학생: ${score}/6문항, ${percent}점`;\n  const saveInfo=document.getElementById(\"saveInfo\");\n  saveInfo.classList.remove(\"hidden\");\n  saveInfo.innerHTML=`결과 파일이 저장되었습니다.<br><strong>${cleanName(sid)}_${cleanName(sname)}_${percent}_큐01차시_${fileTime()}.txt<\/strong><br>각 문항의 정오답, 학생 선택, 정답, 상세 풀이가 포함됩니다.`;\n  document.querySelectorAll(\".feedback\").forEach(x=>x.style.display=\"block\");\n  scoreBox.scrollIntoView({behavior:\"smooth\",block:\"center\"});\n}\n\nfunction resetQuiz(){\n  if(!confirm(\"모든 응답과 채점 결과를 초기화할까요?\")) return;\n  document.querySelectorAll('.quiz input').forEach(i=>i.checked=false);\n  document.querySelectorAll('.feedback').forEach(f=>{f.className=\"feedback\";f.innerHTML=\"\";f.style.display=\"\";});\n  document.getElementById(\"scoreBox\").classList.add(\"hidden\");\n  document.getElementById(\"saveInfo\").classList.add(\"hidden\");\n  updateProgress();\n}\n\nlet sim=[];\nfunction renderSim(){\n  const box=document.getElementById(\"simQueue\");\n  if(sim.length===0){box.innerHTML='<span class=\"small\">현재 큐가 비어 있습니다.<\/span>';return;}\n  box.innerHTML='<span class=\"arrow\">출구(front) ←<\/span>'+sim.map(v=>`<span class=\"qitem\">${escapeHtml(v)}<\/span>`).join(\"\")+'<span class=\"arrow\">← 입구<\/span>';\n}\nfunction escapeHtml(s){return String(s).replace(/[&<>\"']/g,m=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",\"\\\"\":\"&quot;\",\"'\":\"&#039;\"}[m]));}\nfunction simPush(){\n  const inp=document.getElementById(\"simValue\");\n  const v=inp.value.trim();\n  if(!v){alert(\"삽입할 값을 입력하세요.\");return;}\n  sim.push(v); inp.value=\"\";\n  document.getElementById(\"simMessage\").textContent=`${v}을(를) 입구에 삽입했습니다.`;\n  renderSim();\n}\nfunction simPop(){\n  if(sim.length===0){document.getElementById(\"simMessage\").textContent=\"빈 큐에서는 삭제할 수 없습니다.\";return;}\n  const v=sim.shift();\n  document.getElementById(\"simMessage\").textContent=`front의 ${v}을(를) 삭제했습니다.`;\n  renderSim();\n}\nfunction simReset(){sim=[];document.getElementById(\"simMessage\").textContent=\"큐를 초기화했습니다.\";renderSim();}\n<\/script>\n<\/body>\n<\/html>\n"}, {"lesson": 2, "title": "큐 02차시", "content": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<base target=\\\"_self\\\">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>큐 02차시 상세학습 수업지도안<\/title>\n<style>\n:root{\n --bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4ef;\n --blue:#1d4ed8;--blue2:#2563eb;--soft:#eef4ff;--green:#166534;--greenbg:#ecfdf3;\n --red:#991b1b;--redbg:#fff1f2;--purple:#7c3aed;--code:#0f172a;--codeink:#e2e8f0;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Malgun Gothic\",\"Apple SD Gothic Neo\",Arial,sans-serif;line-height:1.7}\nheader{background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff;padding:40px 20px}\n.wrap{max-width:1180px;margin:auto}\nh1{margin:0 0 8px;font-size:clamp(30px,4vw,48px)}\n.subtitle{font-size:18px;opacity:.95}\n.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}\n.badge{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}\nnav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}\n.navin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}\nbutton,select{font:inherit}\nbutton{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}\n.primary{background:var(--blue2);color:white}\n.light{background:#edf2f7;color:#24324a}\nselect{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:white}\nmain{max-width:1180px;margin:24px auto;padding:0 16px 60px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 8px 25px rgba(15,23,42,.05)}\n.card h2{margin-top:0;font-size:28px}\n.card h3{margin-top:28px;font-size:21px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n@media(max-width:820px){.grid2{grid-template-columns:1fr}}\ninput[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}\n.student{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media(max-width:620px){.student{grid-template-columns:1fr}}\nlabel strong{display:block;margin-bottom:5px}\ntable{width:100%;border-collapse:collapse;margin:12px 0}\nth,td{border:1px solid var(--line);padding:10px;vertical-align:top}\nth{background:#edf4ff}\n.callout{background:var(--soft);border-left:5px solid var(--blue2);padding:14px 16px;border-radius:10px;margin:14px 0}\n.warn{background:#fff7ed;border-left-color:#d97706}\n.good{background:var(--greenbg);border-left-color:#16a34a}\n.code{background:var(--code);color:var(--codeink);padding:18px;border-radius:14px;overflow:auto}\npre{margin:0;font:15px/1.6 Consolas,\"Courier New\",monospace;white-space:pre}\n.explain{list-style:none;padding:0;margin:12px 0}\n.explain li{padding:8px 10px;border-bottom:1px dashed var(--line)}\n.ln{display:inline-block;min-width:38px;color:var(--blue2);font-weight:800}\n.quiz{border-top:4px solid var(--purple)}\n.option{display:block;padding:10px 12px;margin:9px 0;border:1px solid var(--line);border-radius:10px}\n.option:hover{background:#faf8ff}\n.option input{margin-right:9px;transform:scale(1.15)}\n.feedback{display:none;padding:14px;margin-top:14px;border-radius:10px}\n.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}\n.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fda4af;color:#881337}\n.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}\n.progress div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#10b981);transition:.3s}\n.score{font-size:25px;font-weight:900;text-align:center;background:#eff6ff;padding:18px;border-radius:14px}\n.hidden{display:none!important}\n.small{font-size:14px;color:var(--muted)}\n@media print{nav,.submit{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:#fff}header{background:#fff;color:#000;border-bottom:2px solid #333}}\n<\/style>\n<\/head>\n<body>\n<header>\n<div class=\"wrap\">\n<h1>큐 02차시 상세학습 수업지도안<\/h1>\n<div class=\"subtitle\">은행 번호표 사례로 배우는 큐의 삽입·삭제·상태 변화와 대기열 문제 해결<\/div>\n<div class=\"badges\">\n<span class=\"badge\">50분 수업<\/span><span class=\"badge\">개념 6개<\/span>\n<span class=\"badge\">코드 6개<\/span><span class=\"badge\">복수 정답형 6문항<\/span>\n<span class=\"badge\">자동 채점·TXT 저장<\/span>\n<\/div>\n<\/div>\n<\/header>\n\n<nav>\n<div class=\"navin\">\n<button class=\"light\" onclick=\"scrollTo({top:0,behavior:'smooth'})\">맨 위<\/button>\n<select onchange=\"go(this.value)\">\n<option value=\"\">학습 위치 이동<\/option>\n<option value=\"overview\">수업 개요<\/option>\n<option value=\"c1\">1. 은행 번호표와 큐<\/option>\n<option value=\"c2\">2. 삽입 후 상태<\/option>\n<option value=\"c3\">3. 삭제 후 상태<\/option>\n<option value=\"c4\">4. 연속 연산 추적<\/option>\n<option value=\"c5\">5. 대기 인원 계산<\/option>\n<option value=\"c6\">6. 조건부 대기 문제<\/option>\n<option value=\"submit\">종합 제출<\/option>\n<\/select>\n<button class=\"light\" onclick=\"window.print()\">인쇄/PDF<\/button>\n<\/div>\n<\/nav>\n\n<main>\n<section class=\"card\" id=\"overview\">\n<h2>1. 수업 개요<\/h2>\n<div class=\"student\">\n<label><strong>학번<\/strong><input type=\"text\" id=\"sid\" placeholder=\"예: 1101\" maxlength=\"20\"><\/label>\n<label><strong>이름<\/strong><input type=\"text\" id=\"sname\" placeholder=\"예: 홍길동\" maxlength=\"20\"><\/label>\n<\/div>\n\n<div class=\"grid2\">\n<div>\n<h3>학습 목표<\/h3>\n<ol>\n<li>은행 번호표 발급과 업무 처리 과정을 큐 연산과 연결할 수 있다.<\/li>\n<li>삽입과 삭제 이후 큐의 상태를 정확히 나타낼 수 있다.<\/li>\n<li>연속된 큐 연산을 단계별로 추적할 수 있다.<\/li>\n<li>대기 인원과 대기 허용 조건이 있는 문제를 해결할 수 있다.<\/li>\n<\/ol>\n<\/div>\n<div>\n<h3>수업 흐름<\/h3>\n<table>\n<tr><th>단계<\/th><th>시간<\/th><th>활동<\/th><\/tr>\n<tr><td>도입<\/td><td>5분<\/td><td>은행 번호표 상황 관찰<\/td><\/tr>\n<tr><td>전개 1<\/td><td>15분<\/td><td>삽입·삭제와 큐 상태 변화 이해<\/td><\/tr>\n<tr><td>전개 2<\/td><td>20분<\/td><td>코드 분석 및 대기열 문제 해결<\/td><\/tr>\n<tr><td>정리<\/td><td>10분<\/td><td>자동 채점과 상세 풀이 확인<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"callout\">번호표 발급은 큐의 삽입, 업무 처리는 큐의 삭제에 해당합니다. 먼저 번호표를 받은 고객이 먼저 업무를 처리합니다.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c1\">\n<h2>2. 개념 1 — 은행 번호표와 큐 연산<\/h2>\n<p>은행에 온 고객은 도착한 순서대로 번호표를 받습니다. 먼저 온 고객이 먼저 업무를 처리하므로 은행 대기열은 큐의 선입 선출 원리와 같습니다.<\/p>\n\n<h3>개념 코드 1<\/h3>\n<div class=\"code\"><pre>queue = []\n\nqueue.append(1)\n\nprint(\"고객 1 번호표 발급\")\nprint(queue)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>대기 고객 번호를 저장할 빈 리스트를 만듭니다.<\/li>\n<li><span class=\"ln\">3행<\/span>고객 1이 번호표를 받았으므로 1을 큐에 삽입합니다.<\/li>\n<li><span class=\"ln\">5행<\/span>고객의 행동을 출력합니다.<\/li>\n<li><span class=\"ln\">6행<\/span>현재 큐 상태인 <code>[1]<\/code>을 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>고객 1 번호표 발급<br>[1]<\/div>\n\n<div class=\"card quiz\" data-q=\"q1\">\n<h3>문제 1. 위 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 번호표 발급은 큐의 삽입에 해당한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② queue.append(1)은 고객 1을 대기열에 넣는다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 코드 실행 후 queue는 빈 리스트이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 마지막 출력 결과는 [1]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 번호표 발급은 큐의 삭제에 해당한다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c2\">\n<h2>3. 개념 2 — 여러 고객의 삽입과 상태 변화<\/h2>\n<p>고객이 차례대로 번호표를 받으면 발급 순서대로 큐에 저장됩니다. 가장 먼저 들어온 고객이 리스트의 첫 번째 위치에 있습니다.<\/p>\n\n<h3>개념 코드 2<\/h3>\n<div class=\"code\"><pre>queue = []\n\nfor customer in [1, 2, 3]:\n    queue.append(customer)\n    print(customer, \"번 고객 삽입:\", queue)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>빈 큐를 만듭니다.<\/li>\n<li><span class=\"ln\">3행<\/span>고객 1, 2, 3을 차례대로 반복합니다.<\/li>\n<li><span class=\"ln\">4행<\/span>현재 고객 번호를 큐의 마지막에 삽입합니다.<\/li>\n<li><span class=\"ln\">5행<\/span>각 삽입 직후의 큐 상태를 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>1 번 고객 삽입: [1]<br>2 번 고객 삽입: [1, 2]<br>3 번 고객 삽입: [1, 2, 3]<\/div>\n\n<div class=\"card quiz\" data-q=\"q2\">\n<h3>문제 2. 위 삽입 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 반복문은 총 3회 실행된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 고객 2 삽입 직후 큐는 [1, 2]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 고객 3이 고객 1보다 먼저 삭제된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 최종 큐 상태는 [1, 2, 3]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ append()는 기존 첫 번째 고객을 자동으로 삭제한다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c3\">\n<h2>4. 개념 3 — 업무 처리와 삭제 후 상태<\/h2>\n<p>업무를 시작하는 고객은 가장 먼저 기다리기 시작한 고객입니다. 따라서 리스트의 첫 번째 요소를 <code>pop(0)<\/code>으로 제거합니다.<\/p>\n\n<h3>개념 코드 3<\/h3>\n<div class=\"code\"><pre>queue = [1, 2, 3]\n\nserved = queue.pop(0)\n\nprint(\"업무 처리 고객:\", served)\nprint(\"남은 대기열:\", queue)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>고객 1, 2, 3이 순서대로 기다립니다.<\/li>\n<li><span class=\"ln\">3행<\/span>가장 먼저 기다린 고객 1을 삭제하고 반환합니다.<\/li>\n<li><span class=\"ln\">5행<\/span>업무를 처리한 고객 번호를 출력합니다.<\/li>\n<li><span class=\"ln\">6행<\/span>삭제 후 남은 대기열 <code>[2, 3]<\/code>을 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>업무 처리 고객: 1<br>남은 대기열: [2, 3]<\/div>\n\n<div class=\"card quiz\" data-q=\"q3\">\n<h3>문제 3. 위 삭제 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① served에는 1이 저장된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② pop(0)은 front의 고객을 제거한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 삭제 후 남은 대기열은 [1, 2]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 고객 3이 가장 먼저 업무를 처리한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 삭제 후 큐에는 고객 2와 3이 남는다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c4\">\n<h2>5. 개념 4 — 연속된 삽입·삭제 연산 추적<\/h2>\n<p>여러 연산이 이어질 때는 각 단계가 끝난 뒤 큐 상태를 기록하면 정확하게 결과를 예측할 수 있습니다.<\/p>\n\n<h3>개념 코드 4<\/h3>\n<div class=\"code\"><pre>queue = []\n\nqueue.append(1)\nqueue.append(2)\nqueue.pop(0)\nqueue.append(3)\n\nprint(queue)<\/pre><\/div>\n<table>\n<tr><th>단계<\/th><th>연산<\/th><th>큐 상태<\/th><\/tr>\n<tr><td>1<\/td><td>고객 1 삽입<\/td><td>[1]<\/td><\/tr>\n<tr><td>2<\/td><td>고객 2 삽입<\/td><td>[1, 2]<\/td><\/tr>\n<tr><td>3<\/td><td>고객 1 삭제<\/td><td>[2]<\/td><\/tr>\n<tr><td>4<\/td><td>고객 3 삽입<\/td><td>[2, 3]<\/td><\/tr>\n<\/table>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>[2, 3]<\/div>\n\n<div class=\"card quiz\" data-q=\"q4\">\n<h3>문제 4. 위 연속 연산 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 고객 1과 2가 삽입된 뒤 고객 1이 삭제된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② pop(0) 실행 직후 큐는 [2]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 고객 3은 고객 2보다 먼저 큐에 들어온다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 마지막 큐 상태는 [2, 3]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 마지막 출력 결과는 [1, 2, 3]이다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c5\">\n<h2>6. 개념 5 — 현재 대기 인원 계산<\/h2>\n<p>현재 대기 인원은 큐에 저장된 요소의 개수와 같습니다. 리스트에서는 <code>len(queue)<\/code>로 계산합니다.<\/p>\n\n<h3>개념 코드 5<\/h3>\n<div class=\"code\"><pre>queue = [2, 3, 4]\n\nwaiting = len(queue)\n\nprint(\"현재 대기 인원:\", waiting)\nprint(\"다음 업무 고객:\", queue[0])<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>고객 2, 3, 4가 대기 중입니다.<\/li>\n<li><span class=\"ln\">3행<\/span>큐의 요소 수를 계산하여 <code>waiting<\/code>에 저장합니다.<\/li>\n<li><span class=\"ln\">5행<\/span>대기 인원 3명을 출력합니다.<\/li>\n<li><span class=\"ln\">6행<\/span>가장 먼저 업무를 처리할 고객 2를 확인합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>현재 대기 인원: 3<br>다음 업무 고객: 2<\/div>\n\n<div class=\"card quiz\" data-q=\"q5\">\n<h3>문제 5. 위 대기 인원 계산 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① len(queue)의 값은 3이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② queue[0]의 값은 2이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ waiting의 값은 4이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 현재 대기 중인 고객은 2, 3, 4이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ queue[0]을 출력하면 고객 2가 자동으로 삭제된다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c6\">\n<h2>7. 개념 6 — 대기 허용 인원에 따른 조건부 삽입<\/h2>\n<p>고객마다 기다릴 수 있는 최대 대기 인원이 다를 수 있습니다. 자신을 제외한 대기 고객 수가 허용 범위를 초과하면 번호표를 받지 않고 돌아갑니다.<\/p>\n\n<h3>개념 코드 6<\/h3>\n<div class=\"code\"><pre>queue = [2, 3]\nmax_wait = 1\n\nif len(queue) > max_wait:\n    print(\"대기 중단 후 귀가\")\nelse:\n    queue.append(4)\n    print(\"고객 4 번호표 발급\")\n\nprint(queue)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>현재 고객 2와 3, 두 명이 대기 중입니다.<\/li>\n<li><span class=\"ln\">2행<\/span>새 고객은 최대 1명까지 기다릴 수 있다고 설정합니다.<\/li>\n<li><span class=\"ln\">4행<\/span>현재 대기 인원 2명이 허용 인원 1명을 초과하는지 검사합니다.<\/li>\n<li><span class=\"ln\">5행<\/span>조건이 참이므로 새 고객은 번호표를 받지 않고 귀가합니다.<\/li>\n<li><span class=\"ln\">10행<\/span>큐는 변하지 않아 <code>[2, 3]<\/code>입니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>대기 중단 후 귀가<br>[2, 3]<\/div>\n\n<div class=\"card quiz\" data-q=\"q6\">\n<h3>문제 6. 위 조건부 삽입 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 현재 대기 인원은 2명이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② len(queue) &gt; max_wait 조건은 참이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 고객 4는 queue에 삽입된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 마지막 큐 상태는 [2, 3]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ else 블록이 실행되어 “고객 4 번호표 발급”이 출력된다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"submit\">\n<h2>8. 종합 제출 및 결과 저장<\/h2>\n<p>각 문항에서 옳은 보기 3개를 모두 선택하고 틀린 보기는 선택하지 않아야 정답으로 처리됩니다.<\/p>\n<div class=\"progress\"><div id=\"bar\"><\/div><\/div>\n<p id=\"progressText\" class=\"small\">응답 완료: 0 / 6<\/p>\n<div class=\"submit\">\n<button class=\"primary\" onclick=\"grade()\">채점하고 TXT 저장<\/button>\n<button class=\"light\" onclick=\"resetAll()\">응답 초기화<\/button>\n<\/div>\n<div id=\"score\" class=\"score hidden\"><\/div>\n<div id=\"save\" class=\"callout hidden\"><\/div>\n<\/section>\n<\/main>\n\n<script>\nconst answers={\n q1:[0,1,3], q2:[0,1,3], q3:[0,1,4],\n q4:[0,1,3], q5:[0,1,3], q6:[0,1,3]\n};\nconst exp={\n q1:{t:\"은행 번호표와 큐\",c:\"① 번호표 발급은 삽입이다. ② append(1)은 고객 1을 대기열에 넣는다. ④ 최종 상태는 [1]이다.\",w:\"③ 큐는 비어 있지 않다. ⑤ 번호표 발급은 삭제가 아니다.\"},\n q2:{t:\"여러 고객 삽입\",c:\"① 반복은 3회이다. ② 고객 2 삽입 직후 [1, 2]이다. ④ 최종 상태는 [1, 2, 3]이다.\",w:\"③ FIFO에서는 고객 1이 먼저 삭제된다. ⑤ append는 기존 자료를 삭제하지 않는다.\"},\n q3:{t:\"업무 처리와 삭제\",c:\"① served는 1이다. ② pop(0)은 front를 제거한다. ⑤ 남은 고객은 2와 3이다.\",w:\"③ 삭제 후 상태는 [2, 3]이다. ④ 고객 1이 가장 먼저 처리된다.\"},\n q4:{t:\"연속 연산 추적\",c:\"① 고객 1과 2 삽입 후 고객 1이 삭제된다. ② 삭제 직후 [2]이다. ④ 최종 상태는 [2, 3]이다.\",w:\"③ 고객 2가 3보다 먼저 들어왔다. ⑤ 고객 1은 이미 삭제되었다.\"},\n q5:{t:\"대기 인원 계산\",c:\"① 큐의 길이는 3이다. ② 첫 고객은 2이다. ④ 대기 고객은 2, 3, 4이다.\",w:\"③ waiting은 3이다. ⑤ 단순 조회는 삭제가 아니다.\"},\n q6:{t:\"조건부 삽입\",c:\"① 현재 2명이 기다린다. ② 2 > 1은 참이다. ④ 고객 4는 삽입되지 않아 [2, 3]이다.\",w:\"③ 고객 4는 귀가한다. ⑤ if 블록이 실행되고 else는 실행되지 않는다.\"}\n};\n\nfunction go(id){if(id)document.getElementById(id).scrollIntoView({behavior:\"smooth\"});}\nfunction selected(q){return [...document.querySelectorAll(`[data-q=\"${q}\"] input:checked`)].map(x=>+x.value).sort((a,b)=>a-b);}\nfunction eq(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}\nfunction labels(a){return a.map(i=>\"①②③④⑤\"[i]).join(\", \");}\nfunction update(){\n let n=0;Object.keys(answers).forEach(q=>{if(selected(q).length)n++;});\n document.getElementById(\"bar\").style.width=(n/6*100)+\"%\";\n document.getElementById(\"progressText\").textContent=`응답 완료: ${n} / 6`;\n}\ndocument.querySelectorAll(\".quiz input\").forEach(x=>x.addEventListener(\"change\",update));\n\nfunction clean(s){return s.trim().replace(/[\\\\/:*?\"<>|]/g,\"_\").replace(/\\s+/g,\"_\");}\nfunction now(){\n const d=new Date(),p=n=>String(n).padStart(2,\"0\");\n return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;\n}\nfunction ftime(){\n const d=new Date(),p=n=>String(n).padStart(2,\"0\");\n return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;\n}\n\nfunction grade(){\n const sid=document.getElementById(\"sid\").value.trim();\n const name=document.getElementById(\"sname\").value.trim();\n if(!sid||!name){alert(\"학번과 이름을 입력하세요.\");document.getElementById(\"overview\").scrollIntoView({behavior:\"smooth\"});return;}\n let correct=0,report=[];\n Object.keys(answers).forEach((q,i)=>{\n   const s=selected(q),ok=eq(s,answers[q]);if(ok)correct++;\n   const fb=document.querySelector(`[data-q=\"${q}\"] .feedback`);\n   fb.className=\"feedback \"+(ok?\"correct\":\"wrong\");\n   fb.innerHTML=`<strong>${ok?\"정답\":\"오답\"}<\/strong><br>학생 선택: ${s.length?labels(s):\"미응답\"}<br>정답: ${labels(answers[q])}<br><strong>옳은 보기 해설:<\/strong> ${exp[q].c}<br><strong>틀린 보기 해설:<\/strong> ${exp[q].w}`;\n   report.push(`[${i+1}번] ${exp[q].t}\n판정: ${ok?\"정답\":\"오답\"}\n학생 선택: ${s.length?labels(s):\"미응답\"}\n정답: ${labels(answers[q])}\n옳은 보기 해설: ${exp[q].c}\n틀린 보기 해설: ${exp[q].w}`);\n });\n const score=Math.round(correct/6*100),time=now();\n const text=`큐 02차시 학습 평가 결과\n================================\n학번: ${sid}\n이름: ${name}\n점수: ${correct}/6 (${score}점)\n응시 시각: ${time}\n평가 방식: 옳은 보기 3개 모두 선택\n\n${report.join(\"\\n\\n\")}\n\n================================\n총평\n${score===100?\"큐의 삽입·삭제와 대기열 상태 변화를 정확히 이해했습니다.\":score>=70?\"핵심 원리를 대체로 이해했습니다. 오답 문항의 단계별 큐 상태를 다시 추적하세요.\":\"번호표 발급과 업무 처리의 대응 관계, pop(0), len(queue)을 중심으로 다시 학습하세요.\"}`;\n const blob=new Blob([\"\\ufeff\"+text],{type:\"text/plain;charset=utf-8\"});\n const a=document.createElement(\"a\");\n a.href=URL.createObjectURL(blob);\n a.download=`${clean(sid)}_${clean(name)}_${score}_큐02차시_${ftime()}.txt`;\n document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);\n\n const sb=document.getElementById(\"score\");\n sb.classList.remove(\"hidden\");sb.textContent=`${name} 학생: ${correct}/6문항, ${score}점`;\n const si=document.getElementById(\"save\");\n si.classList.remove(\"hidden\");\n si.innerHTML=`결과 파일을 저장했습니다.<br><strong>${clean(sid)}_${clean(name)}_${score}_큐02차시_${ftime()}.txt<\/strong><br>각 문항 정오답, 선택 답안, 정답, 상세 풀이가 포함됩니다.`;\n sb.scrollIntoView({behavior:\"smooth\",block:\"center\"});\n}\nfunction resetAll(){\n if(!confirm(\"모든 응답과 채점 결과를 초기화할까요?\"))return;\n document.querySelectorAll(\".quiz input\").forEach(x=>x.checked=false);\n document.querySelectorAll(\".feedback\").forEach(x=>{x.className=\"feedback\";x.innerHTML=\"\";});\n document.getElementById(\"score\").classList.add(\"hidden\");\n document.getElementById(\"save\").classList.add(\"hidden\");\n update();\n}\n<\/script>\n<\/body>\n<\/html>"}, {"lesson": 3, "title": "큐 03차시", "content": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<base target=\\\"_self\\\">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>큐 03차시 상세학습 수업지도안<\/title>\n<style>\n:root{\n --bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4ef;\n --blue:#1d4ed8;--blue2:#2563eb;--soft:#eef4ff;--green:#166534;--greenbg:#ecfdf3;\n --red:#991b1b;--redbg:#fff1f2;--purple:#7c3aed;--code:#0f172a;--codeink:#e2e8f0;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Malgun Gothic\",\"Apple SD Gothic Neo\",Arial,sans-serif;line-height:1.72}\nheader{background:linear-gradient(135deg,#1d4ed8,#0f766e);color:white;padding:40px 20px}\n.wrap{max-width:1180px;margin:auto}\nh1{margin:0 0 8px;font-size:clamp(30px,4vw,48px)}\n.subtitle{font-size:18px;opacity:.96}\n.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}\n.badge{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}\nnav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}\n.navin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}\nbutton,select,input{font:inherit}\nbutton{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}\n.primary{background:var(--blue2);color:white}.light{background:#edf2f7;color:#24324a}\nselect{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}\nmain{max-width:1180px;margin:24px auto;padding:0 16px 60px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 8px 25px rgba(15,23,42,.05)}\n.card h2{margin-top:0;font-size:28px}.card h3{margin-top:28px;font-size:21px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n@media(max-width:820px){.grid2{grid-template-columns:1fr}}\n.student{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media(max-width:620px){.student{grid-template-columns:1fr}}\ninput[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}\nlabel strong{display:block;margin-bottom:5px}\ntable{width:100%;border-collapse:collapse;margin:12px 0}\nth,td{border:1px solid var(--line);padding:10px;vertical-align:top}\nth{background:#edf4ff}\n.callout{background:var(--soft);border-left:5px solid var(--blue2);padding:14px 16px;border-radius:10px;margin:14px 0}\n.warn{background:#fff7ed;border-left-color:#d97706}.good{background:var(--greenbg);border-left-color:#16a34a}\n.code{background:var(--code);color:var(--codeink);padding:18px;border-radius:14px;overflow:auto}\npre{margin:0;font:15px/1.6 Consolas,\"Courier New\",monospace;white-space:pre}\n.explain{list-style:none;padding:0;margin:12px 0}\n.explain li{padding:8px 10px;border-bottom:1px dashed var(--line)}\n.ln{display:inline-block;min-width:42px;color:var(--blue2);font-weight:800}\n.quiz{border-top:4px solid var(--purple)}\n.option{display:block;padding:10px 12px;margin:9px 0;border:1px solid var(--line);border-radius:10px}\n.option:hover{background:#faf8ff}.option input{margin-right:9px;transform:scale(1.15)}\n.feedback{display:none;padding:14px;margin-top:14px;border-radius:10px}\n.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}\n.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fda4af;color:#881337}\n.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}\n.progress div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#10b981);transition:.3s}\n.score{font-size:25px;font-weight:900;text-align:center;background:#eff6ff;padding:18px;border-radius:14px}\n.small{font-size:14px;color:var(--muted)}.hidden{display:none!important}\n.sim{padding:16px;border:1px dashed #94a3b8;border-radius:14px;background:#f8fafc}\n.queue-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}\n.qitem{padding:10px 15px;border:2px solid #60a5fa;background:#dbeafe;border-radius:10px;font-weight:800}\n.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input{max-width:180px}\n@media print{nav,.submit,.interactive{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:#fff}header{background:#fff;color:#000;border-bottom:2px solid #333}}\n<\/style>\n<\/head>\n<body>\n<header>\n<div class=\"wrap\">\n<h1>큐 03차시 상세학습 수업지도안<\/h1>\n<div class=\"subtitle\">파이썬 리스트로 큐를 직접 구현하고 삽입·삭제 프로그램을 완성하는 수업<\/div>\n<div class=\"badges\">\n<span class=\"badge\">50분 수업<\/span><span class=\"badge\">개념 6개<\/span>\n<span class=\"badge\">코드 6개<\/span><span class=\"badge\">복수 정답형 6문항<\/span>\n<span class=\"badge\">자동 채점·TXT 저장<\/span>\n<\/div>\n<\/div>\n<\/header>\n\n<nav>\n<div class=\"navin\">\n<button class=\"light\" onclick=\"scrollTo({top:0,behavior:'smooth'})\">맨 위<\/button>\n<select onchange=\"go(this.value)\">\n<option value=\"\">학습 위치 이동<\/option>\n<option value=\"overview\">수업 개요<\/option>\n<option value=\"c1\">1. 리스트로 큐 만들기<\/option>\n<option value=\"c2\">2. push 함수<\/option>\n<option value=\"c3\">3. pop 함수<\/option>\n<option value=\"c4\">4. 반환값 이해<\/option>\n<option value=\"c5\">5. 반복 삽입<\/option>\n<option value=\"c6\">6. 전체 프로그램<\/option>\n<option value=\"submit\">종합 제출<\/option>\n<\/select>\n<button class=\"light\" onclick=\"window.print()\">인쇄/PDF<\/button>\n<\/div>\n<\/nav>\n\n<main>\n<section class=\"card\" id=\"overview\">\n<h2>1. 수업 개요<\/h2>\n<div class=\"student\">\n<label><strong>학번<\/strong><input type=\"text\" id=\"sid\" placeholder=\"예: 1101\" maxlength=\"20\"><\/label>\n<label><strong>이름<\/strong><input type=\"text\" id=\"sname\" placeholder=\"예: 홍길동\" maxlength=\"20\"><\/label>\n<\/div>\n<div class=\"grid2\">\n<div>\n<h3>학습 목표<\/h3>\n<ol>\n<li>리스트를 큐의 저장 공간으로 사용할 수 있다.<\/li>\n<li><code>append()<\/code>를 이용하여 삽입 함수를 작성할 수 있다.<\/li>\n<li><code>pop(0)<\/code>을 이용하여 삭제 함수를 작성할 수 있다.<\/li>\n<li>삽입과 삭제가 반복되는 전체 프로그램의 실행 결과를 예측할 수 있다.<\/li>\n<\/ol>\n<\/div>\n<div>\n<h3>수업 흐름<\/h3>\n<table>\n<tr><th>단계<\/th><th>시간<\/th><th>학습 활동<\/th><\/tr>\n<tr><td>도입<\/td><td>5분<\/td><td>큐를 프로그래밍으로 표현하는 방법 예상<\/td><\/tr>\n<tr><td>전개 1<\/td><td>15분<\/td><td>리스트, append(), pop(0) 개념 학습<\/td><\/tr>\n<tr><td>전개 2<\/td><td>20분<\/td><td>push(), pop() 함수와 반복 프로그램 분석<\/td><\/tr>\n<tr><td>정리<\/td><td>10분<\/td><td>복수 정답형 평가 및 상세 풀이<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"callout\">파이썬에서 큐 전용 내장 함수가 바로 제공되는 것은 아니므로, 리스트와 함수를 이용하여 큐의 삽입·삭제 연산을 직접 구현할 수 있습니다.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c1\">\n<h2>2. 개념 1 — 리스트를 큐의 저장 공간으로 사용하기<\/h2>\n<p>큐에 자료를 저장할 공간으로 빈 리스트를 생성합니다. 이후 모든 삽입과 삭제는 이 리스트를 대상으로 수행합니다.<\/p>\n<h3>개념 코드 1<\/h3>\n<div class=\"code\"><pre>queue = []\n\nprint(queue)\nprint(len(queue))<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span><code>queue<\/code>라는 이름의 빈 리스트를 생성합니다.<\/li>\n<li><span class=\"ln\">3행<\/span>현재 큐 상태인 빈 리스트 <code>[]<\/code>를 출력합니다.<\/li>\n<li><span class=\"ln\">4행<\/span>큐에 저장된 요소 수인 0을 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>[]<br>0<\/div>\n<div class=\"card quiz\" data-q=\"q1\">\n<h3>문제 1. 위 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① queue는 빈 리스트이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② len(queue)의 값은 0이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ queue에는 이미 숫자 0이 저장되어 있다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 이 리스트를 큐의 자료 저장 공간으로 사용할 수 있다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ print(queue)는 [0]을 출력한다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c2\">\n<h2>3. 개념 2 — append()를 이용한 push 함수<\/h2>\n<p>삽입 함수는 전달받은 값을 큐의 입구에 추가합니다. 리스트의 마지막에 요소를 추가하는 <code>append()<\/code>를 사용합니다.<\/p>\n<h3>개념 코드 2<\/h3>\n<div class=\"code\"><pre>queue = []\n\ndef push(x):\n    queue.append(x)\n\npush(10)\npush(20)\n\nprint(queue)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>빈 큐를 만듭니다.<\/li>\n<li><span class=\"ln\">3행<\/span>삽입을 담당하는 <code>push(x)<\/code> 함수를 정의합니다.<\/li>\n<li><span class=\"ln\">4행<\/span>매개변수 x의 값을 큐 끝에 추가합니다.<\/li>\n<li><span class=\"ln\">6~7행<\/span>10과 20을 차례대로 삽입합니다.<\/li>\n<li><span class=\"ln\">9행<\/span>최종 큐 상태를 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>[10, 20]<\/div>\n<div class=\"card quiz\" data-q=\"q2\">\n<h3>문제 2. 위 push 함수에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① push(10)은 10을 큐에 삽입한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② append(x)는 x를 리스트 끝에 추가한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ push 함수를 정의하는 즉시 10이 자동으로 삽입된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 최종 큐 상태는 [10, 20]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ push(20)은 기존의 10을 삭제한다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c3\">\n<h2>4. 개념 3 — pop(0)을 이용한 삭제 함수<\/h2>\n<p>큐에서는 가장 먼저 삽입된 자료를 먼저 삭제해야 합니다. 리스트의 첫 번째 요소는 인덱스 0에 있으므로 <code>pop(0)<\/code>을 사용합니다.<\/p>\n<h3>개념 코드 3<\/h3>\n<div class=\"code\"><pre>queue = [10, 20, 30]\n\ndef pop():\n    return queue.pop(0)\n\nprint(pop())\nprint(queue)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>10, 20, 30이 순서대로 저장된 큐입니다.<\/li>\n<li><span class=\"ln\">3행<\/span>삭제를 담당하는 <code>pop()<\/code> 함수를 정의합니다.<\/li>\n<li><span class=\"ln\">4행<\/span>첫 번째 요소를 삭제하고 그 값을 반환합니다.<\/li>\n<li><span class=\"ln\">6행<\/span>삭제된 값 10을 출력합니다.<\/li>\n<li><span class=\"ln\">7행<\/span>남은 큐 <code>[20, 30]<\/code>을 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout warn\"><strong>주의:<\/strong> 여기서 정의한 <code>pop()<\/code> 함수와 리스트 메소드 <code>queue.pop(0)<\/code>은 이름은 비슷하지만 역할의 층위가 다릅니다. 사용자 정의 함수 안에서 리스트 메소드를 호출합니다.<\/div>\n<div class=\"card quiz\" data-q=\"q3\">\n<h3>문제 3. 위 pop 함수에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① queue.pop(0)은 첫 번째 요소 10을 제거한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 사용자 정의 pop()은 삭제된 값을 반환한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 코드 실행 후 queue는 [10, 20]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 첫 번째 출력값은 30이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 마지막 출력 결과는 [20, 30]이다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c4\">\n<h2>5. 개념 4 — 삭제와 반환값의 관계<\/h2>\n<p><code>pop(0)<\/code>은 요소를 제거하는 데서 끝나지 않고, 제거한 값을 호출한 위치로 돌려줍니다. 반환값은 변수에 저장하거나 바로 출력할 수 있습니다.<\/p>\n<h3>개념 코드 4<\/h3>\n<div class=\"code\"><pre>queue = [\"A\", \"B\", \"C\"]\n\nremoved = queue.pop(0)\n\nprint(\"삭제된 값:\", removed)\nprint(\"남은 큐:\", queue)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>A, B, C가 순서대로 저장되어 있습니다.<\/li>\n<li><span class=\"ln\">3행<\/span>A를 삭제하고 반환된 값을 <code>removed<\/code>에 저장합니다.<\/li>\n<li><span class=\"ln\">5행<\/span>삭제된 값 A를 출력합니다.<\/li>\n<li><span class=\"ln\">6행<\/span>남은 큐 B, C를 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>삭제된 값: A<br>남은 큐: ['B', 'C']<\/div>\n<div class=\"card quiz\" data-q=\"q4\">\n<h3>문제 4. 위 반환값 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① removed에는 문자열 A가 저장된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② pop(0)은 삭제와 반환을 함께 수행한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 실행 후 queue에는 A, B, C가 모두 남는다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 실행 후 첫 번째 요소는 B이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ removed에는 남은 큐 전체가 저장된다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c5\">\n<h2>6. 개념 5 — 반복문으로 여러 자료 삽입하기<\/h2>\n<p>반복문을 사용하면 여러 값을 순서대로 큐에 삽입할 수 있습니다. 반복 순서가 그대로 삽입 순서가 됩니다.<\/p>\n<h3>개념 코드 5<\/h3>\n<div class=\"code\"><pre>queue = []\n\ndef push(x):\n    queue.append(x)\n\nfor i in range(1, 6):\n    push(i)\n\nprint(queue)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>빈 큐를 생성합니다.<\/li>\n<li><span class=\"ln\">3~4행<\/span>삽입 함수를 정의합니다.<\/li>\n<li><span class=\"ln\">6행<\/span><code>range(1, 6)<\/code>은 1부터 5까지 생성합니다.<\/li>\n<li><span class=\"ln\">7행<\/span>각 i를 차례대로 큐에 삽입합니다.<\/li>\n<li><span class=\"ln\">9행<\/span>1부터 5까지 저장된 큐를 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>[1, 2, 3, 4, 5]<\/div>\n<div class=\"card quiz\" data-q=\"q5\">\n<h3>문제 5. 위 반복 삽입 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 반복문은 5회 실행된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 삽입되는 값은 1, 2, 3, 4, 5이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ range(1, 6)은 6까지 포함한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 최종 큐의 길이는 5이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 가장 먼저 삽입되는 값은 5이다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c6\">\n<h2>7. 개념 6 — 삽입 후 모두 삭제하는 전체 프로그램<\/h2>\n<p>교과서의 전체 프로그램은 1부터 5까지 삽입한 뒤, 다시 5회 삭제하면서 반환값을 출력합니다. FIFO 원리에 따라 출력 순서도 1부터 5까지입니다.<\/p>\n<h3>개념 코드 6<\/h3>\n<div class=\"code\"><pre>queue = []\n\ndef push(x):\n    queue.append(x)\n\ndef pop():\n    return queue.pop(0)\n\nfor i in range(1, 6):\n    push(i)\n\nfor i in range(1, 6):\n    print(pop())<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>빈 큐를 생성합니다.<\/li>\n<li><span class=\"ln\">3~4행<\/span>삽입 함수는 리스트 끝에 자료를 추가합니다.<\/li>\n<li><span class=\"ln\">6~7행<\/span>삭제 함수는 첫 자료를 제거하고 반환합니다.<\/li>\n<li><span class=\"ln\">9~10행<\/span>1부터 5까지 큐에 삽입합니다.<\/li>\n<li><span class=\"ln\">12~13행<\/span>5회 삭제하며 반환값을 한 줄씩 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>1<br>2<br>3<br>4<br>5<\/div>\n\n<div class=\"interactive\">\n<h3>직접 조작해 보기<\/h3>\n<div class=\"sim\">\n<div id=\"simQueue\" class=\"queue-row\"><span class=\"small\">현재 큐가 비어 있습니다.<\/span><\/div>\n<div class=\"controls\">\n<input type=\"text\" id=\"simValue\" placeholder=\"삽입할 값\">\n<button class=\"primary\" onclick=\"simPush()\">push<\/button>\n<button class=\"light\" onclick=\"simPop()\">pop<\/button>\n<button class=\"light\" onclick=\"simReset()\">초기화<\/button>\n<\/div>\n<p id=\"simMsg\" class=\"small\"><\/p>\n<\/div>\n<\/div>\n\n<div class=\"card quiz\" data-q=\"q6\">\n<h3>문제 6. 위 전체 프로그램에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 첫 번째 반복문이 끝나면 queue는 [1, 2, 3, 4, 5]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 출력 순서는 1, 2, 3, 4, 5이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 두 번째 반복문은 값을 추가하는 역할을 한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 프로그램이 끝나면 queue는 빈 리스트가 된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 마지막으로 출력되는 값은 1이다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"submit\">\n<h2>8. 종합 제출 및 결과 저장<\/h2>\n<p>각 문항에서 옳은 보기 3개를 모두 선택하고 틀린 보기를 선택하지 않아야 정답입니다.<\/p>\n<div class=\"progress\"><div id=\"bar\"><\/div><\/div>\n<p id=\"progressText\" class=\"small\">응답 완료: 0 / 6<\/p>\n<div class=\"submit\">\n<button class=\"primary\" onclick=\"grade()\">채점하고 TXT 저장<\/button>\n<button class=\"light\" onclick=\"resetAll()\">응답 초기화<\/button>\n<\/div>\n<div id=\"score\" class=\"score hidden\"><\/div>\n<div id=\"save\" class=\"callout hidden\"><\/div>\n<\/section>\n<\/main>\n\n<script>\nconst answers={q1:[0,1,3],q2:[0,1,3],q3:[0,1,4],q4:[0,1,3],q5:[0,1,3],q6:[0,1,3]};\nconst exp={\nq1:{t:\"리스트로 큐 만들기\",c:\"① queue는 빈 리스트이다. ② 빈 리스트의 길이는 0이다. ④ 리스트를 큐의 저장 공간으로 사용할 수 있다.\",w:\"③ 숫자 0이 저장된 것이 아니라 요소가 하나도 없다. ⑤ 출력은 [0]이 아니라 []이다.\"},\nq2:{t:\"push 함수\",c:\"① push(10)은 10을 삽입한다. ② append는 리스트 끝에 값을 추가한다. ④ 최종 상태는 [10, 20]이다.\",w:\"③ 함수 정의만으로는 함수 본문이 실행되지 않는다. ⑤ push(20)은 10을 삭제하지 않는다.\"},\nq3:{t:\"pop 함수\",c:\"① 첫 요소 10이 제거된다. ② 사용자 정의 pop 함수는 삭제된 값을 반환한다. ⑤ 남은 큐는 [20, 30]이다.\",w:\"③ [10, 20]이 아니라 [20, 30]이다. ④ 첫 출력값은 10이다.\"},\nq4:{t:\"삭제와 반환값\",c:\"① removed에는 A가 저장된다. ② pop(0)은 제거한 값을 반환한다. ④ 삭제 후 첫 요소는 B이다.\",w:\"③ A는 제거되어 남지 않는다. ⑤ removed에는 큐 전체가 아니라 삭제된 A만 저장된다.\"},\nq5:{t:\"반복 삽입\",c:\"① i는 1부터 5까지이므로 5회 반복한다. ② 삽입값은 1~5이다. ④ 최종 길이는 5이다.\",w:\"③ range의 끝값 6은 포함되지 않는다. ⑤ 가장 먼저 삽입되는 값은 1이다.\"},\nq6:{t:\"전체 큐 프로그램\",c:\"① 첫 반복 뒤 [1, 2, 3, 4, 5]이다. ② FIFO에 따라 1~5가 출력된다. ④ 다섯 값을 모두 삭제하므로 빈 큐가 된다.\",w:\"③ 두 번째 반복문은 삭제와 출력을 수행한다. ⑤ 마지막 출력값은 5이다.\"}\n};\nfunction go(id){if(id)document.getElementById(id).scrollIntoView({behavior:\"smooth\"});}\nfunction selected(q){return [...document.querySelectorAll(`[data-q=\"${q}\"] input:checked`)].map(x=>+x.value).sort((a,b)=>a-b);}\nfunction equal(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}\nfunction labels(a){return a.map(i=>\"①②③④⑤\"[i]).join(\", \");}\nfunction update(){let n=0;Object.keys(answers).forEach(q=>{if(selected(q).length)n++;});document.getElementById(\"bar\").style.width=(n/6*100)+\"%\";document.getElementById(\"progressText\").textContent=`응답 완료: ${n} / 6`;}\ndocument.querySelectorAll(\".quiz input\").forEach(x=>x.addEventListener(\"change\",update));\nfunction clean(s){return s.trim().replace(/[\\\\/:*?\"<>|]/g,\"_\").replace(/\\s+/g,\"_\");}\nfunction now(){const d=new Date(),p=n=>String(n).padStart(2,\"0\");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}\nfunction ftime(){const d=new Date(),p=n=>String(n).padStart(2,\"0\");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;}\nfunction grade(){\n const sid=document.getElementById(\"sid\").value.trim(),name=document.getElementById(\"sname\").value.trim();\n if(!sid||!name){alert(\"학번과 이름을 모두 입력하세요.\");document.getElementById(\"overview\").scrollIntoView({behavior:\"smooth\"});return;}\n let correct=0,report=[];\n Object.keys(answers).forEach((q,i)=>{\n  const s=selected(q),ok=equal(s,answers[q]);if(ok)correct++;\n  const fb=document.querySelector(`[data-q=\"${q}\"] .feedback`);\n  fb.className=\"feedback \"+(ok?\"correct\":\"wrong\");\n  fb.innerHTML=`<strong>${ok?\"정답\":\"오답\"}<\/strong><br>학생 선택: ${s.length?labels(s):\"미응답\"}<br>정답: ${labels(answers[q])}<br><strong>옳은 보기 해설:<\/strong> ${exp[q].c}<br><strong>틀린 보기 해설:<\/strong> ${exp[q].w}`;\n  report.push(`[${i+1}번] ${exp[q].t}\n판정: ${ok?\"정답\":\"오답\"}\n학생 선택: ${s.length?labels(s):\"미응답\"}\n정답: ${labels(answers[q])}\n옳은 보기 해설: ${exp[q].c}\n틀린 보기 해설: ${exp[q].w}`);\n });\n const score=Math.round(correct/6*100),stamp=ftime();\n const text=`큐 03차시 학습 평가 결과\n================================\n학번: ${sid}\n이름: ${name}\n점수: ${correct}/6 (${score}점)\n응시 시각: ${now()}\n평가 방식: 옳은 보기 3개 모두 선택\n\n${report.join(\"\\n\\n\")}\n\n================================\n총평\n${score===100?\"리스트를 이용한 큐의 삽입·삭제 구현을 정확하게 이해했습니다.\":score>=70?\"핵심 내용을 대체로 이해했습니다. push와 pop 함수의 실행 순서를 다시 확인하세요.\":\"append(), pop(0), return, 반복문의 역할을 중심으로 코드를 다시 학습하세요.\"}`;\n const blob=new Blob([\"\\ufeff\"+text],{type:\"text/plain;charset=utf-8\"});\n const a=document.createElement(\"a\");a.href=URL.createObjectURL(blob);\n a.download=`${clean(sid)}_${clean(name)}_${score}_큐03차시_${stamp}.txt`;\n document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);\n const sb=document.getElementById(\"score\");sb.classList.remove(\"hidden\");sb.textContent=`${name} 학생: ${correct}/6문항, ${score}점`;\n const si=document.getElementById(\"save\");si.classList.remove(\"hidden\");si.innerHTML=`결과 파일을 저장했습니다.<br><strong>${clean(sid)}_${clean(name)}_${score}_큐03차시_${stamp}.txt<\/strong><br>각 문항의 선택 답안, 정오답, 정답과 상세 풀이가 포함됩니다.`;\n sb.scrollIntoView({behavior:\"smooth\",block:\"center\"});\n}\nfunction resetAll(){if(!confirm(\"모든 응답과 채점 결과를 초기화할까요?\"))return;document.querySelectorAll(\".quiz input\").forEach(x=>x.checked=false);document.querySelectorAll(\".feedback\").forEach(x=>{x.className=\"feedback\";x.innerHTML=\"\";});document.getElementById(\"score\").classList.add(\"hidden\");document.getElementById(\"save\").classList.add(\"hidden\");update();}\nlet sim=[];\nfunction esc(s){return String(s).replace(/[&<>\"']/g,m=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",\"\\\"\":\"&quot;\",\"'\":\"&#039;\"}[m]));}\nfunction render(){const b=document.getElementById(\"simQueue\");b.innerHTML=sim.length?'<strong>front →<\/strong>'+sim.map(v=>`<span class=\"qitem\">${esc(v)}<\/span>`).join(\"\")+'<strong>← 입구<\/strong>':'<span class=\"small\">현재 큐가 비어 있습니다.<\/span>';}\nfunction simPush(){const x=document.getElementById(\"simValue\"),v=x.value.trim();if(!v){alert(\"삽입할 값을 입력하세요.\");return;}sim.push(v);x.value=\"\";document.getElementById(\"simMsg\").textContent=`push(${v}) 실행: ${v}을(를) 큐에 삽입했습니다.`;render();}\nfunction simPop(){if(!sim.length){document.getElementById(\"simMsg\").textContent=\"빈 큐에서는 pop을 실행할 수 없습니다.\";return;}const v=sim.shift();document.getElementById(\"simMsg\").textContent=`pop() 실행: ${v}을(를) 삭제하고 반환했습니다.`;render();}\nfunction simReset(){sim=[];document.getElementById(\"simMsg\").textContent=\"큐를 초기화했습니다.\";render();}\n<\/script>\n<\/body>\n<\/html>"}, {"lesson": 4, "title": "큐 04차시", "content": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<base target=\\\"_self\\\">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>큐 04차시 상세학습 수업지도안<\/title>\n<style>\n:root{\n --bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4ef;\n --blue:#1d4ed8;--blue2:#2563eb;--soft:#eef4ff;--green:#166534;--greenbg:#ecfdf3;\n --red:#991b1b;--redbg:#fff1f2;--purple:#7c3aed;--code:#0f172a;--codeink:#e2e8f0;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Malgun Gothic\",\"Apple SD Gothic Neo\",Arial,sans-serif;line-height:1.72}\nheader{background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff;padding:40px 20px}\n.wrap{max-width:1180px;margin:auto}\nh1{margin:0 0 8px;font-size:clamp(30px,4vw,48px)}\n.subtitle{font-size:18px;opacity:.96}\n.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}\n.badge{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}\nnav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}\n.navin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}\nbutton,select,input{font:inherit}\nbutton{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}\n.primary{background:var(--blue2);color:#fff}.light{background:#edf2f7;color:#24324a}\nselect{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}\nmain{max-width:1180px;margin:24px auto;padding:0 16px 60px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 8px 25px rgba(15,23,42,.05)}\n.card h2{margin-top:0;font-size:28px}.card h3{margin-top:28px;font-size:21px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n@media(max-width:820px){.grid2{grid-template-columns:1fr}}\n.student{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media(max-width:620px){.student{grid-template-columns:1fr}}\ninput[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}\nlabel strong{display:block;margin-bottom:5px}\ntable{width:100%;border-collapse:collapse;margin:12px 0}\nth,td{border:1px solid var(--line);padding:10px;vertical-align:top}\nth{background:#edf4ff}\n.callout{background:var(--soft);border-left:5px solid var(--blue2);padding:14px 16px;border-radius:10px;margin:14px 0}\n.warn{background:#fff7ed;border-left-color:#d97706}.good{background:var(--greenbg);border-left-color:#16a34a}\n.code{background:var(--code);color:var(--codeink);padding:18px;border-radius:14px;overflow:auto}\npre{margin:0;font:15px/1.6 Consolas,\"Courier New\",monospace;white-space:pre}\n.explain{list-style:none;padding:0;margin:12px 0}\n.explain li{padding:8px 10px;border-bottom:1px dashed var(--line)}\n.ln{display:inline-block;min-width:46px;color:var(--blue2);font-weight:800}\n.quiz{border-top:4px solid var(--purple)}\n.option{display:block;padding:10px 12px;margin:9px 0;border:1px solid var(--line);border-radius:10px}\n.option:hover{background:#faf8ff}.option input{margin-right:9px;transform:scale(1.15)}\n.feedback{display:none;padding:14px;margin-top:14px;border-radius:10px}\n.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}\n.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fda4af;color:#881337}\n.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}\n.progress div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#10b981);transition:.3s}\n.score{font-size:25px;font-weight:900;text-align:center;background:#eff6ff;padding:18px;border-radius:14px}\n.small{font-size:14px;color:var(--muted)}.hidden{display:none!important}\n.sim{padding:16px;border:1px dashed #94a3b8;border-radius:14px;background:#f8fafc}\n.queue-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}\n.qitem{padding:10px 15px;border:2px solid #60a5fa;background:#dbeafe;border-radius:10px;font-weight:800}\n.controls{display:flex;gap:8px;flex-wrap:wrap}\n.log{max-height:250px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}\n@media print{nav,.submit,.interactive{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:#fff}header{background:#fff;color:#000;border-bottom:2px solid #333}}\n<\/style>\n<\/head>\n<body>\n<header>\n<div class=\"wrap\">\n<h1>큐 04차시 상세학습 수업지도안<\/h1>\n<div class=\"subtitle\">은행 고객 행동 목록을 큐 시뮬레이션 프로그램으로 구현하기<\/div>\n<div class=\"badges\">\n<span class=\"badge\">50분 수업<\/span><span class=\"badge\">개념 6개<\/span>\n<span class=\"badge\">코드 6개<\/span><span class=\"badge\">복수 정답형 6문항<\/span>\n<span class=\"badge\">자동 채점·TXT 저장<\/span>\n<\/div>\n<\/div>\n<\/header>\n\n<nav>\n<div class=\"navin\">\n<button class=\"light\" onclick=\"scrollTo({top:0,behavior:'smooth'})\">맨 위<\/button>\n<select onchange=\"go(this.value)\">\n<option value=\"\">학습 위치 이동<\/option>\n<option value=\"overview\">수업 개요<\/option>\n<option value=\"c1\">1. 행동 목록의 수치화<\/option>\n<option value=\"c2\">2. 고객 번호 변수<\/option>\n<option value=\"c3\">3. 단계 번호 변수<\/option>\n<option value=\"c4\">4. 조건 분기<\/option>\n<option value=\"c5\">5. 대기 인원 출력<\/option>\n<option value=\"c6\">6. 전체 시뮬레이션<\/option>\n<option value=\"submit\">종합 제출<\/option>\n<\/select>\n<button class=\"light\" onclick=\"window.print()\">인쇄/PDF<\/button>\n<\/div>\n<\/nav>\n\n<main>\n<section class=\"card\" id=\"overview\">\n<h2>1. 수업 개요<\/h2>\n<div class=\"student\">\n<label><strong>학번<\/strong><input type=\"text\" id=\"sid\" placeholder=\"예: 1101\" maxlength=\"20\"><\/label>\n<label><strong>이름<\/strong><input type=\"text\" id=\"sname\" placeholder=\"예: 홍길동\" maxlength=\"20\"><\/label>\n<\/div>\n<div class=\"grid2\">\n<div>\n<h3>학습 목표<\/h3>\n<ol>\n<li>은행 고객의 삽입·삭제 행동을 1과 0의 목록으로 표현할 수 있다.<\/li>\n<li>고객 번호와 단계 번호 변수를 구분하여 사용할 수 있다.<\/li>\n<li>조건문을 이용하여 삽입과 삭제 동작을 나눌 수 있다.<\/li>\n<li>각 단계가 끝난 뒤 현재 대기 인원을 출력하는 프로그램을 작성할 수 있다.<\/li>\n<\/ol>\n<\/div>\n<div>\n<h3>수업 흐름<\/h3>\n<table>\n<tr><th>단계<\/th><th>시간<\/th><th>학습 활동<\/th><\/tr>\n<tr><td>도입<\/td><td>5분<\/td><td>고객 행동 20단계를 삽입·삭제로 분류<\/td><\/tr>\n<tr><td>전개 1<\/td><td>15분<\/td><td>행동 목록, id, st 변수 이해<\/td><\/tr>\n<tr><td>전개 2<\/td><td>20분<\/td><td>조건 분기와 대기 인원 출력 코드 분석<\/td><\/tr>\n<tr><td>정리<\/td><td>10분<\/td><td>전체 시뮬레이션 실행 및 평가<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"callout\">교과서의 고객 행동 20단계를 프로그램으로 표현할 때, 삽입은 1, 삭제는 0으로 나타냅니다. 이 목록을 앞에서부터 읽으며 큐의 상태를 갱신합니다.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c1\">\n<h2>2. 개념 1 — 고객 행동 목록을 1과 0으로 구조화하기<\/h2>\n<p>프로그램은 문장으로 된 고객 행동을 직접 이해하지 못하므로, 삽입은 1, 삭제는 0으로 바꾸어 리스트에 저장합니다.<\/p>\n<h3>개념 코드 1<\/h3>\n<div class=\"code\"><pre>actions = [1, 1, 0, 1, 0]\n\nfor action in actions:\n    print(action)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>삽입, 삽입, 삭제, 삽입, 삭제의 순서를 숫자로 저장합니다.<\/li>\n<li><span class=\"ln\">3행<\/span>행동 목록의 값을 앞에서부터 하나씩 꺼냅니다.<\/li>\n<li><span class=\"ln\">4행<\/span>각 행동을 순서대로 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>1<br>1<br>0<br>1<br>0<\/div>\n<div class=\"card quiz\" data-q=\"q1\">\n<h3>문제 1. 위 행동 목록 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 1은 삽입 행동을 의미한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 0은 삭제 행동을 의미한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ actions에는 총 4개의 행동만 저장되어 있다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 세 번째 행동은 삭제이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 반복문은 행동 목록을 거꾸로 읽는다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c2\">\n<h2>3. 개념 2 — 고객 번호를 관리하는
