 ${exp[q].t}\n판정: ${ok?\"정답\":\"오답\"}\n학생 선택: ${s.length?labels(s):\"미응답\"}\n정답: ${labels(answers[q])}\n옳은 보기 해설: ${exp[q].c}\n틀린 보기 해설: ${exp[q].w}`);\n });\n const score=Math.round(correct/6*100),stamp=ftime();\n const text=`큐 07차시 학습 평가 결과\n================================\n학번: ${sid}\n이름: ${name}\n점수: ${correct}/6 (${score}점)\n응시 시각: ${now()}\n평가 방식: 옳은 보기 3개 모두 선택\n\n${report.join(\"\\n\\n\")}\n\n================================\n총평\n${score===100?\"8퍼즐 상태의 1차원 리스트 표현과 빈칸 위치 탐색을 정확하게 이해했습니다.\":score>=70?\"핵심 내용을 대체로 이해했습니다. 인덱스와 행·열 변환식을 다시 확인하세요.\":\"빈칸 0의 의미, i*3+j 인덱스식, 길이 9의 상태 표현을 중심으로 다시 학습하세요.\"}`;\n const blob=new Blob([\"\\ufeff\"+text],{type:\"text/plain;charset=utf-8\"});\n const a=document.createElement(\"a\");a.href=URL.createObjectURL(blob);\n a.download=`${clean(sid)}_${clean(name)}_${score}_큐07차시_${stamp}.txt`;\n document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);\n const sb=document.getElementById(\"score\");sb.classList.remove(\"hidden\");sb.textContent=`${name} 학생: ${correct}/6문항, ${score}점`;\n const si=document.getElementById(\"save\");si.classList.remove(\"hidden\");si.innerHTML=`결과 파일을 저장했습니다.<br><strong>${clean(sid)}_${clean(name)}_${score}_큐07차시_${stamp}.txt<\/strong><br>각 문항의 선택 답안, 정오답, 정답과 상세 풀이가 포함됩니다.`;\n sb.scrollIntoView({behavior:\"smooth\",block:\"center\"});\n}\nfunction resetAll(){if(!confirm(\"모든 응답과 채점 결과를 초기화할까요?\"))return;document.querySelectorAll(\".quiz input\").forEach(x=>x.checked=false);document.querySelectorAll(\".feedback\").forEach(x=>{x.className=\"feedback\";x.innerHTML=\"\";});document.getElementById(\"score\").classList.add(\"hidden\");document.getElementById(\"save\").classList.add(\"hidden\");update();}\nfunction drawState(){\n const vals=document.getElementById(\"stateInput\").value.trim().split(/\\s+/).map(Number);\n const info=document.getElementById(\"stateInfo\");\n if(vals.length!==9||vals.some(Number.isNaN)){info.textContent=\"0부터 8까지 총 9개의 정수를 공백으로 구분하여 입력하세요.\";return;}\n if(!vals.includes(0)){info.textContent=\"빈칸을 뜻하는 0이 필요합니다.\";return;}\n const box=document.getElementById(\"livePuzzle\");\n box.innerHTML=vals.map(v=>`<div class=\"tile ${v===0?\"zero\":\"\"}\">${v}<\/div>`).join(\"\");\n const pos=vals.indexOf(0);\n info.textContent=`상태 리스트: [${vals.join(\", \")}] · 빈칸 인덱스: ${pos} · 위치: ${Math.floor(pos/3)}행 ${pos%3}열`;\n}\nfunction resetState(){document.getElementById(\"stateInput\").value=\"3 1 2 0 4 5 6 7 8\";drawState();}\ndrawState();\n<\/script>\n<\/body>\n<\/html>"}, {"lesson": 8, "title": "큐 08차시", "content": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<base target=\\\"_self\\\">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>큐 08차시 상세학습 수업지도안<\/title>\n<style>\n:root{\n --bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4ef;\n --blue:#1d4ed8;--blue2:#2563eb;--soft:#eef4ff;--green:#166534;--greenbg:#ecfdf3;\n --red:#991b1b;--redbg:#fff1f2;--purple:#7c3aed;--code:#0f172a;--codeink:#e2e8f0;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Malgun Gothic\",\"Apple SD Gothic Neo\",Arial,sans-serif;line-height:1.72}\nheader{background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff;padding:40px 20px}\n.wrap{max-width:1180px;margin:auto}\nh1{margin:0 0 8px;font-size:clamp(30px,4vw,48px)}\n.subtitle{font-size:18px;opacity:.96}\n.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}\n.badge{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}\nnav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}\n.navin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}\nbutton,select,input{font:inherit}\nbutton{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}\n.primary{background:var(--blue2);color:#fff}.light{background:#edf2f7;color:#24324a}\nselect{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}\nmain{max-width:1180px;margin:24px auto;padding:0 16px 60px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 8px 25px rgba(15,23,42,.05)}\n.card h2{margin-top:0;font-size:28px}.card h3{margin-top:28px;font-size:21px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n@media(max-width:820px){.grid2{grid-template-columns:1fr}}\n.student{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media(max-width:620px){.student{grid-template-columns:1fr}}\ninput[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}\nlabel strong{display:block;margin-bottom:5px}\ntable{width:100%;border-collapse:collapse;margin:12px 0}\nth,td{border:1px solid var(--line);padding:10px;vertical-align:top}\nth{background:#edf4ff}\n.callout{background:var(--soft);border-left:5px solid var(--blue2);padding:14px 16px;border-radius:10px;margin:14px 0}\n.warn{background:#fff7ed;border-left-color:#d97706}.good{background:var(--greenbg);border-left-color:#16a34a}\n.code{background:var(--code);color:var(--codeink);padding:18px;border-radius:14px;overflow:auto}\npre{margin:0;font:15px/1.6 Consolas,\"Courier New\",monospace;white-space:pre}\n.explain{list-style:none;padding:0;margin:12px 0}\n.explain li{padding:8px 10px;border-bottom:1px dashed var(--line)}\n.ln{display:inline-block;min-width:50px;color:var(--blue2);font-weight:800}\n.quiz{border-top:4px solid var(--purple)}\n.option{display:block;padding:10px 12px;margin:9px 0;border:1px solid var(--line);border-radius:10px}\n.option:hover{background:#faf8ff}.option input{margin-right:9px;transform:scale(1.15)}\n.feedback{display:none;padding:14px;margin-top:14px;border-radius:10px}\n.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}\n.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fda4af;color:#881337}\n.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}\n.progress div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#10b981);transition:.3s}\n.score{font-size:25px;font-weight:900;text-align:center;background:#eff6ff;padding:18px;border-radius:14px}\n.small{font-size:14px;color:var(--muted)}.hidden{display:none!important}\n.puzzle{display:grid;grid-template-columns:repeat(3,70px);gap:6px;width:max-content;padding:10px;background:#dbeafe;border-radius:14px}\n.tile{width:70px;height:70px;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid #60a5fa;border-radius:10px;font-size:23px;font-weight:800}\n.tile.zero{background:#eef2f7;color:#94a3b8;border-style:dashed}\n.puzzle-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}\n.move-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}\n@media(max-width:760px){.move-grid{grid-template-columns:1fr}}\n.move-card{padding:15px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}\n.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\n@media print{nav,.submit,.interactive{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:#fff}header{background:#fff;color:#000;border-bottom:2px solid #333}}\n<\/style>\n<\/head>\n<body>\n<header>\n<div class=\"wrap\">\n<h1>큐 08차시 상세학습 수업지도안<\/h1>\n<div class=\"subtitle\">8퍼즐의 네 가지 이동 조건을 판단하고 가능한 다음 상태 생성하기<\/div>\n<div class=\"badges\">\n<span class=\"badge\">50분 수업<\/span><span class=\"badge\">개념 6개<\/span>\n<span class=\"badge\">코드 6개<\/span><span class=\"badge\">복수 정답형 6문항<\/span>\n<span class=\"badge\">자동 채점·TXT 저장<\/span>\n<\/div>\n<\/div>\n<\/header>\n\n<nav>\n<div class=\"navin\">\n<button class=\"light\" onclick=\"scrollTo({top:0,behavior:'smooth'})\">맨 위<\/button>\n<select onchange=\"go(this.value)\">\n<option value=\"\">학습 위치 이동<\/option>\n<option value=\"overview\">수업 개요<\/option>\n<option value=\"c1\">1. 네 가지 이동<\/option>\n<option value=\"c2\">2. 위 이동 조건<\/option>\n<option value=\"c3\">3. 아래 이동 조건<\/option>\n<option value=\"c4\">4. 왼쪽·오른쪽 조건<\/option>\n<option value=\"c5\">5. swap으로 상태 생성<\/option>\n<option value=\"c6\">6. 모든 다음 상태<\/option>\n<option value=\"submit\">종합 제출<\/option>\n<\/select>\n<button class=\"light\" onclick=\"window.print()\">인쇄/PDF<\/button>\n<\/div>\n<\/nav>\n\n<main>\n<section class=\"card\" id=\"overview\">\n<h2>1. 수업 개요<\/h2>\n<div class=\"student\">\n<label><strong>학번<\/strong><input type=\"text\" id=\"sid\" placeholder=\"예: 1101\" maxlength=\"20\"><\/label>\n<label><strong>이름<\/strong><input type=\"text\" id=\"sname\" placeholder=\"예: 홍길동\" maxlength=\"20\"><\/label>\n<\/div>\n<div class=\"grid2\">\n<div>\n<h3>학습 목표<\/h3>\n<ol>\n<li>8퍼즐의 빈칸이 이동할 수 있는 네 방향을 설명할 수 있다.<\/li>\n<li>빈칸 인덱스를 이용하여 각 방향의 이동 가능 조건을 판단할 수 있다.<\/li>\n<li>두 리스트 요소를 맞바꾸어 다음 상태를 생성할 수 있다.<\/li>\n<li>현재 상태에서 만들 수 있는 모든 다음 상태를 구할 수 있다.<\/li>\n<\/ol>\n<\/div>\n<div>\n<h3>수업 흐름<\/h3>\n<table>\n<tr><th>단계<\/th><th>시간<\/th><th>학습 활동<\/th><\/tr>\n<tr><td>도입<\/td><td>5분<\/td><td>빈칸이 이동할 수 없는 경우 찾기<\/td><\/tr>\n<tr><td>전개 1<\/td><td>15분<\/td><td>상·하·좌·우 이동 조건 분석<\/td><\/tr>\n<tr><td>전개 2<\/td><td>20분<\/td><td>요소 맞바꾸기와 다음 상태 생성<\/td><\/tr>\n<tr><td>정리<\/td><td>10분<\/td><td>모든 다음 상태 확인 및 자동 평가<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"callout\">교과서 93쪽에서는 빈칸을 위·아래·왼쪽·오른쪽으로 이동한 결과를 리스트로 표현합니다. 보드의 경계를 벗어나는 이동은 수행할 수 없으므로 다음 상태가 만들어지지 않습니다.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c1\">\n<h2>2. 개념 1 — 빈칸의 네 가지 수행 작업<\/h2>\n<p>8퍼즐의 한 번의 수행 작업은 빈칸을 위, 아래, 왼쪽, 오른쪽 중 한 방향으로 이동하는 것입니다. 실제로는 빈칸 0과 이동 방향에 있는 숫자판의 위치를 맞바꿉니다.<\/p>\n<h3>개념 코드 1<\/h3>\n<div class=\"code\"><pre>moves = [\"위\", \"아래\", \"왼쪽\", \"오른쪽\"]\n\nfor move in moves:\n    print(move)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>빈칸에 적용할 수 있는 네 방향을 리스트에 저장합니다.<\/li>\n<li><span class=\"ln\">3행<\/span>방향을 앞에서부터 하나씩 확인합니다.<\/li>\n<li><span class=\"ln\">4행<\/span>각 이동 방향을 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>위<br>아래<br>왼쪽<br>오른쪽<\/div>\n<div class=\"card quiz\" data-q=\"q1\">\n<h3>문제 1. 위 코드와 8퍼즐 수행 작업에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① moves에는 네 가지 방향이 저장되어 있다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 빈칸 이동은 빈칸과 인접한 숫자판의 위치를 맞바꾸는 것이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 8퍼즐에서는 대각선 이동도 기본 수행 작업에 포함된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 반복문은 위, 아래, 왼쪽, 오른쪽 순서로 출력한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 모든 상태에서 네 방향 이동이 항상 가능하다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c2\">\n<h2>3. 개념 2 — 위로 이동할 수 있는 조건<\/h2>\n<p>빈칸이 첫째 행에 있으면 위쪽 칸이 없으므로 위로 이동할 수 없습니다. 1차원 인덱스가 3보다 크거나 같을 때 위 이동이 가능합니다.<\/p>\n<h3>개념 코드 2<\/h3>\n<div class=\"code\"><pre>state = [1, 2, 3, 4, 0, 5, 6, 7, 8]\npos = state.index(0)\n\ncan_up = pos >= 3\n\nprint(pos)\nprint(can_up)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>빈칸이 가운데 칸인 인덱스 4에 있습니다.<\/li>\n<li><span class=\"ln\">2행<\/span>빈칸 인덱스를 찾습니다.<\/li>\n<li><span class=\"ln\">4행<\/span>인덱스가 3 이상이면 첫째 행이 아니므로 위 이동이 가능합니다.<\/li>\n<li><span class=\"ln\">6~7행<\/span>빈칸 위치 4와 조건 결과 True를 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>4<br>True<\/div>\n<div class=\"card quiz\" data-q=\"q2\">\n<h3>문제 2. 위 이동 조건 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 빈칸의 인덱스는 4이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② pos >= 3의 결과는 True이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 빈칸이 첫째 행에 있으므로 위 이동이 불가능하다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 위 이동 시 맞바꿀 위치는 pos - 3이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 위 이동 조건은 pos < 3이다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c3\">\n<h2>4. 개념 3 — 아래로 이동할 수 있는 조건<\/h2>\n<p>빈칸이 셋째 행에 있으면 아래쪽 칸이 없습니다. 따라서 인덱스가 6보다 작을 때 아래 이동이 가능합니다.<\/p>\n<h3>개념 코드 3<\/h3>\n<div class=\"code\"><pre>state = [0, 1, 2, 3, 4, 5, 6, 7, 8]\npos = state.index(0)\n\nif pos < 6:\n    next_state = state.copy()\n    next_state[pos], next_state[pos + 3] = \\\n        next_state[pos + 3], next_state[pos]\n    print(next_state)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>빈칸은 첫째 행 첫째 열인 인덱스 0에 있습니다.<\/li>\n<li><span class=\"ln\">2행<\/span>빈칸 위치를 찾습니다.<\/li>\n<li><span class=\"ln\">4행<\/span>인덱스 0은 6보다 작으므로 아래 이동이 가능합니다.<\/li>\n<li><span class=\"ln\">5행<\/span>원본을 보존하기 위해 리스트를 복사합니다.<\/li>\n<li><span class=\"ln\">6~7행<\/span>인덱스 0과 아래쪽 인덱스 3의 값을 맞바꿉니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>[3, 1, 2, 0, 4, 5, 6, 7, 8]<\/div>\n<div class=\"card quiz\" data-q=\"q3\">\n<h3>문제 3. 위 아래 이동 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 빈칸의 처음 위치는 인덱스 0이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 아래쪽 칸의 인덱스는 pos + 3이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ state.copy()는 원본 state를 즉시 변경한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 이동 후 빈칸의 인덱스는 3이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ pos < 6 조건은 거짓이므로 코드가 실행되지 않는다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c4\">\n<h2>5. 개념 4 — 왼쪽과 오른쪽 이동 조건<\/h2>\n<p>열 번호는 <code>pos % 3<\/code>으로 구합니다. 열 번호가 0이면 왼쪽 이동이 불가능하고, 열 번호가 2이면 오른쪽 이동이 불가능합니다.<\/p>\n<h3>개념 코드 4<\/h3>\n<div class=\"code\"><pre>state = [1, 2, 3, 4, 0, 5, 6, 7, 8]\npos = state.index(0)\ncol = pos % 3\n\ncan_left = col > 0\ncan_right = col < 2\n\nprint(col)\nprint(can_left, can_right)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1~2행<\/span>빈칸은 인덱스 4에 있습니다.<\/li>\n<li><span class=\"ln\">3행<\/span>4를 3으로 나눈 나머지 1이 열 번호입니다.<\/li>\n<li><span class=\"ln\">5행<\/span>열 번호가 0보다 크므로 왼쪽 이동이 가능합니다.<\/li>\n<li><span class=\"ln\">6행<\/span>열 번호가 2보다 작으므로 오른쪽 이동도 가능합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>1<br>True True<\/div>\n<div class=\"card quiz\" data-q=\"q4\">\n<h3>문제 4. 위 좌우 이동 조건 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 빈칸의 열 번호는 1이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 현재 상태에서는 왼쪽과 오른쪽 이동이 모두 가능하다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 왼쪽 이동의 대상 인덱스는 pos + 1이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 오른쪽 이동의 대상 인덱스는 pos + 1이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ col이 0일 때에도 왼쪽 이동이 가능하다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c5\">\n<h2>6. 개념 5 — 요소 맞바꾸기로 다음 상태 만들기<\/h2>\n<p>파이썬에서는 두 위치의 값을 한 줄로 맞바꿀 수 있습니다. 다음 상태를 만들 때는 원본 상태가 바뀌지 않도록 먼저 복사하는 것이 중요합니다.<\/p>\n<h3>개념 코드 5<\/h3>\n<div class=\"code\"><pre>state = [1, 2, 3, 4, 0, 5, 6, 7, 8]\npos = state.index(0)\n\nright_state = state.copy()\nright_state[pos], right_state[pos + 1] = \\\n    right_state[pos + 1], right_state[pos]\n\nprint(state)\nprint(right_state)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1~2행<\/span>현재 상태와 빈칸 위치를 준비합니다.<\/li>\n<li><span class=\"ln\">4행<\/span>현재 상태를 복사하여 별도의 다음 상태를 만듭니다.<\/li>\n<li><span class=\"ln\">5~6행<\/span>빈칸과 오른쪽 숫자 5를 맞바꿉니다.<\/li>\n<li><span class=\"ln\">8행<\/span>원본 상태는 그대로입니다.<\/li>\n<li><span class=\"ln\">9행<\/span>오른쪽 이동을 적용한 새로운 상태를 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>[1, 2, 3, 4, 0, 5, 6, 7, 8]<br>[1, 2, 3, 4, 5, 0, 6, 7, 8]<\/div>\n<div class=\"card quiz\" data-q=\"q5\">\n<h3>문제 5. 위 맞바꾸기 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① state.copy()는 별도의 리스트를 만든다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 오른쪽 이동 후 빈칸 인덱스는 5이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 맞바꾸기를 실행하면 원본 state도 [1, 2, 3, 4, 5, 0, 6, 7, 8]로 변한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 오른쪽 이동에서는 pos와 pos + 1을 맞바꾼다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ right_state는 state와 같은 객체를 그대로 가리킨다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c6\">\n<h2>7. 개념 6 — 현재 상태에서 가능한 모든 다음 상태 생성하기<\/h2>\n<p>빈칸 위치에 따라 각 방향의 가능 여부를 확인하고, 가능한 방향만 복사·맞바꾸기하여 다음 상태 목록에 추가합니다.<\/p>\n<h3>개념 코드 6<\/h3>\n<div class=\"code\"><pre>state = [1, 2, 3, 4, 0, 5, 6, 7, 8]\npos = state.index(0)\nnext_states = []\n\nmoves = [\n    (-3, pos >= 3),       # 위\n    ( 3, pos < 6),        # 아래\n    (-1, pos % 3 > 0),    # 왼쪽\n    ( 1, pos % 3 < 2)     # 오른쪽\n]\n\nfor offset, possible in moves:\n    if possible:\n        new_state = state.copy()\n        target = pos + offset\n        new_state[pos], new_state[target] = \\\n            new_state[target], new_state[pos]\n        next_states.append(new_state)\n\nfor next_state in next_states:\n    print(next_state)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1~3행<\/span>현재 상태, 빈칸 위치, 다음 상태 저장 리스트를 준비합니다.<\/li>\n<li><span class=\"ln\">5~10행<\/span>각 방향의 인덱스 변화량과 이동 가능 조건을 묶어 저장합니다.<\/li>\n<li><span class=\"ln\">12행<\/span>네 방향을 하나씩 검사합니다.<\/li>\n<li><span class=\"ln\">13행<\/span>가능한 이동만 처리합니다.<\/li>\n<li><span class=\"ln\">14~18행<\/span>상태를 복사하고 대상 위치와 맞바꾼 뒤 다음 상태 목록에 추가합니다.<\/li>\n<li><span class=\"ln\">20~21행<\/span>생성한 다음 상태를 모두 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>현재 빈칸은 가운데이므로 네 방향 모두 가능합니다.<\/strong><br>\n위: [1, 0, 3, 4, 2, 5, 6, 7, 8]<br>\n아래: [1, 2, 3, 4, 7, 5, 6, 0, 8]<br>\n왼쪽: [1, 2, 3, 0, 4, 5, 6, 7, 8]<br>\n오른쪽: [1, 2, 3, 4, 5, 0, 6, 7, 8]<\/div>\n\n<div class=\"interactive\">\n<h3>다음 상태 직접 생성하기<\/h3>\n<div class=\"puzzle-wrap\">\n<div id=\"livePuzzle\" class=\"puzzle\"><\/div>\n<div>\n<input type=\"text\" id=\"stateInput\" value=\"1 2 3 4 0 5 6 7 8\" style=\"width:320px;max-width:100%\">\n<div class=\"controls\">\n<button class=\"primary\" onclick=\"generateMoves()\">다음 상태 생성<\/button>\n<button class=\"light\" onclick=\"resetState()\">초기화<\/button>\n<\/div>\n<p id=\"stateInfo\" class=\"small\"><\/p>\n<\/div>\n<\/div>\n<div id=\"moveResults\" class=\"move-grid\"><\/div>\n<\/div>\n\n<div class=\"card quiz\" data-q=\"q6\">\n<h3>문제 6. 위 모든 다음 상태 생성 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 현재 빈칸은 가운데에 있으므로 네 방향 이동이 모두 가능하다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② next_states에는 가능한 이동 결과만 추가된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 위 이동의 offset은 +3이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 각 다음 상태를 만들 때 원본 state를 복사한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 오른쪽 이동 결과는 [1, 2, 3, 0, 4, 5, 6, 7, 8]이다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"submit\">\n<h2>8. 종합 제출 및 결과 저장<\/h2>\n<p>각 문항에서 옳은 보기 3개를 모두 선택하고 틀린 보기는 선택하지 않아야 정답입니다.<\/p>\n<div class=\"progress\"><div id=\"bar\"><\/div><\/div>\n<p id=\"progressText\" class=\"small\">응답 완료: 0 / 6<\/p>\n<div class=\"submit\">\n<button class=\"primary\" onclick=\"grade()\">채점하고 TXT 저장<\/button>\n<button class=\"light\" onclick=\"resetAll()\">응답 초기화<\/button>\n<\/div>\n<div id=\"score\" class=\"score hidden\"><\/div>\n<div id=\"save\" class=\"callout hidden\"><\/div>\n<\/section>\n<\/main>\n\n<script>\nconst answers={q1:[0,1,3],q2:[0,1,3],q3:[0,1,3],q4:[0,1,3],q5:[0,1,3],q6:[0,1,3]};\nconst exp={\nq1:{t:\"네 가지 수행 작업\",c:\"① 기본 방향은 네 가지이다. ② 빈칸과 인접 숫자판을 맞바꾼다. ④ 리스트 순서대로 네 방향이 출력된다.\",w:\"③ 기본 작업에는 대각선 이동이 없다. ⑤ 가장자리나 모서리에서는 일부 방향이 불가능하다.\"},\nq2:{t:\"위 이동 조건\",c:\"① 0의 인덱스는 4이다. ② 4>=3은 참이다. ④ 위 칸은 인덱스가 3만큼 작다.\",w:\"③ 빈칸은 둘째 행이다. ⑤ pos<3은 위 이동 불가 영역을 나타낸다.\"},\nq3:{t:\"아래 이동 조건\",c:\"① 초기 빈칸은 인덱스 0이다. ② 아래 칸은 pos+3이다. ④ 이동 후 빈칸은 인덱스 3이다.\",w:\"③ copy는 원본과 별도 리스트를 만든다. ⑤ 0<6은 참이다.\"},\nq4:{t:\"좌우 이동 조건\",c:\"① 4%3은 1이다. ② 가운데 열에서는 좌우 모두 가능하다. ④ 오른쪽 대상은 pos+1이다.\",w:\"③ 왼쪽 대상은 pos-1이다. ⑤ 열 0은 왼쪽 경계이므로 이동 불가이다.\"},\nq5:{t:\"요소 맞바꾸기\",c:\"① copy는 별도 리스트이다. ② 오른쪽 이동 후 0은 인덱스 5이다. ④ 오른쪽은 pos와 pos+1 교환이다.\",w:\"③ 원본은 변하지 않는다. ⑤ 두 변수는 서로 다른 리스트 객체이다.\"},\nq6:{t:\"모든 다음 상태 생성\",c:\"① 가운데 칸은 네 방향 모두 가능하다. ② possible이 참인 결과만 추가된다. ④ 매번 원본을 복사하여 독립 상태를 만든다.\",w:\"③ 위 이동 offset은 -3이다. ⑤ 제시된 상태는 왼쪽 이동 결과이며 오른쪽 결과는 [1,2,3,4,5,0,6,7,8]이다.\"}\n};\nfunction go(id){if(id)document.getElementById(id).scrollIntoView({behavior:\"smooth\"});}\nfunction selected(q){return [...document.querySelectorAll(`[data-q=\"${q}\"] input:checked`)].map(x=>+x.value).sort((a,b)=>a-b);}\nfunction equal(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}\nfunction labels(a){return a.map(i=>\"①②③④⑤\"[i]).join(\", \");}\nfunction update(){let n=0;Object.keys(answers).forEach(q=>{if(selected(q).length)n++;});document.getElementById(\"bar\").style.width=(n/6*100)+\"%\";document.getElementById(\"progressText\").textContent=`응답 완료: ${n} / 6`;}\ndocument.querySelectorAll(\".quiz input\").forEach(x=>x.addEventListener(\"change\",update));\nfunction clean(s){return s.trim().replace(/[\\\\/:*?\"<>|]/g,\"_\").replace(/\\s+/g,\"_\");}\nfunction now(){const d=new Date(),p=n=>String(n).padStart(2,\"0\");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}\nfunction ftime(){const d=new Date(),p=n=>String(n).padStart(2,\"0\");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;}\nfunction grade(){\n const sid=document.getElementById(\"sid\").value.trim(),name=document.getElementById(\"sname\").value.trim();\n if(!sid||!name){alert(\"학번과 이름을 모두 입력하세요.\");document.getElementById(\"overview\").scrollIntoView({behavior:\"smooth\"});return;}\n let correct=0,report=[];\n Object.keys(answers).forEach((q,i)=>{\n  const s=selected(q),ok=equal(s,answers[q]);if(ok)correct++;\n  const fb=document.querySelector(`[data-q=\"${q}\"] .feedback`);\n  fb.className=\"feedback \"+(ok?\"correct\":\"wrong\");\n  fb.innerHTML=`<strong>${ok?\"정답\":\"오답\"}<\/strong><br>학생 선택: ${s.length?labels(s):\"미응답\"}<br>정답: ${labels(answers[q])}<br><strong>옳은 보기 해설:<\/strong> ${exp[q].c}<br><strong>틀린 보기 해설:<\/strong> ${exp[q].w}`;\n  report.push(`[${i+1}번] ${exp[q].t}\n판정: ${ok?\"정답\":\"오답\"}\n학생 선택: ${s.length?labels(s):\"미응답\"}\n정답: ${labels(answers[q])}\n옳은 보기 해설: ${exp[q].c}\n틀린 보기 해설: ${exp[q].w}`);\n });\n const score=Math.round(correct/6*100),stamp=ftime();\n const text=`큐 08차시 학습 평가 결과\n================================\n학번: ${sid}\n이름: ${name}\n점수: ${correct}/6 (${score}점)\n응시 시각: ${now()}\n평가 방식: 옳은 보기 3개 모두 선택\n\n${report.join(\"\\n\\n\")}\n\n================================\n총평\n${score===100?\"8퍼즐의 상·하·좌·우 이동 조건과 다음 상태 생성 방법을 정확하게 이해했습니다.\":score>=70?\"핵심 내용을 대체로 이해했습니다. 경계 조건과 방향별 인덱스 변화량을 다시 확인하세요.\":\"pos±3, pos±1의 의미와 행·열 경계 조건, 리스트 복사를 중심으로 다시 학습하세요.\"}`;\n const blob=new Blob([\"\\ufeff\"+text],{type:\"text/plain;charset=utf-8\"});\n const a=document.createElement(\"a\");a.href=URL.createObjectURL(blob);\n a.download=`${clean(sid)}_${clean(name)}_${score}_큐08차시_${stamp}.txt`;\n document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);\n const sb=document.getElementById(\"score\");sb.classList.remove(\"hidden\");sb.textContent=`${name} 학생: ${correct}/6문항, ${score}점`;\n const si=document.getElementById(\"save\");si.classList.remove(\"hidden\");si.innerHTML=`결과 파일을 저장했습니다.<br><strong>${clean(sid)}_${clean(name)}_${score}_큐08차시_${stamp}.txt<\/strong><br>각 문항의 선택 답안, 정오답, 정답과 상세 풀이가 포함됩니다.`;\n sb.scrollIntoView({behavior:\"smooth\",block:\"center\"});\n}\nfunction resetAll(){if(!confirm(\"모든 응답과 채점 결과를 초기화할까요?\"))return;document.querySelectorAll(\".quiz input\").forEach(x=>x.checked=false);document.querySelectorAll(\".feedback\").forEach(x=>{x.className=\"feedback\";x.innerHTML=\"\";});document.getElementById(\"score\").classList.add(\"hidden\");document.getElementById(\"save\").classList.add(\"hidden\");update();}\n\nfunction puzzleHTML(vals){return vals.map(v=>`<div class=\"tile ${v===0?\"zero\":\"\"}\">${v}<\/div>`).join(\"\");}\nfunction readState(){\n const vals=document.getElementById(\"stateInput\").value.trim().split(/\\s+/).map(Number);\n if(vals.length!==9||vals.some(Number.isNaN))return null;\n if(!vals.includes(0))return null;\n return vals;\n}\nfunction generateMoves(){\n const vals=readState(),info=document.getElementById(\"stateInfo\"),results=document.getElementById(\"moveResults\");\n if(!vals){info.textContent=\"빈칸 0을 포함한 9개의 정수를 공백으로 입력하세요.\";results.innerHTML=\"\";return;}\n document.getElementById(\"livePuzzle\").innerHTML=puzzleHTML(vals);\n const pos=vals.indexOf(0), row=Math.floor(pos/3), col=pos%3;\n info.textContent=`빈칸 인덱스 ${pos} · ${row}행 ${col}열`;\n const specs=[\n  [\"위\",-3,pos>=3],[\"아래\",3,pos<6],[\"왼쪽\",-1,col>0],[\"오른쪽\",1,col<2]\n ];\n results.innerHTML=specs.map(([name,off,ok])=>{\n  if(!ok)return `<div class=\"move-card\"><strong>${name}<\/strong><p>이동 불가능: 보드의 경계를 벗어납니다.<\/p><\/div>`;\n  const n=vals.slice(),t=pos+off;[n[pos],n[t]]=[n[t],n[pos]];\n  return `<div class=\"move-card\"><strong>${name}<\/strong><div class=\"puzzle\">${puzzleHTML(n)}<\/div><p class=\"small\">[${n.join(\", \")}]<\/p><\/div>`;\n }).join(\"\");\n}\nfunction resetState(){document.getElementById(\"stateInput\").value=\"1 2 3 4 0 5 6 7 8\";generateMoves();}\ngenerateMoves();\n<\/script>\n<\/body>\n<\/html>"}, {"lesson": 9, "title": "큐 09차시", "content": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<base target=\\\"_self\\\">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>큐 09차시 상세학습 수업지도안<\/title>\n<style>\n:root{\n --bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4ef;\n --blue:#1d4ed8;--blue2:#2563eb;--soft:#eef4ff;--green:#166534;--greenbg:#ecfdf3;\n --red:#991b1b;--redbg:#fff1f2;--purple:#7c3aed;--code:#0f172a;--codeink:#e2e8f0;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Malgun Gothic\",\"Apple SD Gothic Neo\",Arial,sans-serif;line-height:1.72}\nheader{background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff;padding:40px 20px}\n.wrap{max-width:1180px;margin:auto}\nh1{margin:0 0 8px;font-size:clamp(30px,4vw,48px)}\n.subtitle{font-size:18px;opacity:.96}\n.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}\n.badge{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}\nnav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}\n.navin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}\nbutton,select,input{font:inherit}\nbutton{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}\n.primary{background:var(--blue2);color:#fff}.light{background:#edf2f7;color:#24324a}\nselect{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}\nmain{max-width:1180px;margin:24px auto;padding:0 16px 60px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 8px 25px rgba(15,23,42,.05)}\n.card h2{margin-top:0;font-size:28px}.card h3{margin-top:28px;font-size:21px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n@media(max-width:820px){.grid2{grid-template-columns:1fr}}\n.student{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media(max-width:620px){.student{grid-template-columns:1fr}}\ninput[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}\nlabel strong{display:block;margin-bottom:5px}\ntable{width:100%;border-collapse:collapse;margin:12px 0}\nth,td{border:1px solid var(--line);padding:10px;vertical-align:top}\nth{background:#edf4ff}\n.callout{background:var(--soft);border-left:5px solid var(--blue2);padding:14px 16px;border-radius:10px;margin:14px 0}\n.warn{background:#fff7ed;border-left-color:#d97706}.good{background:var(--greenbg);border-left-color:#16a34a}\n.code{background:var(--code);color:var(--codeink);padding:18px;border-radius:14px;overflow:auto}\npre{margin:0;font:15px/1.6 Consolas,\"Courier New\",monospace;white-space:pre}\n.explain{list-style:none;padding:0;margin:12px 0}\n.explain li{padding:8px 10px;border-bottom:1px dashed var(--line)}\n.ln{display:inline-block;min-width:50px;color:var(--blue2);font-weight:800}\n.quiz{border-top:4px solid var(--purple)}\n.option{display:block;padding:10px 12px;margin:9px 0;border:1px solid var(--line);border-radius:10px}\n.option:hover{background:#faf8ff}.option input{margin-right:9px;transform:scale(1.15)}\n.feedback{display:none;padding:14px;margin-top:14px;border-radius:10px}\n.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}\n.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fda4af;color:#881337}\n.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}\n.progress div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#10b981);transition:.3s}\n.score{font-size:25px;font-weight:900;text-align:center;background:#eff6ff;padding:18px;border-radius:14px}\n.small{font-size:14px;color:var(--muted)}.hidden{display:none!important}\n.puzzle{display:grid;grid-template-columns:repeat(3,72px);gap:6px;width:max-content;padding:10px;background:#dbeafe;border-radius:14px}\n.tile{width:72px;height:72px;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid #60a5fa;border-radius:10px;font-size:24px;font-weight:800}\n.tile.zero{background:#eef2f7;color:#94a3b8;border-style:dashed}\n.puzzle-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}\n.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\n.resultbox{padding:15px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}\n@media print{nav,.submit,.interactive{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:#fff}header{background:#fff;color:#000;border-bottom:2px solid #333}}\n<\/style>\n<\/head>\n<body>\n<header>\n<div class=\"wrap\">\n<h1>큐 09차시 상세학습 수업지도안<\/h1>\n<div class=\"subtitle\">8퍼즐의 빈칸을 위로 이동하는 프로그램 작성과 실행 결과 분석<\/div>\n<div class=\"badges\">\n<span class=\"badge\">50분 수업<\/span><span class=\"badge\">개념 6개<\/span>\n<span class=\"badge\">코드 6개<\/span><span class=\"badge\">복수 정답형 6문항<\/span>\n<span class=\"badge\">자동 채점·TXT 저장<\/span>\n<\/div>\n<\/div>\n<\/header>\n\n<nav>\n<div class=\"navin\">\n<button class=\"light\" onclick=\"scrollTo({top:0,behavior:'smooth'})\">맨 위<\/button>\n<select onchange=\"go(this.value)\">\n<option value=\"\">학습 위치 이동<\/option>\n<option value=\"overview\">수업 개요<\/option>\n<option value=\"c1\">1. 상태 리스트 초기화<\/option>\n<option value=\"c2\">2. 3줄 입력 저장<\/option>\n<option value=\"c3\">3. 빈칸 위치 탐색<\/option>\n<option value=\"c4\">4. 위 이동 조건<\/option>\n<option value=\"c5\">5. 요소 맞바꾸기<\/option>\n<option value=\"c6\">6. 전체 프로그램<\/option>\n<option value=\"submit\">종합 제출<\/option>\n<\/select>\n<button class=\"light\" onclick=\"window.print()\">인쇄/PDF<\/button>\n<\/div>\n<\/nav>\n\n<main>\n<section class=\"card\" id=\"overview\">\n<h2>1. 수업 개요<\/h2>\n<div class=\"student\">\n<label><strong>학번<\/strong><input type=\"text\" id=\"sid\" placeholder=\"예: 1101\" maxlength=\"20\"><\/label>\n<label><strong>이름<\/strong><input type=\"text\" id=\"sname\" placeholder=\"예: 홍길동\" maxlength=\"20\"><\/label>\n<\/div>\n<div class=\"grid2\">\n<div>\n<h3>학습 목표<\/h3>\n<ol>\n<li>3×3 퍼즐 입력을 길이 9의 리스트에 저장할 수 있다.<\/li>\n<li>이중 반복문으로 빈칸 0의 위치를 찾을 수 있다.<\/li>\n<li>빈칸의 위 이동 가능 여부를 인덱스로 판단할 수 있다.<\/li>\n<li>두 요소를 맞바꾸고 변환된 퍼즐 상태를 3×3 형태로 출력할 수 있다.<\/li>\n<\/ol>\n<\/div>\n<div>\n<h3>수업 흐름<\/h3>\n<table>\n<tr><th>단계<\/th><th>시간<\/th><th>학습 활동<\/th><\/tr>\n<tr><td>도입<\/td><td>5분<\/td><td>위 이동 가능·불가능 상태 비교<\/td><\/tr>\n<tr><td>전개 1<\/td><td>15분<\/td><td>입력 저장과 빈칸 위치 탐색<\/td><\/tr>\n<tr><td>전개 2<\/td><td>20분<\/td><td>조건 판단, 맞바꾸기, 출력 코드 분석<\/td><\/tr>\n<tr><td>정리<\/td><td>10분<\/td><td>전체 프로그램 실행 및 자동 평가<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"callout\">교과서 94쪽의 프로그램은 3줄의 퍼즐 상태를 입력받고, 빈칸이 첫째 행이 아닐 때 위쪽 숫자판과 맞바꾸어 다음 상태를 출력합니다. 첫째 행에 있으면 <code>Impossible<\/code>을 출력합니다.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c1\">\n<h2>2. 개념 1 — 퍼즐 상태 리스트 초기화<\/h2>\n<p>3×3 퍼즐에는 총 9개의 위치가 있으므로 길이 9의 리스트를 먼저 만듭니다. 아직 입력받기 전에는 모든 값을 0으로 초기화할 수 있습니다.<\/p>\n<h3>개념 코드 1<\/h3>\n<div class=\"code\"><pre>state = [0] * 9\n\nprint(state)\nprint(len(state))<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>숫자 0을 9개 가진 리스트를 생성합니다.<\/li>\n<li><span class=\"ln\">3행<\/span>초기화된 리스트 전체를 출력합니다.<\/li>\n<li><span class=\"ln\">4행<\/span>리스트 길이 9를 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>[0, 0, 0, 0, 0, 0, 0, 0, 0]<br>9<\/div>\n<div class=\"card quiz\" data-q=\"q1\">\n<h3>문제 1. 위 초기화 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① state의 길이는 9이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② [0] * 9는 0을 아홉 개 저장한 리스트를 만든다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ state에는 숫자 1부터 9까지 자동으로 저장된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 3×3 퍼즐 상태를 저장할 공간으로 사용할 수 있다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ len(state)의 값은 3이다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c2\">\n<h2>3. 개념 2 — 세 줄 입력을 1차원 리스트에 저장하기<\/h2>\n<p>각 행에서 숫자 3개를 입력받아 인덱스 <code>i*3<\/code>, <code>i*3+1<\/code>, <code>i*3+2<\/code>에 저장합니다.<\/p>\n<h3>개념 코드 2<\/h3>\n<div class=\"code\"><pre>state = [0] * 9\nrows = [\n    [1, 2, 3],\n    [4, 0, 5],\n    [6, 7, 8]\n]\n\nfor i in range(3):\n    state[i * 3], state[i * 3 + 1], state[i * 3 + 2] = rows[i]\n\nprint(state)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>길이 9의 저장 공간을 준비합니다.<\/li>\n<li><span class=\"ln\">2~6행<\/span>실제 입력을 대신한 세 행의 자료입니다.<\/li>\n<li><span class=\"ln\">8행<\/span>행 번호 i를 0부터 2까지 반복합니다.<\/li>\n<li><span class=\"ln\">9행<\/span>현재 행의 세 값을 1차원 리스트의 알맞은 위치에 저장합니다.<\/li>\n<li><span class=\"ln\">11행<\/span>완성된 상태 리스트를 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>[1, 2, 3, 4, 0, 5, 6, 7, 8]<\/div>\n<div class=\"card quiz\" data-q=\"q2\">\n<h3>문제 2. 위 입력 저장 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① i가 0일 때 저장 위치는 0, 1, 2이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② i가 2일 때 저장 위치는 6, 7, 8이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 세 번째 행은 state의 첫 세 위치에 저장된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 최종 state는 [1, 2, 3, 4, 0, 5, 6, 7, 8]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 반복문은 총 9회 실행된다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c3\">\n<h2>4. 개념 3 — 이중 반복문으로 빈칸 위치 찾기<\/h2>\n<p>각 행과 열을 확인하면서 현재 값이 0인지 검사합니다. 0을 찾으면 1차원 인덱스 <code>i*3+j<\/code>를 <code>pos<\/code>에 저장합니다.<\/p>\n<h3>개념 코드 3<\/h3>\n<div class=\"code\"><pre>state = [1, 2, 3, 4, 0, 5, 6, 7, 8]\npos = -1\n\nfor i in range(3):\n    for j in range(3):\n        if state[i * 3 + j] == 0:\n            pos = i * 3 + j\n\nprint(pos)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>빈칸 0이 가운데 위치한 상태입니다.<\/li>\n<li><span class=\"ln\">2행<\/span>아직 빈칸을 찾지 못했다는 뜻으로 -1을 저장합니다.<\/li>\n<li><span class=\"ln\">4~5행<\/span>3개의 행과 3개의 열을 모두 탐색합니다.<\/li>\n<li><span class=\"ln\">6행<\/span>현재 위치의 값이 0인지 검사합니다.<\/li>\n<li><span class=\"ln\">7행<\/span>빈칸의 1차원 인덱스를 저장합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>4<\/div>\n<div class=\"card quiz\" data-q=\"q3\">\n<h3>문제 3. 위 빈칸 탐색 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 빈칸의 인덱스는 4이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② i * 3 + j는 행과 열을 1차원 인덱스로 바꾼다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ pos에는 빈칸의 값 0 자체만 저장된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 이중 반복문은 전체 9개 위치를 확인한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 빈칸을 찾으면 state에서 0이 자동으로 삭제된다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c4\">\n<h2>5. 개념 4 — 위로 이동할 수 있는 조건 판단<\/h2>\n<p>첫째 행의 인덱스는 0, 1, 2입니다. 따라서 빈칸 인덱스가 2보다 크면 위쪽 칸이 존재하고 위 이동이 가능합니다.<\/p>\n<h3>개념 코드 4<\/h3>\n<div class=\"code\"><pre>pos = 4\n\nif pos > 2:\n    print(\"위 이동 가능\")\nelse:\n    print(\"Impossible\")<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>빈칸이 인덱스 4에 있다고 가정합니다.<\/li>\n<li><span class=\"ln\">3행<\/span>빈칸이 첫째 행 아래에 있는지 검사합니다.<\/li>\n<li><span class=\"ln\">4행<\/span>4는 2보다 크므로 위 이동 가능을 출력합니다.<\/li>\n<li><span class=\"ln\">5~6행<\/span>인덱스가 0, 1, 2일 때는 Impossible을 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>위 이동 가능<\/div>\n<div class=\"card quiz\" data-q=\"q4\">\n<h3>문제 4. 위 이동 조건에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① pos가 4이면 pos > 2는 참이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 인덱스 0, 1, 2는 첫째 행이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ pos가 1이면 위 이동이 가능하다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 위 이동 대상 인덱스는 pos - 3이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ pos > 2가 거짓이어도 항상 맞바꾸기를 수행한다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c5\">\n<h2>6. 개념 5 — 빈칸과 위쪽 숫자판 맞바꾸기<\/h2>\n<p>위 이동은 빈칸 위치 <code>pos<\/code>와 바로 위 위치 <code>pos-3<\/code>의 값을 맞바꾸어 구현합니다.<\/p>\n<h3>개념 코드 5<\/h3>\n<div class=\"code\"><pre>state = [1, 2, 3, 4, 0, 5, 6, 7, 8]\npos = 4\n\nstate[pos], state[pos - 3] = \\\n    state[pos - 3], state[pos]\n\nprint(state)<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>빈칸이 인덱스 4에 있는 현재 상태입니다.<\/li>\n<li><span class=\"ln\">2행<\/span>빈칸 위치를 pos에 저장합니다.<\/li>\n<li><span class=\"ln\">4~5행<\/span>인덱스 4의 0과 인덱스 1의 2를 맞바꿉니다.<\/li>\n<li><span class=\"ln\">7행<\/span>위 이동이 적용된 다음 상태를 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>[1, 0, 3, 4, 2, 5, 6, 7, 8]<\/div>\n<div class=\"card quiz\" data-q=\"q5\">\n<h3>문제 5. 위 맞바꾸기 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① pos - 3의 값은 1이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 빈칸 0과 숫자 2가 맞바뀐다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 이동 후 빈칸 인덱스는 7이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 이동 후 상태는 [1, 0, 3, 4, 2, 5, 6, 7, 8]이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 위 이동에서는 pos와 pos + 3을 맞바꾼다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c6\">\n<h2>7. 개념 6 — 위 이동 전체 프로그램과 3×3 출력<\/h2>\n<p>입력, 빈칸 탐색, 이동 가능 조건, 맞바꾸기, 출력 과정을 하나의 프로그램으로 연결합니다.<\/p>\n<h3>개념 코드 6<\/h3>\n<div class=\"code\"><pre>state = [0] * 9\nrows = [\n    [1, 2, 3],\n    [4, 0, 5],\n    [6, 7, 8]\n]\n\nfor i in range(3):\n    state[i * 3], state[i * 3 + 1], state[i * 3 + 2] = rows[i]\n\n    for j in range(3):\n        if state[i * 3 + j] == 0:\n            pos = i * 3 + j\n\nif pos > 2:\n    state[pos], state[pos - 3] = state[pos - 3], state[pos]\n\n    for i in range(3):\n        for j in range(3):\n            print(state[i * 3 + j], end=\" \")\n        print()\nelse:\n    print(\"Impossible\")<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>퍼즐 상태를 저장할 길이 9의 리스트를 만듭니다.<\/li>\n<li><span class=\"ln\">2~6행<\/span>세 행의 입력 자료를 준비합니다.<\/li>\n<li><span class=\"ln\">8~13행<\/span>입력을 저장하면서 빈칸 위치를 찾습니다.<\/li>\n<li><span class=\"ln\">15행<\/span>빈칸이 첫째 행 아래에 있는지 검사합니다.<\/li>\n<li><span class=\"ln\">16행<\/span>빈칸과 위쪽 숫자판을 맞바꿉니다.<\/li>\n<li><span class=\"ln\">18~21행<\/span>변환된 리스트를 3행 3열 형태로 출력합니다.<\/li>\n<li><span class=\"ln\">22~23행<\/span>위 이동이 불가능하면 Impossible을 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>1 0 3<br>4 2 5<br>6 7 8<\/div>\n\n<div class=\"interactive\">\n<h3>위 이동 프로그램 직접 실행<\/h3>\n<div class=\"puzzle-wrap\">\n<div>\n<strong>현재 상태<\/strong>\n<div id=\"beforePuzzle\" class=\"puzzle\"><\/div>\n<\/div>\n<div>\n<strong>실행 결과<\/strong>\n<div id=\"afterArea\" class=\"resultbox\"><\/div>\n<\/div>\n<div>\n<input type=\"text\" id=\"stateInput\" value=\"1 2 3 4 0 5 6 7 8\" style=\"width:320px;max-width:100%\">\n<div class=\"controls\">\n<button class=\"primary\" onclick=\"moveUp()\">위로 이동<\/button>\n<button class=\"light\" onclick=\"resetState()\">초기화<\/button>\n<\/div>\n<p id=\"stateInfo\" class=\"small\"><\/p>\n<\/div>\n<\/div>\n<\/div>\n\n<div class=\"card quiz\" data-q=\"q6\">\n<h3>문제 6. 위 전체 프로그램에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 입력 상태에서 빈칸 인덱스는 4이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② pos > 2가 참이므로 위 이동을 수행한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 변환 후 첫째 행은 1 2 3이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 변환 후 출력은 1 0 3 / 4 2 5 / 6 7 8이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 빈칸이 첫째 행에 있어도 위쪽 인덱스와 맞바꾼다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"submit\">\n<h2>8. 종합 제출 및 결과 저장<\/h2>\n<p>각 문항에서 옳은 보기 3개를 모두 선택하고 틀린 보기는 선택하지 않아야 정답입니다.<\/p>\n<div class=\"progress\"><div id=\"bar\"><\/div><\/div>\n<p id=\"progressText\" class=\"small\">응답 완료: 0 / 6<\/p>\n<div class=\"submit\">\n<button class=\"primary\" onclick=\"grade()\">채점하고 TXT 저장<\/button>\n<button class=\"light\" onclick=\"resetAll()\">응답 초기화<\/button>\n<\/div>\n<div id=\"score\" class=\"score hidden\"><\/div>\n<div id=\"save\" class=\"callout hidden\"><\/div>\n<\/section>\n<\/main>\n\n<script>\nconst answers={q1:[0,1,3],q2:[0,1,3],q3:[0,1,3],q4:[0,1,3],q5:[0,1,3],q6:[0,1,3]};\nconst exp={\nq1:{t:\"상태 리스트 초기화\",c:\"① state는 9개 요소를 가진다. ② [0]*9는 0을 9개 생성한다. ④ 3×3 퍼즐 저장 공간으로 적합하다.\",w:\"③ 1부터 9까지 자동 저장되지 않는다. ⑤ 길이는 3이 아니라 9이다.\"},\nq2:{t:\"세 줄 입력 저장\",c:\"① i=0이면 0,1,2 위치이다. ② i=2이면 6,7,8 위치이다. ④ 최종 리스트는 제시된 순서와 같다.\",w:\"③ 셋째 행은 마지막 세 위치에 저장된다. ⑤ 바깥 반복문은 3회 실행된다.\"},\nq3:{t:\"빈칸 위치 탐색\",c:\"① 빈칸 인덱스는 4이다. ② i*3+j는 1차원 인덱스식이다. ④ 전체 9개 위치를 확인한다.\",w:\"③ pos에는 값이 아니라 위치 4가 저장된다. ⑤ 탐색은 0을 삭제하지 않는다.\"},\nq4:{t:\"위 이동 조건\",c:\"① 4>2는 참이다. ② 0,1,2는 첫째 행이다. ④ 위쪽 위치는 pos-3이다.\",w:\"③ pos=1은 첫째 행이므로 불가능하다. ⑤ 조건이 거짓이면 맞바꾸지 않고 Impossible을 출력한다.\"},\nq5:{t:\"위쪽 요소 맞바꾸기\",c:\"① 4-3은 1이다. ② 0과 인덱스 1의 숫자 2가 교환된다. ④ 결과 리스트가 정확하다.\",w:\"③ 빈칸은 인덱스 1로 이동한다. ⑤ pos+3은 아래 이동에 해당한다.\"},\nq6:{t:\"위 이동 전체 프로그램\",c:\"① 0은 인덱스 4이다. ② 조건이 참이므로 이동한다. ④ 최종 3×3 출력이 제시된 결과와 같다.\",w:\"③ 첫째 행은 1 0 3이다. ⑤ 첫째 행의 빈칸은 위 이동할 수 없어 Impossible을 출력한다.\"}\n};\nfunction go(id){if(id)document.getElementById(id).scrollIntoView({behavior:\"smooth\"});}\nfunction selected(q){return [...document.querySelectorAll(`[data-q=\"${q}\"] input:checked`)].map(x=>+x.value).sort((a,b)=>a-b);}\nfunction equal(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}\nfunction labels(a){return a.map(i=>\"①②③④⑤\"[i]).join(\", \");}\nfunction update(){let n=0;Object.keys(answers).forEach(q=>{if(selected(q).length)n++;});document.getElementById(\"bar\").style.width=(n/6*100)+\"%\";document.getElementById(\"progressText\").textContent=`응답 완료: ${n} / 6`;}\ndocument.querySelectorAll(\".quiz input\").forEach(x=>x.addEventListener(\"change\",update));\nfunction clean(s){return s.trim().replace(/[\\\\/:*?\"<>|]/g,\"_\").replace(/\\s+/g,\"_\");}\nfunction now(){const d=new Date(),p=n=>String(n).padStart(2,\"0\");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}\nfunction ftime(){const d=new Date(),p=n=>String(n).padStart(2,\"0\");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;}\nfunction grade(){\n const sid=document.getElementById(\"sid\").value.trim(),name=document.getElementById(\"sname\").value.trim();\n if(!sid||!name){alert(\"학번과 이름을 모두 입력하세요.\");document.getElementById(\"overview\").scrollIntoView({behavior:\"smooth\"});return;}\n let correct=0,report=[];\n Object.keys(answers).forEach((q,i)=>{\n  const s=selected(q),ok=equal(s,answers[q]);if(ok)correct++;\n  const fb=document.querySelector(`[data-q=\"${q}\"] .feedback`);\n  fb.className=\"feedback \"+(ok?\"correct\":\"wrong\");\n  fb.innerHTML=`<strong>${ok?\"정답\":\"오답\"}<\/strong><br>학생 선택: ${s.length?labels(s):\"미응답\"}<br>정답: ${labels(answers[q])}<br><strong>옳은 보기 해설:<\/strong> ${exp[q].c}<br><strong>틀린 보기 해설:<\/strong> ${exp[q].w}`;\n  report.push(`[${i+1}번] ${exp[q].t}\n판정: ${ok?\"정답\":\"오답\"}\n학생 선택: ${s.length?labels(s):\"미응답\"}\n정답: ${labels(answers[q])}\n옳은 보기 해설: ${exp[q].c}\n틀린 보기 해설: ${exp[q].w}`);\n });\n const score=Math.round(correct/6*100),stamp=ftime();\n const text=`큐 09차시 학습 평가 결과\n================================\n학번: ${sid}\n이름: ${name}\n점수: ${correct}/6 (${score}점)\n응시 시각: ${now()}\n평가 방식: 옳은 보기 3개 모두 선택\n\n${report.join(\"\\n\\n\")}\n\n================================\n총평\n${score===100?\"8퍼즐 상태 입력, 빈칸 탐색, 위 이동 조건과 맞바꾸기 프로그램을 정확히 이해했습니다.\":score>=70?\"핵심 내용을 대체로 이해했습니다. pos > 2 조건과 pos - 3의 의미를 다시 확인하세요.\":\"길이 9 리스트, i*3+j 인덱스식, 빈칸 탐색과 위 이동 조건을 중심으로 다시 학습하세요.\"}`;\n const blob=new Blob([\"\\ufeff\"+text],{type:\"text/plain;charset=utf-8\"});\n const a=document.createElement(\"a\");a.href=URL.createObjectURL(blob);\n a.download=`${clean(sid)}_${clean(name)}_${score}_큐09차시_${stamp}.txt`;\n document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);\n const sb=document.getElementById(\"score\");sb.classList.remove(\"hidden\");sb.textContent=`${name} 학생: ${correct}/6문항, ${score}점`;\n const si=document.getElementById(\"save\");si.classList.remove(\"hidden\");si.innerHTML=`결과 파일을 저장했습니다.<br><strong>${clean(sid)}_${clean(name)}_${score}_큐09차시_${stamp}.txt<\/strong><br>각 문항의 선택 답안, 정오답, 정답과 상세 풀이가 포함됩니다.`;\n sb.scrollIntoView({behavior:\"smooth\",block:\"center\"});\n}\nfunction resetAll(){if(!confirm(\"모든 응답과 채점 결과를 초기화할까요?\"))return;document.querySelectorAll(\".quiz input\").forEach(x=>x.checked=false);document.querySelectorAll(\".feedback\").forEach(x=>{x.className=\"feedback\";x.innerHTML=\"\";});document.getElementById(\"score\").classList.add(\"hidden\");document.getElementById(\"save\").classList.add(\"hidden\");update();}\n\nfunction phtml(vals){return vals.map(v=>`<div class=\"tile ${v===0?\"zero\":\"\"}\">${v}<\/div>`).join(\"\");}\nfunction readVals(){\n const vals=document.getElementById(\"stateInput\").value.trim().split(/\\s+/).map(Number);\n if(vals.length!==9||vals.some(Number.isNaN)||!vals.includes(0))return null;\n return vals;\n}\nfunction moveUp(){\n const vals=readVals(),info=document.getElementById(\"stateInfo\"),after=document.getElementById(\"afterArea\");\n if(!vals){info.textContent=\"빈칸 0을 포함한 9개의 정수를 입력하세요.\";return;}\n document.getElementById(\"beforePuzzle\").innerHTML=phtml(vals);\n const pos=vals.indexOf(0);\n info.textContent=`빈칸 인덱스: ${pos} · 위 이동 조건 pos > 2: ${pos>2}`;\n if(pos<=2){after.innerHTML=\"<strong>Impossible<\/strong><p class='small'>빈칸이 첫째 행에 있어 위로 이동할 수 없습니다.<\/p>\";return;}\n const n=vals.slice();[n[pos],n[pos-3]]=[n[pos-3],n[pos]];\n after.innerHTML=`<div class=\"puzzle\">${phtml(n)}<\/div><p class=\"small\">[${n.join(\", \")}]<\/p>`;\n}\nfunction resetState(){document.getElementById(\"stateInput\").value=\"1 2 3 4 0 5 6 7 8\";moveUp();}\nmoveUp();\n<\/script>\n<\/body>\n<\/html>"}, {"lesson": 10, "title": "큐 10차시", "content": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<base target=\\\"_self\\\">\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>큐 10차시 상세학습 수업지도안<\/title>\n<style>\n:root{\n --bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe4ef;\n --blue:#1d4ed8;--blue2:#2563eb;--soft:#eef4ff;--green:#166534;--greenbg:#ecfdf3;\n --red:#991b1b;--redbg:#fff1f2;--purple:#7c3aed;--code:#0f172a;--codeink:#e2e8f0;\n --amber:#b45309;--amberbg:#fff7ed;\n}\n*{box-sizing:border-box}\nhtml{scroll-behavior:smooth}\nbody{margin:0;background:var(--bg);color:var(--ink);font-family:\"Malgun Gothic\",\"Apple SD Gothic Neo\",Arial,sans-serif;line-height:1.72}\nheader{background:linear-gradient(135deg,#1d4ed8,#0f766e);color:#fff;padding:40px 20px}\n.wrap{max-width:1180px;margin:auto}\nh1{margin:0 0 8px;font-size:clamp(30px,4vw,48px)}\n.subtitle{font-size:18px;opacity:.96}\n.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}\n.badge{padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28)}\nnav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}\n.navin{max-width:1180px;margin:auto;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}\nbutton,select,input{font:inherit}\nbutton{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}\n.primary{background:var(--blue2);color:#fff}.light{background:#edf2f7;color:#24324a}\nselect{padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fff}\nmain{max-width:1180px;margin:24px auto;padding:0 16px 60px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 8px 25px rgba(15,23,42,.05)}\n.card h2{margin-top:0;font-size:28px}.card h3{margin-top:28px;font-size:21px}\n.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}\n@media(max-width:820px){.grid2{grid-template-columns:1fr}}\n.student{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media(max-width:620px){.student{grid-template-columns:1fr}}\ninput[type=text]{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}\nlabel strong{display:block;margin-bottom:5px}\ntable{width:100%;border-collapse:collapse;margin:12px 0}\nth,td{border:1px solid var(--line);padding:10px;vertical-align:top}\nth{background:#edf4ff}\n.callout{background:var(--soft);border-left:5px solid var(--blue2);padding:14px 16px;border-radius:10px;margin:14px 0}\n.warn{background:var(--amberbg);border-left-color:#d97706}.good{background:var(--greenbg);border-left-color:#16a34a}\n.code{background:var(--code);color:var(--codeink);padding:18px;border-radius:14px;overflow:auto}\npre{margin:0;font:15px/1.6 Consolas,\"Courier New\",monospace;white-space:pre}\n.explain{list-style:none;padding:0;margin:12px 0}\n.explain li{padding:8px 10px;border-bottom:1px dashed var(--line)}\n.ln{display:inline-block;min-width:52px;color:var(--blue2);font-weight:800}\n.quiz{border-top:4px solid var(--purple)}\n.option{display:block;padding:10px 12px;margin:9px 0;border:1px solid var(--line);border-radius:10px}\n.option:hover{background:#faf8ff}.option input{margin-right:9px;transform:scale(1.15)}\n.feedback{display:none;padding:14px;margin-top:14px;border-radius:10px}\n.feedback.correct{display:block;background:var(--greenbg);border:1px solid #86efac;color:#14532d}\n.feedback.wrong{display:block;background:var(--redbg);border:1px solid #fda4af;color:#881337}\n.progress{height:12px;background:#e5e7eb;border-radius:999px;overflow:hidden}\n.progress div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#10b981);transition:.3s}\n.score{font-size:25px;font-weight:900;text-align:center;background:#eff6ff;padding:18px;border-radius:14px}\n.small{font-size:14px;color:var(--muted)}.hidden{display:none!important}\n.puzzle{display:grid;grid-template-columns:repeat(3,68px);gap:6px;width:max-content;padding:10px;background:#dbeafe;border-radius:14px}\n.tile{width:68px;height:68px;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid #60a5fa;border-radius:10px;font-size:23px;font-weight:800}\n.tile.zero{background:#eef2f7;color:#94a3b8;border-style:dashed}\n.puzzle-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}\n.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\n.log{max-height:330px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}\n.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}\n.metric div{text-align:center;padding:14px;background:#f8fafc;border:1px solid var(--line);border-radius:12px}\n.metric b{display:block;font-size:24px;color:var(--blue)}\n@media(max-width:650px){.metric{grid-template-columns:1fr}}\n@media print{nav,.submit,.interactive{display:none!important}.card{box-shadow:none;break-inside:avoid}body{background:#fff}header{background:#fff;color:#000;border-bottom:2px solid #333}}\n<\/style>\n<\/head>\n<body>\n<header>\n<div class=\"wrap\">\n<h1>큐 10차시 상세학습 수업지도안<\/h1>\n<div class=\"subtitle\">큐를 활용한 8퍼즐 상태 탐색과 큐 단원 종합 정리<\/div>\n<div class=\"badges\">\n<span class=\"badge\">50분 수업<\/span><span class=\"badge\">개념 6개<\/span>\n<span class=\"badge\">코드 6개<\/span><span class=\"badge\">복수 정답형 6문항<\/span>\n<span class=\"badge\">자동 채점·TXT 저장<\/span>\n<\/div>\n<\/div>\n<\/header>\n\n<nav>\n<div class=\"navin\">\n<button class=\"light\" onclick=\"scrollTo({top:0,behavior:'smooth'})\">맨 위<\/button>\n<select onchange=\"go(this.value)\">\n<option value=\"\">학습 위치 이동<\/option>\n<option value=\"overview\">수업 개요<\/option>\n<option value=\"c1\">1. 상태를 큐에 저장<\/option>\n<option value=\"c2\">2. FIFO 탐색 순서<\/option>\n<option value=\"c3\">3. 방문 상태 관리<\/option>\n<option value=\"c4\">4. 다음 상태 생성<\/option>\n<option value=\"c5\">5. 목표 상태 확인<\/option>\n<option value=\"c6\">6. 종합 탐색 프로그램<\/option>\n<option value=\"submit\">종합 제출<\/option>\n<\/select>\n<button class=\"light\" onclick=\"window.print()\">인쇄/PDF<\/button>\n<\/div>\n<\/nav>\n\n<main>\n<section class=\"card\" id=\"overview\">\n<h2>1. 수업 개요<\/h2>\n<div class=\"student\">\n<label><strong>학번<\/strong><input type=\"text\" id=\"sid\" placeholder=\"예: 1101\" maxlength=\"20\"><\/label>\n<label><strong>이름<\/strong><input type=\"text\" id=\"sname\" placeholder=\"예: 홍길동\" maxlength=\"20\"><\/label>\n<\/div>\n<div class=\"grid2\">\n<div>\n<h3>학습 목표<\/h3>\n<ol>\n<li>8퍼즐의 상태를 큐에 저장하고 꺼내는 과정을 설명할 수 있다.<\/li>\n<li>큐의 선입 선출 특성이 상태 탐색 순서에 미치는 영향을 설명할 수 있다.<\/li>\n<li>방문한 상태를 따로 관리해야 하는 이유를 설명할 수 있다.<\/li>\n<li>현재 상태에서 가능한 다음 상태를 생성하여 큐에 추가할 수 있다.<\/li>\n<li>목표 상태를 찾는 간단한 너비 우선 탐색 프로그램을 이해할 수 있다.<\/li>\n<\/ol>\n<\/div>\n<div>\n<h3>수업 흐름<\/h3>\n<table>\n<tr><th>단계<\/th><th>시간<\/th><th>학습 활동<\/th><\/tr>\n<tr><td>도입<\/td><td>5분<\/td><td>큐를 이용한 상태 탐색 순서 예상<\/td><\/tr>\n<tr><td>전개 1<\/td><td>15분<\/td><td>상태 저장, FIFO, 방문 상태 관리<\/td><\/tr>\n<tr><td>전개 2<\/td><td>20분<\/td><td>다음 상태 생성과 목표 상태 탐색<\/td><\/tr>\n<tr><td>정리<\/td><td>10분<\/td><td>단원 종합 평가와 상세 풀이 확인<\/td><\/tr>\n<\/table>\n<\/div>\n<\/div>\n<div class=\"callout\">큐는 먼저 발견한 상태를 먼저 확인하게 하므로, 8퍼즐처럼 한 번의 이동으로 만들어지는 상태를 단계별로 넓게 탐색하는 데 활용할 수 있습니다.<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c1\">\n<h2>2. 개념 1 — 퍼즐 상태를 큐에 저장하기<\/h2>\n<p>탐색을 시작할 때 현재 퍼즐 상태를 큐에 삽입합니다. 각 퍼즐 상태는 길이 9의 리스트로 표현합니다.<\/p>\n<h3>개념 코드 1<\/h3>\n<div class=\"code\"><pre>import queue\n\nstart = [1, 2, 3, 4, 0, 5, 6, 7, 8]\n\nq = queue.Queue()\nq.put(start)\n\nprint(q.qsize())\nprint(q.get())<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>큐 객체를 사용하기 위해 <code>queue<\/code> 모듈을 불러옵니다.<\/li>\n<li><span class=\"ln\">3행<\/span>탐색을 시작할 8퍼즐 상태를 리스트로 저장합니다.<\/li>\n<li><span class=\"ln\">5행<\/span>빈 큐 객체를 생성합니다.<\/li>\n<li><span class=\"ln\">6행<\/span>시작 상태 전체를 큐에 삽입합니다.<\/li>\n<li><span class=\"ln\">8행<\/span>큐에 저장된 상태 수 1을 출력합니다.<\/li>\n<li><span class=\"ln\">9행<\/span>먼저 들어간 시작 상태를 꺼내 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>1<br>[1, 2, 3, 4, 0, 5, 6, 7, 8]<\/div>\n<div class=\"card quiz\" data-q=\"q1\">\n<h3>문제 1. 위 상태 저장 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① q.put(start)는 시작 상태를 큐에 삽입한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② q.qsize()의 첫 출력값은 1이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ q.get()은 시작 상태를 복사만 하고 큐에서 제거하지 않는다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ q.get()이 반환하는 값은 start와 같은 상태이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 큐에는 퍼즐의 숫자 하나만 저장할 수 있고 상태 리스트는 저장할 수 없다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c2\">\n<h2>3. 개념 2 — FIFO에 따른 상태 탐색 순서<\/h2>\n<p>큐에 상태 A, B, C를 차례대로 넣으면 A, B, C 순서로 꺼냅니다. 따라서 먼저 발견한 다음 상태를 먼저 탐색합니다.<\/p>\n<h3>개념 코드 2<\/h3>\n<div class=\"code\"><pre>import queue\n\nq = queue.Queue()\n\nq.put(\"상태 A\")\nq.put(\"상태 B\")\nq.put(\"상태 C\")\n\nwhile not q.empty():\n    print(q.get())<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">3행<\/span>빈 큐를 생성합니다.<\/li>\n<li><span class=\"ln\">5~7행<\/span>A, B, C 순서로 세 상태를 삽입합니다.<\/li>\n<li><span class=\"ln\">9행<\/span>큐가 비어 있지 않은 동안 반복합니다.<\/li>\n<li><span class=\"ln\">10행<\/span>가장 먼저 삽입된 상태부터 꺼내 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>상태 A<br>상태 B<br>상태 C<\/div>\n<div class=\"card quiz\" data-q=\"q2\">\n<h3>문제 2. 위 탐색 순서 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 가장 먼저 출력되는 것은 상태 A이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 큐는 먼저 발견한 상태를 먼저 처리한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 출력 순서는 C, B, A이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 반복 종료 후 큐는 비어 있다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ q.get()은 가장 나중에 삽입된 상태를 우선 반환한다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c3\">\n<h2>4. 개념 3 — 방문한 상태를 관리하는 이유<\/h2>\n<p>퍼즐을 이동하다 보면 이전 상태로 되돌아갈 수 있습니다. 이미 확인한 상태를 다시 큐에 넣으면 같은 탐색이 반복되므로 방문 여부를 기록해야 합니다.<\/p>\n<h3>개념 코드 3<\/h3>\n<div class=\"code\"><pre>start = [1, 2, 3, 4, 0, 5, 6, 7, 8]\n\nvisited = set()\nvisited.add(tuple(start))\n\nsame_state = [1, 2, 3, 4, 0, 5, 6, 7, 8]\n\nprint(tuple(same_state) in visited)\nprint(len(visited))<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>시작 상태를 리스트로 준비합니다.<\/li>\n<li><span class=\"ln\">3행<\/span>방문 상태를 저장할 빈 집합을 만듭니다.<\/li>\n<li><span class=\"ln\">4행<\/span>리스트를 튜플로 바꾸어 방문 집합에 추가합니다.<\/li>\n<li><span class=\"ln\">6행<\/span>시작 상태와 같은 새 리스트를 만듭니다.<\/li>\n<li><span class=\"ln\">8행<\/span>이미 방문한 상태인지 검사하여 True를 출력합니다.<\/li>\n<li><span class=\"ln\">9행<\/span>서로 같은 상태는 하나만 저장되므로 크기는 1입니다.<\/li>\n<\/ul>\n<div class=\"callout warn\"><strong>왜 튜플로 바꾸는가?<\/strong> 리스트는 변경 가능한 자료형이라 집합의 요소로 직접 넣을 수 없습니다. 튜플은 변경 불가능하므로 방문 상태의 식별값으로 사용할 수 있습니다.<\/div>\n<div class=\"card quiz\" data-q=\"q3\">\n<h3>문제 3. 위 방문 상태 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① visited는 이미 확인한 상태를 기록한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② tuple(start)는 리스트 상태를 튜플로 변환한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 같은 상태라도 visited에 넣을 때마다 중복으로 계속 저장된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ tuple(same_state) in visited의 결과는 True이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 방문 상태를 관리하면 같은 상태를 더 자주 반복 탐색하게 된다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c4\">\n<h2>5. 개념 4 — 가능한 다음 상태를 생성하여 큐에 넣기<\/h2>\n<p>현재 빈칸의 위치를 기준으로 이동 가능한 방향을 확인하고, 각 결과를 복사하여 큐에 추가합니다.<\/p>\n<h3>개념 코드 4<\/h3>\n<div class=\"code\"><pre>import queue\n\nstate = [1, 2, 3, 4, 0, 5, 6, 7, 8]\npos = state.index(0)\n\nq = queue.Queue()\n\nmoves = [\n    (-3, pos >= 3),\n    ( 3, pos < 6),\n    (-1, pos % 3 > 0),\n    ( 1, pos % 3 < 2)\n]\n\nfor offset, possible in moves:\n    if possible:\n        next_state = state.copy()\n        target = pos + offset\n        next_state[pos], next_state[target] = \\\n            next_state[target], next_state[pos]\n        q.put(next_state)\n\nprint(q.qsize())<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">3~4행<\/span>현재 상태와 빈칸 위치 4를 준비합니다.<\/li>\n<li><span class=\"ln\">6행<\/span>다음 상태를 저장할 큐를 생성합니다.<\/li>\n<li><span class=\"ln\">8~13행<\/span>상·하·좌·우 방향의 이동량과 가능 조건을 저장합니다.<\/li>\n<li><span class=\"ln\">15~21행<\/span>가능한 이동마다 상태를 복사하고 맞바꾼 뒤 큐에 넣습니다.<\/li>\n<li><span class=\"ln\">23행<\/span>빈칸이 가운데 있으므로 네 상태가 생성되어 4를 출력합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>4<\/div>\n<div class=\"card quiz\" data-q=\"q4\">\n<h3>문제 4. 위 다음 상태 생성 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 빈칸이 가운데에 있으므로 네 방향 이동이 가능하다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 각 다음 상태는 state.copy()로 별도로 만든다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ q.qsize()의 결과는 1이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 가능한 다음 상태는 q.put()으로 큐에 삽입된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 위 이동의 대상 인덱스는 pos + 3이다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c5\">\n<h2>6. 개념 5 — 목표 상태 확인과 탐색 종료<\/h2>\n<p>큐에서 상태를 하나 꺼낼 때마다 목표 상태와 같은지 확인합니다. 같으면 탐색을 종료할 수 있습니다.<\/p>\n<h3>개념 코드 5<\/h3>\n<div class=\"code\"><pre>goal = [1, 2, 3, 4, 5, 6, 7, 8, 0]\ncurrent = [1, 2, 3, 4, 5, 6, 7, 8, 0]\n\nif current == goal:\n    print(\"목표 상태 도달\")\nelse:\n    print(\"탐색 계속\")<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">1행<\/span>목표 퍼즐 상태를 저장합니다.<\/li>\n<li><span class=\"ln\">2행<\/span>현재 탐색 중인 상태를 저장합니다.<\/li>\n<li><span class=\"ln\">4행<\/span>두 리스트의 모든 값과 순서가 같은지 비교합니다.<\/li>\n<li><span class=\"ln\">5행<\/span>같으므로 목표 상태 도달을 출력합니다.<\/li>\n<li><span class=\"ln\">6~7행<\/span>다를 때는 탐색을 계속합니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>목표 상태 도달<\/div>\n<div class=\"card quiz\" data-q=\"q5\">\n<h3>문제 5. 위 목표 상태 확인 코드에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① current와 goal은 같은 리스트 값을 가진다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② current == goal의 결과는 True이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 실행 결과는 “탐색 계속”이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 목표 상태를 찾으면 탐색을 종료할 수 있다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ 리스트 비교는 요소의 순서를 고려하지 않는다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"c6\">\n<h2>7. 개념 6 — 큐를 이용한 8퍼즐 종합 탐색 프로그램<\/h2>\n<p>시작 상태와 이동 횟수를 큐에 저장하고, 먼저 발견한 상태부터 꺼내며 다음 상태를 생성합니다. 방문하지 않은 상태만 다시 큐에 넣습니다.<\/p>\n<h3>개념 코드 6<\/h3>\n<div class=\"code\"><pre>import queue\n\nstart = [1, 2, 3, 4, 5, 6, 7, 0, 8]\ngoal = [1, 2, 3, 4, 5, 6, 7, 8, 0]\n\nq = queue.Queue()\nq.put((start, 0))\n\nvisited = {tuple(start)}\n\nwhile not q.empty():\n    current, distance = q.get()\n\n    if current == goal:\n        print(\"최소 이동 횟수:\", distance)\n        break\n\n    pos = current.index(0)\n    moves = [\n        (-3, pos >= 3),\n        ( 3, pos < 6),\n        (-1, pos % 3 > 0),\n        ( 1, pos % 3 < 2)\n    ]\n\n    for offset, possible in moves:\n        if possible:\n            next_state = current.copy()\n            target = pos + offset\n            next_state[pos], next_state[target] = \\\n                next_state[target], next_state[pos]\n\n            key = tuple(next_state)\n\n            if key not in visited:\n                visited.add(key)\n                q.put((next_state, distance + 1))<\/pre><\/div>\n<ul class=\"explain\">\n<li><span class=\"ln\">3~4행<\/span>시작 상태와 목표 상태를 준비합니다. 시작 상태는 오른쪽 한 번 이동하면 목표가 됩니다.<\/li>\n<li><span class=\"ln\">6~7행<\/span>큐를 만들고 시작 상태와 이동 횟수 0을 함께 저장합니다.<\/li>\n<li><span class=\"ln\">9행<\/span>시작 상태를 방문 집합에 기록합니다.<\/li>\n<li><span class=\"ln\">11~12행<\/span>큐가 빌 때까지 상태와 이동 횟수를 하나씩 꺼냅니다.<\/li>\n<li><span class=\"ln\">14~16행<\/span>목표 상태를 찾으면 현재 이동 횟수를 출력하고 종료합니다.<\/li>\n<li><span class=\"ln\">18~24행<\/span>빈칸 위치와 네 방향 이동 조건을 구합니다.<\/li>\n<li><span class=\"ln\">26~31행<\/span>가능한 방향으로 새 상태를 생성합니다.<\/li>\n<li><span class=\"ln\">33행<\/span>집합에서 확인할 수 있도록 튜플로 바꿉니다.<\/li>\n<li><span class=\"ln\">35~37행<\/span>처음 발견한 상태만 방문 처리하고 이동 횟수를 1 증가시켜 큐에 넣습니다.<\/li>\n<\/ul>\n<div class=\"callout good\"><strong>실행 결과<\/strong><br>최소 이동 횟수: 1<\/div>\n\n<div class=\"interactive\">\n<h3>간단한 탐색 직접 실행<\/h3>\n<div class=\"puzzle-wrap\">\n<div>\n<strong>시작 상태<\/strong>\n<div id=\"startPuzzle\" class=\"puzzle\"><\/div>\n<\/div>\n<div>\n<strong>목표 상태<\/strong>\n<div id=\"goalPuzzle\" class=\"puzzle\"><\/div>\n<\/div>\n<div style=\"min-width:280px\">\n<input type=\"text\" id=\"startInput\" value=\"1 2 3 4 5 6 7 0 8\">\n<div class=\"controls\">\n<button class=\"primary\" onclick=\"solvePuzzle()\">탐색 실행<\/button>\n<button class=\"light\" onclick=\"resetPuzzle()\">초기화<\/button>\n<\/div>\n<p id=\"solveInfo\" class=\"small\"><\/p>\n<\/div>\n<\/div>\n<div class=\"metric\">\n<div>확인한 상태 수<b id=\"visitedCount\">0<\/b><\/div>\n<div>남은 큐 상태 수<b id=\"queueCount\">0<\/b><\/div>\n<div>찾은 이동 횟수<b id=\"distanceCount\">-<\/b><\/div>\n<\/div>\n<div id=\"solveLog\" class=\"log\">탐색 기록이 여기에 표시됩니다.<\/div>\n<\/div>\n\n<div class=\"card quiz\" data-q=\"q6\">\n<h3>문제 6. 위 종합 탐색 프로그램에 관한 설명으로 옳은 것을 모두 고르시오.<\/h3>\n<label class=\"option\"><input type=\"checkbox\" value=\"0\">① 큐에는 퍼즐 상태와 해당 상태까지의 이동 횟수가 함께 저장된다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"1\">② 방문하지 않은 다음 상태만 큐에 추가한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"2\">③ 목표 상태를 찾은 뒤에도 반드시 큐가 빌 때까지 계속 탐색한다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"3\">④ 제시된 시작 상태에서 목표까지의 최소 이동 횟수는 1이다.<\/label>\n<label class=\"option\"><input type=\"checkbox\" value=\"4\">⑤ distance + 1은 다음 상태의 이동 횟수를 1 감소시킨다.<\/label>\n<div class=\"feedback\"><\/div>\n<\/div>\n<\/section>\n\n<section class=\"card\" id=\"submit\">\n<h2>8. 종합 제출 및 결과 저장<\/h2>\n<p>각 문항에서 옳은 보기 3개를 모두 선택하고 틀린 보기는 선택하지 않아야 정답으로 처리됩니다.<\/p>\n<div class=\"progress\"><div id=\"bar\"><\/div><\/div>\n<p id=\"progressText\" class=\"small\">응답 완료: 0 / 6<\/p>\n<div class=\"submit\">\n<button class=\"primary\" onclick=\"grade()\">채점하고 TXT 저장<\/button>\n<button class=\"light\" onclick=\"resetAll()\">응답 초기화<\/button>\n<\/div>\n<div id=\"score\" class=\"score hidden\"><\/div>\n<div id=\"save\" class=\"callout hidden\"><\/div>\n<\/section>\n<\/main>\n\n<script>\nconst answers={q1:[0,1,3],q2:[0,1,3],q3:[0,1,3],q4:[0,1,3],q5:[0,1,3],q6:[0,1,3]};\nconst exp={\nq1:{t:\"상태를 큐에 저장\",c:\"① put은 시작 상태를 삽입한다. ② 삽입 후 큐 크기는 1이다. ④ get은 먼저 넣은 시작 상태를 반환한다.\",w:\"③ get은 반환과 함께 큐에서 제거한다. ⑤ 큐에는 리스트 같은 객체도 저장할 수 있다.\"},\nq2:{t:\"FIFO 탐색 순서\",c:\"① A가 먼저 출력된다. ② 먼저 발견한 상태를 먼저 처리한다. ④ 모든 상태를 get하면 큐는 빈다.\",w:\"③ 출력은 A, B, C 순서이다. ⑤ get은 가장 먼저 삽입된 상태를 반환한다.\"},\nq3:{t:\"방문 상태 관리\",c:\"① visited는 이미 본 상태를 기록한다. ② tuple은 리스트를 튜플로 변환한다. ④ 같은 상태가 이미 있으므로 결과는 True이다.\",w:\"③ 집합은 같은 값을 중복 저장하지 않는다. ⑤ 방문 관리는 중복 탐색을 줄인다.\"},\nq4:{t:\"다음 상태 생성\",c:\"① 가운데 빈칸은 네 방향 모두 가능하다. ② copy로 독립 상태를 만든다. ④ 가능한 상태를 put으로 삽입한다.\",w:\"③ 생성되는 상태는 4개이다. ⑤ 위 이동 대상은 pos-3이다.\"},\nq5:{t:\"목표 상태 확인\",c:\"① 두 리스트의 값과 순서가 같다. ② 비교 결과는 True이다. ④ 목표를 찾으면 탐색을 끝낼 수 있다.\",w:\"③ 출력은 목표 상태 도달이다. ⑤ 리스트 비교는 요소 순서도 확인한다.\"},\nq6:{t:\"종합 탐색 프로그램\",c:\"① 상태와 distance를 튜플로 큐에 저장한다. ② 미방문 상태만 추가한다. ④ 시작 상태는 오른쪽 한 번으로 목표가 된다.\",w:\"③ 목표를 찾으면 break로 종료한다. ⑤ distance+1은 이동 횟수를 1 증가시킨다.\"}\n};\nfunction go(id){if(id)document.getElementById(id).scrollIntoView({behavior:\"smooth\"});}\nfunction selected(q){return [...document.querySelectorAll(`[data-q=\"${q}\"] input:checked`)].map(x=>+x.value).sort((a,b)=>a-b);}\nfunction equal(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}\nfunction labels(a){return a.map(i=>\"①②③④⑤\"[i]).join(\", \");}\nfunction update(){let n=0;Object.keys(answers).forEach(q=>{if(selected(q).length)n++;});document.getElementById(\"bar\").style.width=(n/6*100)+\"%\";document.getElementById(\"progressText\").textContent=`응답 완료: ${n} / 6`;}\ndocument.querySelectorAll(\".quiz input\").forEach(x=>x.addEventListener(\"change\",update));\nfunction clean(s){return s.trim().replace(/[\\\\/:*?\"<>|]/g,\"_\").replace(/\\s+/g,\"_\");}\nfunction now(){const d=new Date(),p=n=>String(n).padStart(2,\"0\");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}\nfunction ftime(){const d=new Date(),p=n=>String(n).padStart(2,\"0\");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;}\nfunction grade(){\n const sid=document.getElementById(\"sid\").value.trim(),name=document.getElementById(\"sname\").value.trim();\n if(!sid||!name){alert(\"학번과 이름을 모두 입력하세요.\");document.getElementById(\"overview\").scrollIntoView({behavior:\"smooth\"});return;}\n let correct=0,report=[];\n Object.keys(answers).forEach((q,i)=>{\n  const s=selected(q),ok=equal(s,answers[q]);if(ok)correct++;\n  const fb=document.querySelector(`[data-q=\"${q}\"] .feedback`);\n  fb.className=\"feedback \"+(ok?\"correct\":\"wrong\");\n  fb.innerHTML=`<strong>${ok?\"정답\":\"오답\"}<\/strong><br>학생 선택: ${s.length?labels(s):\"미응답\"}<br>정답: ${labels(answers[q])}<br><strong>옳은 보기 해설:<\/strong> ${exp[q].c}<br><strong>틀린 보기 해설:<\/strong> ${exp[q].w}`;\n  report.push(`[${i+1}번] ${exp[q].t}\n판정: ${ok?\"정답\":\"오답\"}\n학생 선택: ${s.length?labels(s):\"미응답\"}\n정답: ${labels(answers[q])}\n옳은 보기 해설: ${exp[q].c}\n틀린 보기 해설: ${exp[q].w}`);\n });\n const score=Math.round(correct/6*100),stamp=ftime();\n const text=`큐 10차시 학습 평가 결과\n================================\n학번: ${sid}\n이름: ${name}\n점수: ${correct}/6 (${score}점)\n응시 시각: ${now()}\n평가 방식: 옳은 보기 3개 모두 선택\n\n${report.join(\"\\n\\n\")}\n\n================================\n총평\n${score===100?\"큐의 FIFO 원리와 8퍼즐 상태 탐색, 방문 상태 관리까지 정확하게 이해했습니다.\":score>=70?\"핵심 내용을 대체로 이해했습니다. 큐의 탐색 순서와 방문 상태 처리 과정을 다시 확인하세요.\":\"put·get의 FIFO 원리, 다음 상태 생성, visited 집합과 목표 상태 확인을 중심으로 다시 학습하세요.\"}`;\n const blob=new Blob([\"\\ufeff\"+text],{type:\"text/plain;charset=utf-8\"});\n const a=document.createElement(\"a\");a.href=URL.createObjectURL(blob);\n a.download=`${clean(sid)}_${clean(name)}_${score}_큐10차시_${stamp}.txt`;\n document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);\n const sb=document.getElementById(\"score\");sb.classList.remove(\"hidden\");sb.textContent=`${name} 학생: ${correct}/6문항, ${score}점`;\n const si=document.getElementById(\"save\");si.classList.remove(\"hidden\");si.innerHTML=`결과 파일을 저장했습니다.<br><strong>${clean(sid)}_${clean(name)}_${score}_큐10차시_${stamp}.txt<\/strong><br>각 문항의 선택 답안, 정오답, 정답과 상세 풀이가 포함됩니다.`;\n sb.scrollIntoView({behavior:\"smooth\",block:\"center\"});\n}\nfunction resetAll(){if(!confirm(\"모든 응답과 채점 결과를 초기화할까요?\"))return;document.querySelectorAll(\".quiz input\").forEach(x=>x.checked=false);document.querySelectorAll(\".feedback\").forEach(x=>{x.className=\"feedback\";x.innerHTML=\"\";});document.getElementById(\"score\").classList.add(\"hidden\");document.getElementById(\"save\").classList.add(\"hidden\");update();}\n\nconst goal=[1,2,3,4,5,6,7,8,0];\nfunction phtml(vals){return vals.map(v=>`<div class=\"tile ${v===0?\"zero\":\"\"}\">${v}<\/div>`).join(\"\");}\nfunction validState(vals){\n if(vals.length!==9||vals.some(Number.isNaN))return false;\n const sorted=vals.slice().sort((a,b)=>a-b);\n return sorted.every((v,i)=>v===i);\n}\nfunction neighbors(state){\n const pos=state.indexOf(0), col=pos%3;\n const specs=[[-3,pos>=3],[3,pos<6],[-1,col>0],[1,col<2]];\n const result=[];\n for(const [off,ok] of specs){\n  if(!ok)continue;\n  const n=state.slice(),t=pos+off;[n[pos],n[t]]=[n[t],n[pos]];\n  result.push(n);\n }\n return result;\n}\nfunction solvePuzzle(){\n const vals=document.getElementById(\"startInput\").value.trim().split(/\\s+/).map(Number);\n const info=document.getElementById(\"solveInfo\"),log=document.getElementById(\"solveLog\");\n if(!validState(vals)){info.textContent=\"0부터 8까지를 한 번씩 포함한 9개의 정수를 입력하세요.\";return;}\n document.getElementById(\"startPuzzle\").innerHTML=phtml(vals);\n document.getElementById(\"goalPuzzle\").innerHTML=phtml(goal);\n const maxVisited=50000;\n const q=[[vals,0]], visited=new Set([vals.join(\",\")]), lines=[];\n let head=0,found=-1;\n while(head<q.length && visited.size<=maxVisited){\n  const [cur,dist]=q[head++];\n  if(lines.length<40)lines.push(`${head}번째 확인 · 거리 ${dist} · [${cur.join(\", \")}]`);\n  if(cur.every((v,i)=>v===goal[i])){found=dist;break;}\n  for(const n of neighbors(cur)){\n   const key=n.join(\",\");\n   if(!visited.has(key)){visited.add(key);q.push([n,dist+1]);}\n  }\n }\n document.getElementById(\"visitedCount\").textContent=visited.size;\n document.getElementById(\"queueCount\").textContent=Math.max(0,q.length-head);\n document.getElementById(\"distanceCount\").textContent=found>=0?found:\"-\";\n if(found>=0){\n  info.textContent=`목표 상태를 찾았습니다. 최소 이동 횟수는 ${found}회입니다.`;\n }else{\n  info.textContent=`제한된 탐색 범위에서 목표를 찾지 못했습니다.`;\n }\n log.innerHTML=lines.join(\"<br>\")+(visited.size>40?\"<br>… 탐색 기록 일부만 표시합니다.\":\"\");\n}\nfunction resetPuzzle(){document.getElementById(\"startInput\").value=\"1 2 3 4 5 6 7 0 8\";solvePuzzle();}\nresetPuzzle();\n<\/script>\n<\/body>\n<\/html>"}];
const frame = document.getElementById('lessonFrame');
const select = document.getElementById('lessonSelect');
const tabs = [...document.querySelectorAll('.lesson-tab')];
const status = document.getElementById('status');
const loading = document.getElementById('loading');
let current = 1;

function renderLesson(number) {
  current = Math.max(1, Math.min(10, Number(number) || 1));
  const lesson = lessons[current - 1];
  loading.style.display = 'flex';
  frame.srcdoc = lesson.content;
  select.value = String(current);
  status.textContent = lesson.title;
  tabs.forEach(btn => btn.classList.toggle('active', Number(btn.dataset.lesson) === current));
  document.getElementById('prevBtn').disabled = current === 1;
  document.getElementById('nextBtn').disabled = current === 10;
  try { localStorage.setItem('QLearn_currentLesson', String(current)); } catch(e) {}
}

frame.addEventListener('load', () => {
  loading.style.display = 'none';
  try {
    frame.contentDocument.documentElement.scrollTop = 0;
    frame.contentDocument.body.scrollTop = 0;
  } catch(e) {}
});

select.addEventListener('change', e => renderLesson(e.target.value));
tabs.forEach(btn => btn.addEventListener('click', () => renderLesson(btn.dataset.lesson)));
document.getElementById('prevBtn').addEventListener('click', () => renderLesson(current - 1));
document.getElementById('nextBtn').addEventListener('click', () => renderLesson(current + 1));

document.getElementById('printBtn').addEventListener('click', () => {
  try { frame.contentWindow.focus(); frame.contentWindow.print(); }
  catch(e) { alert('현재 차시 화면에서 직접 인쇄/PDF 버튼을 눌러 주세요.'); }
});

document.getElementById('openNewBtn').addEventListener('click', () => {
  const lesson = lessons[current - 1];
  const blob = new Blob([lesson.content], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  window.open(url, '_blank', 'noopener');
  setTimeout(() => URL.revokeObjectURL(url), 60000);
});

document.addEventListener('keydown', e => {
  if (e.altKey && e.key === 'ArrowLeft') renderLesson(current - 1);
  if (e.altKey && e.key === 'ArrowRight') renderLesson(current + 1);
});

let saved = 1;
try { saved = Number(localStorage.getItem('QLearn_currentLesson')) || 1; } catch(e) {}
renderLesson(saved);
</script>
