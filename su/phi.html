<script>

            "import math 없이 math.pi를 직접 호출할 수 있다.",

        exp: "- ④ math 모듈 임포트가 필요합니다.\n- ⑤ 메모리 한계로 IEEE 754 부동소수점 정밀도 한계 내에서 저장됩니다."

    {

        options: [
            "180도(degree)는 정확히 $\\pi$ 라디안(radian)과 같다.",
            "math.radians(180)의 출력 결과는 math.pi와 동일하다.",
            "math.degrees(math.pi)의 출력 결과는 180.0이다.",

    {

    {

        code: `import math\ndef cylinder_info(r, h):\n    vol = math.pi * (r ** 2) * h\n    area = 2 * math.pi * r * h + 2 * math.pi * (r ** 2)\n    return vol, area`,
        q: "Q6. 원기둥 수식 계산에 대한 설명 중 올바른 것 3개를 고르세요.",
        options: [
            "원기둥 부피 공식 $V = \\pi r^2 h$ 이 코드로 표현되었다.",
            "원기둥 겉넓이 공식 $A = 2\\pi rh + 2\\pi r^2$ 이 반영되었다.",
            "$2\\pi r^2$ 항은 원기둥의 밑면 2개의 넓이 합을 뜻한다.",
            "$r=1, h=1$ 일 때 부피값은 $2\\pi$ 이다.",
            "math.pi * r * h 만으로 원기둥의 옆넓이가 완벽히 계산된다."

        ans: [0, 1, 2],
        exp: "- ④ $r=1, h=1$ 일 때 부피는 $1\\pi = \\pi$ 입니다.\n- ⑤ 옆넓이 공식은 $2\\pi rh$ 입니다."
    },
    {
        num: 7, title: "07. 원뿔의 부피", category: "기하학",
        code: `import math\ndef cone_volume(r, h):\n    return (1 / 3) * math.pi * (r ** 2) * h\n\nprint(cone_volume(3, 5))`,

            "$r=3, h=5$ 일 때 이론적 부피는 $15\\pi$ 이다.",

            "원뿔 부피는 밑면의 반지름 $r$의 변화보다 높이 $h$의 변화에 2차적으로 더 크게 영향받는다.",
            "파이썬에서 1 // 3 으로 작성해도 완벽히 동일하게 동작한다."

        num: 8, title: "08. 라이프니츠 급수 (Leibniz Series)", category: "무한급수",
        code: `def leibniz(n):\n    return 4 * sum((-1)**k / (2*k + 1) for k in range(n))\n\nprint(leibniz(100000))`,

        options: [
            "양항과 음항이 교대로 나타나는 교대급수 구조이다.",

function renderQuiz() {
    const form = document.getElementById('quiz-form');
    let html = '';

    quizData.forEach((data, idx) => {
        html += `
        <div class="example-card" id="card-${idx}">
            <div class="example-header">
                <span class="example-title">${data.title}</span>
                <span class="example-category">${data.category}</span>
            </div>
            <pre><code>${escapeHtml(data.code)}</code></pre>
            <div class="quiz-container">
                <div class="quiz-title">
                    ${data.q}
                    <span id="badge-${idx}" class="status-badge"></span>
                </div>
                <ul class="quiz-options">
                    ${data.options.map((opt, oIdx) => `
                        <li>
                            <label style="width:100%; cursor:pointer; display:flex; align-items:center;">
                                <input type="checkbox" name="q-${idx}" value="${oIdx}">
                                <span>${getCircleNum(oIdx + 1)} ${opt}</span>
                            </label>
                        </li>
                    `).join('')}
                </ul>
                <details>
                    <summary>정답 및 해설 보기</summary>
                    <div class="answer-box">
                        <span class="answer-badge">정답: ${data.ans.map(a => getCircleNum(a + 1)).join(', ')}</span><br>
                        ${data.exp.replace(/\n/g, '<br>')}
                    </div>
                </details>
            </div>
        </div>
        `;
    });

    form.innerHTML = html;
    if (window.MathJax) {
        MathJax.typesetPromise();
    }
}

function getCircleNum(n) {
    const circles = ['①', '②', '③', '④', '⑤'];
    return circles[n - 1] || n;
}

function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function submitQuiz() {
    const studentId = document.getElementById('student-id').value.trim();
    const studentName = document.getElementById('student-name').value.trim();

    if (!studentId || !studentName) {
        alert("학번과 이름을 올바르게 입력해주세요.");
        return;
    }

    let correctCount = 0;
    let detailResults = [];

    quizData.forEach((data, idx) => {
        const checkboxes = document.querySelectorAll(`input[name="q-${idx}"]:checked`);
        const userAns = Array.from(checkboxes).map(cb => parseInt(cb.value)).sort();
        const targetAns = data.ans.slice().sort();

        const isCorrect = JSON.stringify(userAns) === JSON.stringify(targetAns);
        const badge = document.getElementById(`badge-${idx}`);

        if (isCorrect) {
            correctCount++;
            badge.textContent = "정답 (O)";
            badge.className = "status-badge correct";
        } else {
            badge.textContent = "오답 (X)";
            badge.className = "status-badge wrong";
        }

        const userAnsStr = userAns.length > 0 ? userAns.map(a => getCircleNum(a + 1)).join(',') : '미선택';
        const targetAnsStr = targetAns.map(a => getCircleNum(a + 1)).join(',');
        detailResults.push(`Q${idx + 1}: ${isCorrect ? '정답' : '오답'} (선택: ${userAnsStr} / 정답: ${targetAnsStr})`);
    });

    const score = Math.round((correctCount / quizData.length) * 100);
    const piVal = "3.141592";
    
    // 현재 시각 포맷팅 (YYYYMMDD_HHMMSS)
    const now = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    const timeStr = `${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;

    // 상단 배너 표시
    const banner = document.getElementById('result-banner');
    banner.style.display = 'block';
    banner.innerHTML = `[채점 완료] ${studentName}(${studentId})님의 점수: <strong>${score}점</strong> (${correctCount} / 30 문항 맞춤)`;

    // 텍스트 파일 생성 및 다운로드 (한글 깨짐 방지 BOM 추가)
    const fileName = `${studentId}_${studentName}_${score}점_${piVal}_${timeStr}.txt`;
    const fileContent = 
`========================================
원주율(π) 파이썬 코드 & 수식 퀴즈 응시 결과
========================================
학번: ${studentId}
이름: ${studentName}
점수: ${score}점 (${correctCount} / 30 문항 맞춤)
원주율(math.pi): 3.141592653589793
응시시각: ${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}
----------------------------------------
[문항별 상세 정오답 리스트]
${detailResults.join('\n')}
========================================
`;

    // UTF-8 BOM (\uFEFF) 추가로 메모장 한글 깨짐 방지
    const blob = new Blob(["\uFEFF" + fileContent], { type: "text/plain;charset=utf-8" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = fileName;
    link.click();
    URL.revokeObjectURL(link.href);
}

window.onload = renderQuiz;
