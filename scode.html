<style>

<script>
const DATA=[{"title": "오픈소스 라이브러리를 활용한 데이터 협력 프로젝트", "concept": "Pandas는 표 형태 자료의 불러오기·전처리·검색·집계에, Matplotlib는 분석 결과의 시각화에 활용된다. 오픈소스를 사용할 때는 기능뿐 아니라 라이선스, 출처 표시, 개인정보, 변경 기록과 팀원의 기여를 함께 관리해야 한다.", "task": "학교생활 데이터를 CSV로 관리하고 결측값 처리, 조건 검색, 집계, 그래프 저장 기능을 구현하며 라이선스와 협업 기록을 작성한다.", "standard": "오픈소스와 라이브러리를 목적에 맞게 활용하여 협력적으로 프로그램을 개발하고, 저작권·개인정보·데이터 윤리를 고려하여 결과를 공유한다.", "code": "from pathlib import Path\nimport pandas as pd\n\noutput = Path(\"dashboard_output\")\noutput.mkdir(exist_ok=True)\n\ndf = pd.DataFrame({\n    \"category\": [\"공지\", \"행사\", \"공지\", \"급식\"],\n    \"title\": [\"안전교육\", \"체험전\", None, \"식단 안내\"],\n    \"views\": [85, 210, 90, 120]\n})\n\ndf[\"title\"] = df[\"title\"].fillna(\"제목 없음\")\nresult = df[df[\"views\"] >= 100].sort_values(\"views\", ascending=False)\nresult.to_csv(output / \"search_result.csv\", index=False, encoding=\"utf-8-sig\")\nprint(result)", "choices": ["output.mkdir(exist_ok=True)는 출력 폴더가 이미 있어도 오류를 피한다.", "fillna('제목 없음')는 title 열의 결측값을 대체한다.", "views가 100 미만인 행만 result에 남는다.", "sort_values(..., ascending=False)는 조회 수를 내림차순으로 정렬한다.", "to_csv()는 결과를 그래프 이미지로만 저장한다."], "answer": [0, 1, 3], "exp": ["옳음. 폴더가 없으면 만들고 이미 존재하면 계속 실행한다.", "옳음. 누락된 제목을 지정한 문자열로 보완한다.", "틀림. 조건은 views가 100 이상인 행을 선택한다.", "옳음. 큰 조회 수부터 정렬한다.", "틀림. CSV 형식의 텍스트 데이터 파일로 저장한다."], "id": 1, "source_no": "10", "theme_key": "opensource", "focus": "전처리·검색·파일 저장"}, {"title": "반복구조와 재귀구조를 이용한 팩토리얼 비교", "concept": "반복구조는 반복문으로 상태를 갱신하고, 재귀구조는 함수가 자기 자신을 호출하여 문제를 축소한다. 두 방식은 같은 결과를 만들 수 있으나 재귀 방식은 호출 스택과 함수 호출 비용이 발생한다. 따라서 정확성, 입력 범위, 실행 시간, 메모리 사용량을 함께 검토해야 한다.", "task": "반복형과 재귀형 팩토리얼 함수를 구현하고 여러 입력에서 결과를 검증하며 실행 구조와 공간 사용의 차이를 설명한다.", "standard": "반복과 재귀를 포함한 제어 구조를 활용하여 프로그램을 작성하고, 동일 문제를 해결하는 여러 방법의 효율성과 적용 조건을 비교·분석한다.", "code": "def factorial_iterative(n):\n    result = 1\n    for value in range(2, n + 1):\n        result *= value\n    return result\n\ndef factorial_recursive(n):\n    if n <= 1:\n        return 1\n    return n * factorial_recursive(n - 1)\n\nfor n in [0, 1, 5, 8]:\n    a = factorial_iterative(n)\n    b = factorial_recursive(n)\n    print(n, a, b, a == b)", "choices": ["factorial_iterative()는 반복문을 이용하여 누적 곱을 계산한다.", "factorial_recursive()에는 재귀 호출을 끝내는 기본 사례가 없다.", "두 함수는 5를 입력하면 모두 120을 반환한다.", "재귀 방식은 함수 호출 스택을 사용할 수 있다.", "반복 방식은 입력값과 관계없이 항상 한 번만 곱셈한다."], "answer": [0, 2, 3], "exp": ["옳음. result에 2부터 n까지의 값을 차례로 곱한다.", "틀림. n이 1 이하일 때 1을 반환하는 기본 사례가 있다.", "옳음. 5!은 120이며 두 구현의 결과가 일치한다.", "옳음. 재귀 호출이 쌓이므로 호출 스택을 사용한다.", "틀림. n이 커질수록 반복 횟수와 곱셈 횟수도 증가한다."], "id": 2, "source_no": "12", "theme_key": "factorial", "focus": "반복과 재귀의 결과 일치 검증"}, {"title": "스택과 큐의 자료 처리 원리 및 직접 구현", "concept": "스택은 나중에 삽입한 자료를 먼저 꺼내는 후입선출 구조이고, 큐는 먼저 삽입한 자료를 먼저 꺼내는 선입선출 구조이다. 자료구조를 직접 구현할 때는 삽입·삭제·조회 연산과 빈 구조에서의 예외 상황을 명확히 처리해야 한다.", "task": "리스트와 deque를 활용하여 스택과 큐를 구현하고, 연산 전후의 내부 상태를 출력하여 LIFO와 FIFO의 차이를 분석한다.", "standard": "문제 해결에 필요한 선형 자료구조의 특성을 이해하고, 자료의 저장·삭제·탐색 연산을 구현하며 상황에 적합한 자료구조를 선택한다.", "code": "from collections import deque\n\nstack = []\nqueue = deque()\n\nstack.append(\"A\")\nstack.append(\"B\")\nqueue.append(\"A\")\nqueue.append(\"B\")\n\nprint(\"스택 삭제:\", stack.pop())\nprint(\"큐 삭제:\", queue.popleft())\nprint(\"스택 상태:\", stack)\nprint(\"큐 상태:\", list(queue))", "choices": ["stack.pop()은 가장 나중에 삽입된 'B'를 삭제한다.", "queue.popleft()는 가장 나중에 삽입된 'B'를 먼저 삭제한다.", "스택은 후입선출 구조를 따른다.", "큐는 선입선출 구조를 따른다.", "deque에서는 왼쪽 자료를 삭제할 수 없다."], "answer": [0, 2, 3], "exp": ["옳음. 리스트의 pop()은 마지막 원소를 제거한다.", "틀림. popleft()는 가장 먼저 삽입된 'A'를 제거한다.", "옳음. 마지막에 들어온 자료가 먼저 나간다.", "옳음. 먼저 들어온 자료가 먼저 나간다.", "틀림. deque의 popleft()가 왼쪽 자료를 효율적으로 삭제한다."], "id": 3, "source_no": "13", "theme_key": "stack_queue", "focus": "LIFO·FIFO 상태 변화"}, {"title": "스택을 활용한 괄호 검사 알고리즘", "concept": "괄호 검사는 가장 최근에 열린 괄호와 현재 닫는 괄호가 짝을 이루어야 하므로 후입선출 구조가 적합하다. 닫는 괄호가 먼저 등장한 경우, 괄호 종류가 맞지 않는 경우, 검사가 끝난 뒤 여는 괄호가 남은 경우를 모두 검사해야 한다.", "task": "소괄호·중괄호·대괄호가 섞인 문자열의 괄호 짝과 중첩 순서를 검사하고 정상·오류·경계 사례를 시험한다.", "standard": "자료구조의 특성을 활용하여 알고리즘을 설계하고, 다양한 시험 자료와 예외 상황을 적용하여 프로그램의 정확성과 안정성을 검증한다.", "code": "def is_balanced(text):\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n\n    for ch in text:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n\n    return not stack\n\nfor sample in [\"([])\", \"([)]\", \"((()))\", \"(()\"]:\n    print(sample, is_balanced(sample))", "choices": ["여는 괄호는 stack에 저장된다.", "닫는 괄호가 나올 때 스택이 비어 있어도 항상 정상으로 처리한다.", "pairs는 닫는 괄호와 대응하는 여는 괄호를 연결한다.", "검사가 끝난 뒤 stack에 괄호가 남아 있으면 올바른 문자열이다.", "이 알고리즘은 중첩된 괄호의 순서를 검사할 수 있다."], "answer": [0, 2, 4], "exp": ["옳음. 이후 닫는 괄호와 비교하기 위해 여는 괄호를 저장한다.", "틀림. 스택이 비어 있으면 대응할 여는 괄호가 없으므로 False를 반환한다.", "옳음. 각 닫는 괄호가 어떤 여는 괄호와 짝인지 정의한다.", "틀림. 닫히지 않은 여는 괄호가 남은 것이므로 잘못된 문자열이다.", "옳음. 가장 최근의 여는 괄호를 pop하여 중첩 순서를 확인한다."], "id": 4, "source_no": "14", "theme_key": "bracket", "focus": "중첩 구조와 괄호 불일치"}, {"title": "상태 공간 모델링과 너비 우선 탐색", "concept": "너비 우선 탐색은 시작 상태에서 가까운 상태부터 층별로 탐색한다. 간선의 비용이 동일한 상태 공간에서는 처음 목표에 도달한 경로가 최단 경로가 된다. 큐는 탐색 순서를 관리하고 방문 집합은 중복 탐색과 순환을 방지한다.", "task": "격자 미로를 상태 공간으로 표현하고 큐와 방문 집합을 이용하여 시작점에서 목표점까지의 최단 거리를 구한다.", "standard": "상태, 초기 상태, 목표 상태, 전이 규칙을 정의하여 탐색 문제를 모델링하고, 적절한 탐색 알고리즘과 자료구조를 선택하여 해결한다.", "code": "from collections import deque\n\ndef bfs(graph, start, goal):\n    queue = deque([(start, 0)])\n    visited = {start}\n\n    while queue:\n        node, distance = queue.popleft()\n        if node == goal:\n            return distance\n\n        for nxt in graph[node]:\n            if nxt not in visited:\n                visited.add(nxt)\n                queue.append((nxt, distance + 1))\n    return -1\n\ngraph = {\n    \"A\": [\"B\", \"C\"],\n    \"B\": [\"A\", \"D\"],\n    \"C\": [\"A\", \"D\"],\n    \"D\": [\"B\", \"C\"]\n}\nprint(bfs(graph, \"A\", \"D\"))", "choices": ["queue는 먼저 발견한 상태를 먼저 처리하도록 돕는다.", "visited를 사용하면 이미 탐색한 상태의 반복 방문을 줄일 수 있다.", "목표에 도달하지 못하면 이 함수는 항상 0을 반환한다.", "모든 간선의 비용이 같을 때 BFS는 최단 거리를 구할 수 있다.", "queue.popleft()는 가장 나중에 넣은 항목을 꺼낸다."], "answer": [0, 1, 3], "exp": ["옳음. 큐의 선입선출 특성으로 가까운 상태부터 처리한다.", "옳음. 중복 탐색과 순환을 방지한다.", "틀림. 목표에 도달하지 못하면 -1을 반환한다.", "옳음. 같은 비용의 간선에서는 층별 탐색이 최단 경로를 보장한다.", "틀림. popleft()는 가장 먼저 넣은 항목을 꺼낸다."], "id": 5, "source_no": "15", "theme_key": "bfs", "focus": "최단 거리와 방문 집합"}, {"title": "완전 탐색과 가지치기를 이용한 부분집합 합", "concept": "완전 탐색은 가능한 모든 선택을 조사하여 정답을 보장하지만 상태 수가 지수적으로 증가할 수 있다. 가지치기는 현재 상태에서 정답에 도달할 가능성이 없는 분기를 안전하게 제외하여 탐색량을 줄인다. 배제 기준이 정답 후보를 제거하지 않는지 논리적으로 검토해야 한다.", "task": "부분집합 합 문제를 선택·미선택 상태 공간으로 모델링하고 완전 탐색과 가지치기의 방문 상태 수를 비교한다.", "standard": "복잡한 문제를 상태 공간으로 추상화하고 완전 탐색, 가지치기, 탐욕 전략의 특징과 적용 조건을 비교하여 효율적인 알고리즘을 설계한다.", "code": "def subset_sum(numbers, target):\n    numbers = sorted(numbers, reverse=True)\n    visited = 0\n\n    def search(index, current):\n        nonlocal visited\n        visited += 1\n\n        if current == target:\n            return True\n        if index == len(numbers) or current > target:\n            return False\n\n        remaining = sum(numbers[index:])\n        if current + remaining < target:\n            return False\n\n        return (\n            search(index + 1, current + numbers[index])\n            or search(index + 1, current)\n        )\n\n    found = search(0, 0)\n    return found, visited\n\nprint(subset_sum([8, 6, 4, 3], 10))", "choices": ["current == target이면 목표 합을 찾았으므로 True를 반환한다.", "current + remaining < target인 분기는 목표에 도달할 수 없어 제외한다.", "가지치기를 적용하면 어떤 기준을 사용해도 항상 정답이 보장된다.", "visited는 탐색한 상태 수를 비교하는 데 활용할 수 있다.", "current > target인 경우에도 반드시 모든 남은 원소를 선택해야 한다."], "answer": [0, 1, 3], "exp": ["옳음. 현재 선택한 원소의 합이 목표와 일치한다.", "옳음. 남은 원소를 모두 더해도 목표보다 작으므로 더 탐색할 필요가 없다.", "틀림. 정답 후보를 잘못 제거하지 않는 안전한 기준이어야 한다.", "옳음. 탐색 효율을 정량적으로 비교할 수 있다.", "틀림. 양수만 있는 조건에서는 이미 목표를 넘었으므로 해당 분기를 중단할 수 있다."], "id": 6, "source_no": "16", "theme_key": "pruning", "focus": "안전한 배제 기준"}, {"title": "분할정복을 활용한 병합 정렬", "concept": "병합 정렬은 목록을 절반으로 분할하고 각 부분을 재귀적으로 정렬한 뒤 두 정렬 목록을 결합한다. 분할 깊이는 로그 수준이고 각 깊이에서 전체 원소를 처리하므로 시간 복잡도는 O(n log n)이다. 병합을 위한 추가 공간이 필요하다.", "task": "병합 정렬의 분할·정복·결합 함수를 구현하고 빈 목록, 중복값, 정렬·역순 자료에서 결과를 검증한다.", "standard": "분할정복 전략으로 문제를 작은 부분 문제로 나누어 해결하고, 알고리즘의 정확성 및 시간·공간 복잡도를 분석한다.", "code": "def merge(left, right):\n    result = []\n    i = j = 0\n\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:\n            result.append(left[i])\n            i += 1\n        else:\n            result.append(right[j])\n            j += 1\n\n    return result + left[i:] + right[j:]\n\ndef merge_sort(values):\n    if len(values) <= 1:\n        return values\n\n    middle = len(values) // 2\n    left = merge_sort(values[:middle])\n    right = merge_sort(values[middle:])\n    return merge(left, right)\n\nprint(merge_sort([5, 2, 7, 2, 1]))", "choices": ["len(values) <= 1은 재귀 호출을 끝내는 기본 사례이다.", "merge()는 두 정렬된 목록을 하나의 정렬 목록으로 결합한다.", "merge_sort()는 목록을 분할하지 않고 한 번의 비교만 수행한다.", "병합 정렬의 일반적인 시간 복잡도는 O(n log n)이다.", "이 코드는 중복값을 모두 자동으로 삭제한다."], "answer": [0, 1, 3], "exp": ["옳음. 원소가 하나 이하이면 이미 정렬된 상태이다.", "옳음. 두 목록의 앞 원소를 비교하며 작은 값을 결과에 넣는다.", "틀림. 목록을 절반으로 반복 분할하고 재귀적으로 정렬한다.", "옳음. 로그 깊이의 분할마다 전체 n개 원소를 병합한다.", "틀림. 중복값도 원래 개수만큼 유지한다."], "id": 7, "source_no": "17", "theme_key": "merge", "focus": "분할 깊이와 병합 과정"}, {"title": "상태와 점화식을 이용한 동적계획법", "concept": "동적계획법은 중복되는 부분 문제와 최적 부분 구조를 활용한다. 계단 오르기 문제에서 n번째 상태는 n-1번째와 n-2번째 상태의 결과로 계산할 수 있다. 테이블 방식은 작은 상태부터 계산하며, 직전 두 상태만 필요하면 공간을 상수 수준으로 줄일 수 있다.", "task": "계단 오르기 문제의 상태·초기값·점화식을 정의하고 단순 재귀, 메모이제이션, 테이블, 공간 최적화 방식을 비교한다.", "standard": "문제에서 중복 부분 문제를 발견하고 상태와 점화식을 정의하여 동적계획법 알고리즘을 구현하며 효율성을 분석한다.", "code": "def stairs_dp(n):\n    if n < 1:\n        raise ValueError(\"n은 1 이상이어야 합니다.\")\n    if n == 1:\n        return 1\n\n    previous, current = 1, 2\n    for _ in range(3, n + 1):\n        previous, current = current, previous + current\n    return current\n\nfor n in [1, 2, 5, 10]:\n    print(n, stairs_dp(n))", "choices": ["previous와 current는 직전 두 상태의 값을 저장한다.", "n이 1보다 작으면 ValueError가 발생한다.", "이 함수는 모든 상태를 길이 n의 목록에 저장한다.", "stairs_dp(5)의 결과는 8이다.", "반복문이 실행될 때 previous와 current는 항상 같은 값을 유지한다."], "answer": [0, 1, 3], "exp": ["옳음. 다음 상태 계산에 필요한 두 값만 유지한다.", "옳음. 문제의 유효한 입력 범위를 검사한다.", "틀림. 전체 테이블 대신 두 변수만 사용한다.", "옳음. 1칸 또는 2칸씩 이동할 때 5칸을 오르는 방법은 8가지이다.", "틀림. 반복마다 두 변수가 다음 상태 값으로 갱신된다."], "id": 8, "source_no": "18", "theme_key": "dp", "focus": "상태·초기값·점화식"}, {"title": "교실 공기질 데이터 전처리와 환기 알림 프로젝트", "concept": "센서 자료에는 결측값과 물리적으로 타당하지 않은 비정상값이 포함될 수 있다. 분석 전 자료형 변환, 허용 범위 검사, 결측값 보완을 수행해야 하며, 분류 기준은 명시하고 검증해야 한다. 결과는 표와 그래프로 표현하되 센서 오차와 기준의 한계를 함께 설명해야 한다.", "task": "이산화탄소·온도·습도 자료를 전처리하고 이산화탄소 농도에 따라 상태와 환기 안내를 생성하여 CSV와 그래프로 저장한다.", "standard": "실생활 문제를 데이터 기반으로 분석하고, 요구사항에 따라 자료를 수집·전처리·분석·시각화하며 결과의 신뢰성과 윤리적 활용을 평가한다.", "code": "import pandas as pd\n\ndf = pd.DataFrame({\n    \"time\": [\"09:00\", \"09:20\", \"09:40\", \"10:00\"],\n    \"co2\": [620, None, 1120, 5200]\n})\n\ndf[\"co2\"] = pd.to_numeric(df[\"co2\"], errors=\"coerce\")\ndf.loc[~df[\"co2\"].between(350, 5000), \"co2\"] = pd.NA\ndf[\"co2\"] = df[\"co2\"].interpolate(limit_direction=\"both\")\n\ndef classify(value):\n    if value < 800:\n        return \"좋음\"\n    if value < 1000:\n        return \"보통\"\n    if value < 1500:\n        return \"환기 권고\"\n    return \"즉시 환기\"\n\ndf[\"status\"] = df[\"co2\"].apply(classify)\nprint(df)", "choices": ["5200은 허용 범위를 벗어나 결측값으로 바뀐다.", "interpolate()는 결측값을 주변 자료를 바탕으로 보완할 수 있다.", "classify()는 700을 '즉시 환기'로 분류한다.", "pd.to_numeric(..., errors='coerce')는 변환 불가능한 값을 결측값으로 처리할 수 있다.", "이 코드는 센서 자료의 정확성을 검증하지 않아도 실제 정책 기준으로 바로 사용할 수 있다."], "answer": [0, 1, 3], "exp": ["옳음. 350~5000 범위를 벗어난 값은 pd.NA로 변경한다.", "옳음. 앞뒤 값의 흐름을 이용해 누락값을 보완한다.", "틀림. 700은 800 미만이므로 '좋음'으로 분류한다.", "옳음. 숫자로 바꾸기 어려운 값은 NaN으로 변환된다.", "틀림. 센서 정확도와 실제 기준을 추가로 검증해야 한다."], "id": 9, "source_no": "19", "theme_key": "air", "focus": "결측값·비정상값 처리"}, {"title": "오픈소스 라이브러리를 활용한 데이터 협력 프로젝트", "concept": "Pandas는 표 형태 자료의 불러오기·전처리·검색·집계에, Matplotlib는 분석 결과의 시각화에 활용된다. 오픈소스를 사용할 때는 기능뿐 아니라 라이선스, 출처 표시, 개인정보, 변경 기록과 팀원의 기여를 함께 관리해야 한다.", "task": "학교생활 데이터를 CSV로 관리하고 결측값 처리, 조건 검색, 집계, 그래프 저장 기능을 구현하며 라이선스와 협업 기록을 작성한다.", "standard": "오픈소스와 라이브러리를 목적에 맞게 활용하여 협력적으로 프로그램을 개발하고, 저작권·개인정보·데이터 윤리를 고려하여 결과를 공유한다.", "code": "from pathlib import Path\nimport pandas as pd\n\noutput = Path(\"dashboard_output\")\noutput.mkdir(exist_ok=True)\n\ndf = pd.DataFrame({\n    \"category\": [\"공지\", \"행사\", \"공지\", \"급식\"],\n    \"title\": [\"안전교육\", \"체험전\", None, \"식단 안내\"],\n    \"views\": [85, 210, 90, 120]\n})\n\ndf[\"title\"] = df[\"title\"].fillna(\"제목 없음\")\nresult = df[df[\"views\"] >= 100].sort_values(\"views\", ascending=False)\nresult.to_csv(output / \"search_result.csv\", index=False, encoding=\"utf-8-sig\")\nprint(result)", "choices": ["output.mkdir(exist_ok=True)는 출력 폴더가 이미 있어도 오류를 피한다.", "fillna('제목 없음')는 title 열의 결측값을 대체한다.", "views가 100 미만인 행만 result에 남는다.", "sort_values(..., ascending=False)는 조회 수를 내림차순으로 정렬한다.", "to_csv()는 결과를 그래프 이미지로만 저장한다."], "answer": [0, 1, 3], "exp": ["옳음. 폴더가 없으면 만들고 이미 존재하면 계속 실행한다.", "옳음. 누락된 제목을 지정한 문자열로 보완한다.", "틀림. 조건은 views가 100 이상인 행을 선택한다.", "옳음. 큰 조회 수부터 정렬한다.", "틀림. CSV 형식의 텍스트 데이터 파일로 저장한다."], "id": 10, "source_no": "20", "theme_key": "opensource", "focus": "라이선스·출처·정보윤리"}, {"title": "반복구조와 재귀구조를 이용한 팩토리얼 비교", "concept": "반복구조는 반복문으로 상태를 갱신하고, 재귀구조는 함수가 자기 자신을 호출하여 문제를 축소한다. 두 방식은 같은 결과를 만들 수 있으나 재귀 방식은 호출 스택과 함수 호출 비용이 발생한다. 따라서 정확성, 입력 범위, 실행 시간, 메모리 사용량을 함께 검토해야 한다.", "task": "반복형과 재귀형 팩토리얼 함수를 구현하고 여러 입력에서 결과를 검증하며 실행 구조와 공간 사용의 차이를 설명한다.", "standard": "반복과 재귀를 포함한 제어 구조를 활용하여 프로그램을 작성하고, 동일 문제를 해결하는 여러 방법의 효율성과 적용 조건을 비교·분석한다.", "code": "def factorial_iterative(n):\n    result = 1\n    for value in range(2, n + 1):\n        result *= value\n    return result\n\ndef factorial_recursive(n):\n    if n <= 1:\n        return 1\n    return n * factorial_recursive(n - 1)\n\nfor n in [0, 1, 5, 8]:\n    a = factorial_iterative(n)\n    b = factorial_recursive(n)\n    print(n, a, b, a == b)", "choices": ["factorial_iterative()는 반복문을 이용하여 누적 곱을 계산한다.", "factorial_recursive()에는 재귀 호출을 끝내는 기본 사례가 없다.", "두 함수는 5를 입력하면 모두 120을 반환한다.", "재귀 방식은 함수 호출 스택을 사용할 수 있다.", "반복 방식은 입력값과 관계없이 항상 한 번만 곱셈한다."], "answer": [0, 2, 3], "exp": ["옳음. result에 2부터 n까지의 값을 차례로 곱한다.", "틀림. n이 1 이하일 때 1을 반환하는 기본 사례가 있다.", "옳음. 5!은 120이며 두 구현의 결과가 일치한다.", "옳음. 재귀 호출이 쌓이므로 호출 스택을 사용한다.", "틀림. n이 커질수록 반복 횟수와 곱셈 횟수도 증가한다."], "id": 11, "source_no": "23", "theme_key": "factorial", "focus": "호출 스택과 예외 입력 분석"}, {"title": "스택을 활용한 괄호 검사 알고리즘", "concept": "괄호 검사는 가장 최근에 열린 괄호와 현재 닫는 괄호가 짝을 이루어야 하므로 후입선출 구조가 적합하다. 닫는 괄호가 먼저 등장한 경우, 괄호 종류가 맞지 않는 경우, 검사가 끝난 뒤 여는 괄호가 남은 경우를 모두 검사해야 한다.", "task": "소괄호·중괄호·대괄호가 섞인 문자열의 괄호 짝과 중첩 순서를 검사하고 정상·오류·경계 사례를 시험한다.", "standard": "자료구조의 특성을 활용하여 알고리즘을 설계하고, 다양한 시험 자료와 예외 상황을 적용하여 프로그램의 정확성과 안정성을 검증한다.", "code": "def is_balanced(text):\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n\n    for ch in text:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n\n    return not stack\n\nfor sample in [\"([])\", \"([)]\", \"((()))\", \"(()\"]:\n    print(sample, is_balanced(sample))", "choices": ["여는 괄호는 stack에 저장된다.", "닫는 괄호가 나올 때 스택이 비어 있어도 항상 정상으로 처리한다.", "pairs는 닫는 괄호와 대응하는 여는 괄호를 연결한다.", "검사가 끝난 뒤 stack에 괄호가 남아 있으면 올바른 문자열이다.", "이 알고리즘은 중첩된 괄호의 순서를 검사할 수 있다."], "answer": [0, 2, 4], "exp": ["옳음. 이후 닫는 괄호와 비교하기 위해 여는 괄호를 저장한다.", "틀림. 스택이 비어 있으면 대응할 여는 괄호가 없으므로 False를 반환한다.", "옳음. 각 닫는 괄호가 어떤 여는 괄호와 짝인지 정의한다.", "틀림. 닫히지 않은 여는 괄호가 남은 것이므로 잘못된 문자열이다.", "옳음. 가장 최근의 여는 괄호를 pop하여 중첩 순서를 확인한다."], "id": 12, "source_no": "24", "theme_key": "bracket", "focus": "빈 스택과 미종결 괄호"}, {"title": "상태 공간 모델링과 너비 우선 탐색", "concept": "너비 우선 탐색은 시작 상태에서 가까운 상태부터 층별로 탐색한다. 간선의 비용이 동일한 상태 공간에서는 처음 목표에 도달한 경로가 최단 경로가 된다. 큐는 탐색 순서를 관리하고 방문 집합은 중복 탐색과 순환을 방지한다.", "task": "격자 미로를 상태 공간으로 표현하고 큐와 방문 집합을 이용하여 시작점에서 목표점까지의 최단 거리를 구한다.", "standard": "상태, 초기 상태, 목표 상태, 전이 규칙을 정의하여 탐색 문제를 모델링하고, 적절한 탐색 알고리즘과 자료구조를 선택하여 해결한다.", "code": "from collections import deque\n\ndef bfs(graph, start, goal):\n    queue = deque([(start, 0)])\n    visited = {start}\n\n    while queue:\n        node, distance = queue.popleft()\n        if node == goal:\n            return distance\n\n        for nxt in graph[node]:\n            if nxt not in visited:\n                visited.add(nxt)\n                queue.append((nxt, distance + 1))\n    return -1\n\ngraph = {\n    \"A\": [\"B\", \"C\"],\n    \"B\": [\"A\", \"D\"],\n    \"C\": [\"A\", \"D\"],\n    \"D\": [\"B\", \"C\"]\n}\nprint(bfs(graph, \"A\", \"D\"))", "choices": ["queue는 먼저 발견한 상태를 먼저 처리하도록 돕는다.", "visited를 사용하면 이미 탐색한 상태의 반복 방문을 줄일 수 있다.", "목표에 도달하지 못하면 이 함수는 항상 0을 반환한다.", "모든 간선의 비용이 같을 때 BFS는 최단 거리를 구할 수 있다.", "queue.popleft()는 가장 나중에 넣은 항목을 꺼낸다."], "answer": [0, 1, 3], "exp": ["옳음. 큐의 선입선출 특성으로 가까운 상태부터 처리한다.", "옳음. 중복 탐색과 순환을 방지한다.", "틀림. 목표에 도달하지 못하면 -1을 반환한다.", "옳음. 같은 비용의 간선에서는 층별 탐색이 최단 경로를 보장한다.", "틀림. popleft()는 가장 먼저 넣은 항목을 꺼낸다."], "id": 13, "source_no": "25", "theme_key": "bfs", "focus": "상태·전이 규칙 모델링"}, {"title": "완전 탐색과 가지치기를 이용한 부분집합 합", "concept": "완전 탐색은 가능한 모든 선택을 조사하여 정답을 보장하지만 상태 수가 지수적으로 증가할 수 있다. 가지치기는 현재 상태에서 정답에 도달할 가능성이 없는 분기를 안전하게 제외하여 탐색량을 줄인다. 배제 기준이 정답 후보를 제거하지 않는지 논리적으로 검토해야 한다.", "task": "부분집합 합 문제를 선택·미선택 상태 공간으로 모델링하고 완전 탐색과 가지치기의 방문 상태 수를 비교한다.", "standard": "복잡한 문제를 상태 공간으로 추상화하고 완전 탐색, 가지치기, 탐욕 전략의 특징과 적용 조건을 비교하여 효율적인 알고리즘을 설계한다.", "code": "def subset_sum(numbers, target):\n    numbers = sorted(numbers, reverse=True)\n    visited = 0\n\n    def search(index, current):\n        nonlocal visited\n        visited += 1\n\n        if current == target:\n            return True\n        if index == len(numbers) or current > target:\n            return False\n\n        remaining = sum(numbers[index:])\n        if current + remaining < target:\n            return False\n\n        return (\n            search(index + 1, current + numbers[index])\n            or search(index + 1, current)\n        )\n\n    found = search(0, 0)\n    return found, visited\n\nprint(subset_sum([8, 6, 4, 3], 10))", "choices": ["current == target이면 목표 합을 찾았으므로 True를 반환한다.", "current + remaining < target인 분기는 목표에 도달할 수 없어 제외한다.", "가지치기를 적용하면 어떤 기준을 사용해도 항상 정답이 보장된다.", "visited는 탐색한 상태 수를 비교하는 데 활용할 수 있다.", "current > target인 경우에도 반드시 모든 남은 원소를 선택해야 한다."], "answer": [0, 1, 3], "exp": ["옳음. 현재 선택한 원소의 합이 목표와 일치한다.", "옳음. 남은 원소를 모두 더해도 목표보다 작으므로 더 탐색할 필요가 없다.", "틀림. 정답 후보를 잘못 제거하지 않는 안전한 기준이어야 한다.", "옳음. 탐색 효율을 정량적으로 비교할 수 있다.", "틀림. 양수만 있는 조건에서는 이미 목표를 넘었으므로 해당 분기를 중단할 수 있다."], "id": 14, "source_no": "26", "theme_key": "pruning", "focus": "방문 상태 수와 감소율"}, {"title": "분할정복을 활용한 병합 정렬", "concept": "병합 정렬은 목록을 절반으로 분할하고 각 부분을 재귀적으로 정렬한 뒤 두 정렬 목록을 결합한다. 분할 깊이는 로그 수준이고 각 깊이에서 전체 원소를 처리하므로 시간 복잡도는 O(n log n)이다. 병합을 위한 추가 공간이 필요하다.", "task": "병합 정렬의 분할·정복·결합 함수를 구현하고 빈 목록, 중복값, 정렬·역순 자료에서 결과를 검증한다.", "standard": "분할정복 전략으로 문제를 작은 부분 문제로 나누어 해결하고, 알고리즘의 정확성 및 시간·공간 복잡도를 분석한다.", "code": "def merge(left, right):\n    result = []\n    i = j = 0\n\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:\n            result.append(left[i])\n            i += 1\n        else:\n            result.append(right[j])\n            j += 1\n\n    return result + left[i:] + right[j:]\n\ndef merge_sort(values):\n    if len(values) <= 1:\n        return values\n\n    middle = len(values) // 2\n    left = merge_sort(values[:middle])\n    right = merge_sort(values[middle:])\n    return merge(left, right)\n\nprint(merge_sort([5, 2, 7, 2, 1]))", "choices": ["len(values) <= 1은 재귀 호출을 끝내는 기본 사례이다.", "merge()는 두 정렬된 목록을 하나의 정렬 목록으로 결합한다.", "merge_sort()는 목록을 분할하지 않고 한 번의 비교만 수행한다.", "병합 정렬의 일반적인 시간 복잡도는 O(n log n)이다.", "이 코드는 중복값을 모두 자동으로 삭제한다."], "answer": [0, 1, 3], "exp": ["옳음. 원소가 하나 이하이면 이미 정렬된 상태이다.", "옳음. 두 목록의 앞 원소를 비교하며 작은 값을 결과에 넣는다.", "틀림. 목록을 절반으로 반복 분할하고 재귀적으로 정렬한다.", "옳음. 로그 깊이의 분할마다 전체 n개 원소를 병합한다.", "틀림. 중복값도 원래 개수만큼 유지한다."], "id": 15, "source_no": "27", "theme_key": "merge", "focus": "중복값과 안정 정렬"}, {"title": "상태와 점화식을 이용한 동적계획법", "concept": "동적계획법은 중복되는 부분 문제와 최적 부분 구조를 활용한다. 계단 오르기 문제에서 n번째 상태는 n-1번째와 n-2번째 상태의 결과로 계산할 수 있다. 테이블 방식은 작은 상태부터 계산하며, 직전 두 상태만 필요하면 공간을 상수 수준으로 줄일 수 있다.", "task": "계단 오르기 문제의 상태·초기값·점화식을 정의하고 단순 재귀, 메모이제이션, 테이블, 공간 최적화 방식을 비교한다.", "standard": "문제에서 중복 부분 문제를 발견하고 상태와 점화식을 정의하여 동적계획법 알고리즘을 구현하며 효율성을 분석한다.", "code": "def stairs_dp(n):\n    if n < 1:\n        raise ValueError(\"n은 1 이상이어야 합니다.\")\n    if n == 1:\n        return 1\n\n    previous, current = 1, 2\n    for _ in range(3, n + 1):\n        previous, current = current, previous + current\n    return current\n\nfor n in [1, 2, 5, 10]:\n    print(n, stairs_dp(n))", "choices": ["previous와 current는 직전 두 상태의 값을 저장한다.", "n이 1보다 작으면 ValueError가 발생한다.", "이 함수는 모든 상태를 길이 n의 목록에 저장한다.", "stairs_dp(5)의 결과는 8이다.", "반복문이 실행될 때 previous와 current는 항상 같은 값을 유지한다."], "answer": [0, 1, 3], "exp": ["옳음. 다음 상태 계산에 필요한 두 값만 유지한다.", "옳음. 문제의 유효한 입력 범위를 검사한다.", "틀림. 전체 테이블 대신 두 변수만 사용한다.", "옳음. 1칸 또는 2칸씩 이동할 때 5칸을 오르는 방법은 8가지이다.", "틀림. 반복마다 두 변수가 다음 상태 값으로 갱신된다."], "id": 16, "source_no": "28", "theme_key": "dp", "focus": "메모이제이션과 테이블 비교"}, {"title": "교실 공기질 데이터 전처리와 환기 알림 프로젝트", "concept": "센서 자료에는 결측값과 물리적으로 타당하지 않은 비정상값이 포함될 수 있다. 분석 전 자료형 변환, 허용 범위 검사, 결측값 보완을 수행해야 하며, 분류 기준은 명시하고 검증해야 한다. 결과는 표와 그래프로 표현하되 센서 오차와 기준의 한계를 함께 설명해야 한다.", "task": "이산화탄소·온도·습도 자료를 전처리하고 이산화탄소 농도에 따라 상태와 환기 안내를 생성하여 CSV와 그래프로 저장한다.", "standard": "실생활 문제를 데이터 기반으로 분석하고, 요구사항에 따라 자료를 수집·전처리·분석·시각화하며 결과의 신뢰성과 윤리적 활용을 평가한다.", "code": "import pandas as pd\n\ndf = pd.DataFrame({\n    \"time\": [\"09:00\", \"09:20\", \"09:40\", \"10:00\"],\n    \"co2\": [620, None, 1120, 5200]\n})\n\ndf[\"co2\"] = pd.to_numeric(df[\"co2\"], errors=\"coerce\")\ndf.loc[~df[\"co2\"].between(350, 5000), \"co2\"] = pd.NA\ndf[\"co2\"] = df[\"co2\"].interpolate(limit_direction=\"both\")\n\ndef classify(value):\n    if value < 800:\n        return \"좋음\"\n    if value < 1000:\n        return \"보통\"\n    if value < 1500:\n        return \"환기 권고\"\n    return \"즉시 환기\"\n\ndf[\"status\"] = df[\"co2\"].apply(classify)\nprint(df)", "choices": ["5200은 허용 범위를 벗어나 결측값으로 바뀐다.", "interpolate()는 결측값을 주변 자료를 바탕으로 보완할 수 있다.", "classify()는 700을 '즉시 환기'로 분류한다.", "pd.to_numeric(..., errors='coerce')는 변환 불가능한 값을 결측값으로 처리할 수 있다.", "이 코드는 센서 자료의 정확성을 검증하지 않아도 실제 정책 기준으로 바로 사용할 수 있다."], "answer": [0, 1, 3], "exp": ["옳음. 350~5000 범위를 벗어난 값은 pd.NA로 변경한다.", "옳음. 앞뒤 값의 흐름을 이용해 누락값을 보완한다.", "틀림. 700은 800 미만이므로 '좋음'으로 분류한다.", "옳음. 숫자로 바꾸기 어려운 값은 NaN으로 변환된다.", "틀림. 센서 정확도와 실제 기준을 추가로 검증해야 한다."], "id": 17, "source_no": "29", "theme_key": "air", "focus": "상태 분류와 환기 안내"}, {"title": "오픈소스 라이브러리를 활용한 데이터 협력 프로젝트", "concept": "Pandas는 표 형태 자료의 불러오기·전처리·검색·집계에, Matplotlib는 분석 결과의 시각화에 활용된다. 오픈소스를 사용할 때는 기능뿐 아니라 라이선스, 출처 표시, 개인정보, 변경 기록과 팀원의 기여를 함께 관리해야 한다.", "task": "학교생활 데이터를 CSV로 관리하고 결측값 처리, 조건 검색, 집계, 그래프 저장 기능을 구현하며 라이선스와 협업 기록을 작성한다.", "standard": "오픈소스와 라이브러리를 목적에 맞게 활용하여 협력적으로 프로그램을 개발하고, 저작권·개인정보·데이터 윤리를 고려하여 결과를 공유한다.", "code": "from pathlib import Path\nimport pandas as pd\n\noutput = Path(\"dashboard_output\")\noutput.mkdir(exist_ok=True)\n\ndf = pd.DataFrame({\n    \"category\": [\"공지\", \"행사\", \"공지\", \"급식\"],\n    \"title\": [\"안전교육\", \"체험전\", None, \"식단 안내\"],\n    \"views\": [85, 210, 90, 120]\n})\n\ndf[\"title\"] = df[\"title\"].fillna(\"제목 없음\")\nresult = df[df[\"views\"] >= 100].sort_values(\"views\", ascending=False)\nresult.to_csv(output / \"search_result.csv\", index=False, encoding=\"utf-8-sig\")\nprint(result)", "choices": ["output.mkdir(exist_ok=True)는 출력 폴더가 이미 있어도 오류를 피한다.", "fillna('제목 없음')는 title 열의 결측값을 대체한다.", "views가 100 미만인 행만 result에 남는다.", "sort_values(..., ascending=False)는 조회 수를 내림차순으로 정렬한다.", "to_csv()는 결과를 그래프 이미지로만 저장한다."], "answer": [0, 1, 3], "exp": ["옳음. 폴더가 없으면 만들고 이미 존재하면 계속 실행한다.", "옳음. 누락된 제목을 지정한 문자열로 보완한다.", "틀림. 조건은 views가 100 이상인 행을 선택한다.", "옳음. 큰 조회 수부터 정렬한다.", "틀림. CSV 형식의 텍스트 데이터 파일로 저장한다."], "id": 18, "source_no": "30", "theme_key": "opensource", "focus": "협업 기록과 오류 처리"}, {"title": "스택을 활용한 괄호 검사 알고리즘", "concept": "괄호 검사는 가장 최근에 열린 괄호와 현재 닫는 괄호가 짝을 이루어야 하므로 후입선출 구조가 적합하다. 닫는 괄호가 먼저 등장한 경우, 괄호 종류가 맞지 않는 경우, 검사가 끝난 뒤 여는 괄호가 남은 경우를 모두 검사해야 한다.", "task": "소괄호·중괄호·대괄호가 섞인 문자열의 괄호 짝과 중첩 순서를 검사하고 정상·오류·경계 사례를 시험한다.", "standard": "자료구조의 특성을 활용하여 알고리즘을 설계하고, 다양한 시험 자료와 예외 상황을 적용하여 프로그램의 정확성과 안정성을 검증한다.", "code": "def is_balanced(text):\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n\n    for ch in text:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n\n    return not stack\n\nfor sample in [\"([])\", \"([)]\", \"((()))\", \"(()\"]:\n    print(sample, is_balanced(sample))", "choices": ["여는 괄호는 stack에 저장된다.", "닫는 괄호가 나올 때 스택이 비어 있어도 항상 정상으로 처리한다.", "pairs는 닫는 괄호와 대응하는 여는 괄호를 연결한다.", "검사가 끝난 뒤 stack에 괄호가 남아 있으면 올바른 문자열이다.", "이 알고리즘은 중첩된 괄호의 순서를 검사할 수 있다."], "answer": [0, 2, 4], "exp": ["옳음. 이후 닫는 괄호와 비교하기 위해 여는 괄호를 저장한다.", "틀림. 스택이 비어 있으면 대응할 여는 괄호가 없으므로 False를 반환한다.", "옳음. 각 닫는 괄호가 어떤 여는 괄호와 짝인지 정의한다.", "틀림. 닫히지 않은 여는 괄호가 남은 것이므로 잘못된 문자열이다.", "옳음. 가장 최근의 여는 괄호를 pop하여 중첩 순서를 확인한다."], "id": 19, "source_no": "34", "theme_key": "bracket", "focus": "경계 사례 중심 검증"}, {"title": "상태 공간 모델링과 너비 우선 탐색", "concept": "너비 우선 탐색은 시작 상태에서 가까운 상태부터 층별로 탐색한다. 간선의 비용이 동일한 상태 공간에서는 처음 목표에 도달한 경로가 최단 경로가 된다. 큐는 탐색 순서를 관리하고 방문 집합은 중복 탐색과 순환을 방지한다.", "task": "격자 미로를 상태 공간으로 표현하고 큐와 방문 집합을 이용하여 시작점에서 목표점까지의 최단 거리를 구한다.", "standard": "상태, 초기 상태, 목표 상태, 전이 규칙을 정의하여 탐색 문제를 모델링하고, 적절한 탐색 알고리즘과 자료구조를 선택하여 해결한다.", "code": "from collections import deque\n\ndef bfs(graph, start, goal):\n    queue = deque([(start, 0)])\n    visited = {start}\n\n    while queue:\n        node, distance = queue.popleft()\n        if node == goal:\n            return distance\n\n        for nxt in graph[node]:\n            if nxt not in visited:\n                visited.add(nxt)\n                queue.append((nxt, distance + 1))\n    return -1\n\ngraph = {\n    \"A\": [\"B\", \"C\"],\n    \"B\": [\"A\", \"D\"],\n    \"C\": [\"A\", \"D\"],\n    \"D\": [\"B\", \"C\"]\n}\nprint(bfs(graph, \"A\", \"D\"))", "choices": ["queue는 먼저 발견한 상태를 먼저 처리하도록 돕는다.", "visited를 사용하면 이미 탐색한 상태의 반복 방문을 줄일 수 있다.", "목표에 도달하지 못하면 이 함수는 항상 0을 반환한다.", "모든 간선의 비용이 같을 때 BFS는 최단 거리를 구할 수 있다.", "queue.popleft()는 가장 나중에 넣은 항목을 꺼낸다."], "answer": [0, 1, 3], "exp": ["옳음. 큐의 선입선출 특성으로 가까운 상태부터 처리한다.", "옳음. 중복 탐색과 순환을 방지한다.", "틀림. 목표에 도달하지 못하면 -1을 반환한다.", "옳음. 같은 비용의 간선에서는 층별 탐색이 최단 경로를 보장한다.", "틀림. popleft()는 가장 먼저 넣은 항목을 꺼낸다."], "id": 20, "source_no": "35", "theme_key": "bfs", "focus": "경로 부재와 경계 사례"}, {"title": "완전 탐색과 가지치기를 이용한 부분집합 합", "concept": "완전 탐색은 가능한 모든 선택을 조사하여 정답을 보장하지만 상태 수가 지수적으로 증가할 수 있다. 가지치기는 현재 상태에서 정답에 도달할 가능성이 없는 분기를 안전하게 제외하여 탐색량을 줄인다. 배제 기준이 정답 후보를 제거하지 않는지 논리적으로 검토해야 한다.", "task": "부분집합 합 문제를 선택·미선택 상태 공간으로 모델링하고 완전 탐색과 가지치기의 방문 상태 수를 비교한다.", "standard": "복잡한 문제를 상태 공간으로 추상화하고 완전 탐색, 가지치기, 탐욕 전략의 특징과 적용 조건을 비교하여 효율적인 알고리즘을 설계한다.", "code": "def subset_sum(numbers, target):\n    numbers = sorted(numbers, reverse=True)\n    visited = 0\n\n    def search(index, current):\n        nonlocal visited\n        visited += 1\n\n        if current == target:\n            return True\n        if index == len(numbers) or current > target:\n            return False\n\n        remaining = sum(numbers[index:])\n        if current + remaining < target:\n            return False\n\n        return (\n            search(index + 1, current + numbers[index])\n            or search(index + 1, current)\n        )\n\n    found = search(0, 0)\n    return found, visited\n\nprint(subset_sum([8, 6, 4, 3], 10))", "choices": ["current == target이면 목표 합을 찾았으므로 True를 반환한다.", "current + remaining < target인 분기는 목표에 도달할 수 없어 제외한다.", "가지치기를 적용하면 어떤 기준을 사용해도 항상 정답이 보장된다.", "visited는 탐색한 상태 수를 비교하는 데 활용할 수 있다.", "current > target인 경우에도 반드시 모든 남은 원소를 선택해야 한다."], "answer": [0, 1, 3], "exp": ["옳음. 현재 선택한 원소의 합이 목표와 일치한다.", "옳음. 남은 원소를 모두 더해도 목표보다 작으므로 더 탐색할 필요가 없다.", "틀림. 정답 후보를 잘못 제거하지 않는 안전한 기준이어야 한다.", "옳음. 탐색 효율을 정량적으로 비교할 수 있다.", "틀림. 양수만 있는 조건에서는 이미 목표를 넘었으므로 해당 분기를 중단할 수 있다."], "id": 21, "source_no": "36", "theme_key": "pruning", "focus": "탐욕 전략 반례 비교"}, {"title": "분할정복을 활용한 병합 정렬", "concept": "병합 정렬은 목록을 절반으로 분할하고 각 부분을 재귀적으로 정렬한 뒤 두 정렬 목록을 결합한다. 분할 깊이는 로그 수준이고 각 깊이에서 전체 원소를 처리하므로 시간 복잡도는 O(n log n)이다. 병합을 위한 추가 공간이 필요하다.", "task": "병합 정렬의 분할·정복·결합 함수를 구현하고 빈 목록, 중복값, 정렬·역순 자료에서 결과를 검증한다.", "standard": "분할정복 전략으로 문제를 작은 부분 문제로 나누어 해결하고, 알고리즘의 정확성 및 시간·공간 복잡도를 분석한다.", "code": "def merge(left, right):\n    result = []\n    i = j = 0\n\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:\n            result.append(left[i])\n            i += 1\n        else:\n            result.append(right[j])\n            j += 1\n\n    return result + left[i:] + right[j:]\n\ndef merge_sort(values):\n    if len(values) <= 1:\n        return values\n\n    middle = len(values) // 2\n    left = merge_sort(values[:middle])\n    right = merge_sort(values[middle:])\n    return merge(left, right)\n\nprint(merge_sort([5, 2, 7, 2, 1]))", "choices": ["len(values) <= 1은 재귀 호출을 끝내는 기본 사례이다.", "merge()는 두 정렬된 목록을 하나의 정렬 목록으로 결합한다.", "merge_sort()는 목록을 분할하지 않고 한 번의 비교만 수행한다.", "병합 정렬의 일반적인 시간 복잡도는 O(n log n)이다.", "이 코드는 중복값을 모두 자동으로 삭제한다."], "answer": [0, 1, 3], "exp": ["옳음. 원소가 하나 이하이면 이미 정렬된 상태이다.", "옳음. 두 목록의 앞 원소를 비교하며 작은 값을 결과에 넣는다.", "틀림. 목록을 절반으로 반복 분할하고 재귀적으로 정렬한다.", "옳음. 로그 깊이의 분할마다 전체 n개 원소를 병합한다.", "틀림. 중복값도 원래 개수만큼 유지한다."], "id": 22, "source_no": "37", "theme_key": "merge", "focus": "시간·공간 복잡도 분석"}, {"title": "상태와 점화식을 이용한 동적계획법", "concept": "동적계획법은 중복되는 부분 문제와 최적 부분 구조를 활용한다. 계단 오르기 문제에서 n번째 상태는 n-1번째와 n-2번째 상태의 결과로 계산할 수 있다. 테이블 방식은 작은 상태부터 계산하며, 직전 두 상태만 필요하면 공간을 상수 수준으로 줄일 수 있다.", "task": "계단 오르기 문제의 상태·초기값·점화식을 정의하고 단순 재귀, 메모이제이션, 테이블, 공간 최적화 방식을 비교한다.", "standard": "문제에서 중복 부분 문제를 발견하고 상태와 점화식을 정의하여 동적계획법 알고리즘을 구현하며 효율성을 분석한다.", "code": "def stairs_dp(n):\n    if n < 1:\n        raise ValueError(\"n은 1 이상이어야 합니다.\")\n    if n == 1:\n        return 1\n\n    previous, current = 1, 2\n    for _ in range(3, n + 1):\n        previous, current = current, previous + current\n    return current\n\nfor n in [1, 2, 5, 10]:\n    print(n, stairs_dp(n))", "choices": ["previous와 current는 직전 두 상태의 값을 저장한다.", "n이 1보다 작으면 ValueError가 발생한다.", "이 함수는 모든 상태를 길이 n의 목록에 저장한다.", "stairs_dp(5)의 결과는 8이다.", "반복문이 실행될 때 previous와 current는 항상 같은 값을 유지한다."], "answer": [0, 1, 3], "exp": ["옳음. 다음 상태 계산에 필요한 두 값만 유지한다.", "옳음. 문제의 유효한 입력 범위를 검사한다.", "틀림. 전체 테이블 대신 두 변수만 사용한다.", "옳음. 1칸 또는 2칸씩 이동할 때 5칸을 오르는 방법은 8가지이다.", "틀림. 반복마다 두 변수가 다음 상태 값으로 갱신된다."], "id": 23, "source_no": "38", "theme_key": "dp", "focus": "공간 최적화와 입력 검증"}, {"title": "교실 공기질 데이터 전처리와 환기 알림 프로젝트", "concept": "센서 자료에는 결측값과 물리적으로 타당하지 않은 비정상값이 포함될 수 있다. 분석 전 자료형 변환, 허용 범위 검사, 결측값 보완을 수행해야 하며, 분류 기준은 명시하고 검증해야 한다. 결과는 표와 그래프로 표현하되 센서 오차와 기준의 한계를 함께 설명해야 한다.", "task": "이산화탄소·온도·습도 자료를 전처리하고 이산화탄소 농도에 따라 상태와 환기 안내를 생성하여 CSV와 그래프로 저장한다.", "standard": "실생활 문제를 데이터 기반으로 분석하고, 요구사항에 따라 자료를 수집·전처리·분석·시각화하며 결과의 신뢰성과 윤리적 활용을 평가한다.", "code": "import pandas as pd\n\ndf = pd.DataFrame({\n    \"time\": [\"09:00\", \"09:20\", \"09:40\", \"10:00\"],\n    \"co2\": [620, None, 1120, 5200]\n})\n\ndf[\"co2\"] = pd.to_numeric(df[\"co2\"], errors=\"coerce\")\ndf.loc[~df[\"co2\"].between(350, 5000), \"co2\"] = pd.NA\ndf[\"co2\"] = df[\"co2\"].interpolate(limit_direction=\"both\")\n\ndef classify(value):\n    if value < 800:\n        return \"좋음\"\n    if value < 1000:\n        return \"보통\"\n    if value < 1500:\n        return \"환기 권고\"\n    return \"즉시 환기\"\n\ndf[\"status\"] = df[\"co2\"].apply(classify)\nprint(df)", "choices": ["5200은 허용 범위를 벗어나 결측값으로 바뀐다.", "interpolate()는 결측값을 주변 자료를 바탕으로 보완할 수 있다.", "classify()는 700을 '즉시 환기'로 분류한다.", "pd.to_numeric(..., errors='coerce')는 변환 불가능한 값을 결측값으로 처리할 수 있다.", "이 코드는 센서 자료의 정확성을 검증하지 않아도 실제 정책 기준으로 바로 사용할 수 있다."], "answer": [0, 1, 3], "exp": ["옳음. 350~5000 범위를 벗어난 값은 pd.NA로 변경한다.", "옳음. 앞뒤 값의 흐름을 이용해 누락값을 보완한다.", "틀림. 700은 800 미만이므로 '좋음'으로 분류한다.", "옳음. 숫자로 바꾸기 어려운 값은 NaN으로 변환된다.", "틀림. 센서 정확도와 실제 기준을 추가로 검증해야 한다."], "id": 24, "source_no": "39", "theme_key": "air", "focus": "시각화·센서 신뢰성"}, {"title": "오픈소스 라이브러리를 활용한 데이터 협력 프로젝트", "concept": "Pandas는 표 형태 자료의 불러오기·전처리·검색·집계에, Matplotlib는 분석 결과의 시각화에 활용된다. 오픈소스를 사용할 때는 기능뿐 아니라 라이선스, 출처 표시, 개인정보, 변경 기록과 팀원의 기여를 함께 관리해야 한다.", "task": "학교생활 데이터를 CSV로 관리하고 결측값 처리, 조건 검색, 집계, 그래프 저장 기능을 구현하며 라이선스와 협업 기록을 작성한다.", "standard": "오픈소스와 라이브러리를 목적에 맞게 활용하여 협력적으로 프로그램을 개발하고, 저작권·개인정보·데이터 윤리를 고려하여 결과를 공유한다.", "code": "from pathlib import Path\nimport pandas as pd\n\noutput = Path(\"dashboard_output\")\noutput.mkdir(exist_ok=True)\n\ndf = pd.DataFrame({\n    \"category\": [\"공지\", \"행사\", \"공지\", \"급식\"],\n    \"title\": [\"안전교육\", \"체험전\", None, \"식단 안내\"],\n    \"views\": [85, 210, 90, 120]\n})\n\ndf[\"title\"] = df[\"title\"].fillna(\"제목 없음\")\nresult = df[df[\"views\"] >= 100].sort_values(\"views\", ascending=False)\nresult.to_csv(output / \"search_result.csv\", index=False, encoding=\"utf-8-sig\")\nprint(result)", "choices": ["output.mkdir(exist_ok=True)는 출력 폴더가 이미 있어도 오류를 피한다.", "fillna('제목 없음')는 title 열의 결측값을 대체한다.", "views가 100 미만인 행만 result에 남는다.", "sort_values(..., ascending=False)는 조회 수를 내림차순으로 정렬한다.", "to_csv()는 결과를 그래프 이미지로만 저장한다."], "answer": [0, 1, 3], "exp": ["옳음. 폴더가 없으면 만들고 이미 존재하면 계속 실행한다.", "옳음. 누락된 제목을 지정한 문자열로 보완한다.", "틀림. 조건은 views가 100 이상인 행을 선택한다.", "옳음. 큰 조회 수부터 정렬한다.", "틀림. CSV 형식의 텍스트 데이터 파일로 저장한다."], "id": 25, "source_no": "40", "theme_key": "opensource", "focus": "전처리·검색·파일 저장"}, {"title": "스택을 활용한 괄호 검사 알고리즘", "concept": "괄호 검사는 가장 최근에 열린 괄호와 현재 닫는 괄호가 짝을 이루어야 하므로 후입선출 구조가 적합하다. 닫는 괄호가 먼저 등장한 경우, 괄호 종류가 맞지 않는 경우, 검사가 끝난 뒤 여는 괄호가 남은 경우를 모두 검사해야 한다.", "task": "소괄호·중괄호·대괄호가 섞인 문자열의 괄호 짝과 중첩 순서를 검사하고 정상·오류·경계 사례를 시험한다.", "standard": "자료구조의 특성을 활용하여 알고리즘을 설계하고, 다양한 시험 자료와 예외 상황을 적용하여 프로그램의 정확성과 안정성을 검증한다.", "code": "def is_balanced(text):\n    pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n    stack = []\n\n    for ch in text:\n        if ch in \"([{\":\n            stack.append(ch)\n        elif ch in pairs:\n            if not stack or stack.pop() != pairs[ch]:\n                return False\n\n    return not stack\n\nfor sample in [\"([])\", \"([)]\", \"((()))\", \"(()\"]:\n    print(sample, is_balanced(sample))", "choices": ["여는 괄호는 stack에 저장된다.", "닫는 괄호가 나올 때 스택이 비어 있어도 항상 정상으로 처리한다.", "pairs는 닫는 괄호와 대응하는 여는 괄호를 연결한다.", "검사가 끝난 뒤 stack에 괄호가 남아 있으면 올바른 문자열이다.", "이 알고리즘은 중첩된 괄호의 순서를 검사할 수 있다."], "answer": [0, 2, 4], "exp": ["옳음. 이후 닫는 괄호와 비교하기 위해 여는 괄호를 저장한다.", "틀림. 스택이 비어 있으면 대응할 여는 괄호가 없으므로 False를 반환한다.", "옳음. 각 닫는 괄호가 어떤 여는 괄호와 짝인지 정의한다.", "틀림. 닫히지 않은 여는 괄호가 남은 것이므로 잘못된 문자열이다.", "옳음. 가장 최근의 여는 괄호를 pop하여 중첩 순서를 확인한다."], "id": 26, "source_no": "45", "theme_key": "bracket", "focus": "중첩 구조와 괄호 불일치"}, {"title": "완전 탐색과 가지치기를 이용한 부분집합 합", "concept": "완전 탐색은 가능한 모든 선택을 조사하여 정답을 보장하지만 상태 수가 지수적으로 증가할 수 있다. 가지치기는 현재 상태에서 정답에 도달할 가능성이 없는 분기를 안전하게 제외하여 탐색량을 줄인다. 배제 기준이 정답 후보를 제거하지 않는지 논리적으로 검토해야 한다.", "task": "부분집합 합 문제를 선택·미선택 상태 공간으로 모델링하고 완전 탐색과 가지치기의 방문 상태 수를 비교한다.", "standard": "복잡한 문제를 상태 공간으로 추상화하고 완전 탐색, 가지치기, 탐욕 전략의 특징과 적용 조건을 비교하여 효율적인 알고리즘을 설계한다.", "code": "def subset_sum(numbers, target):\n    numbers = sorted(numbers, reverse=True)\n    visited = 0\n\n    def search(index, current):\n        nonlocal visited\n        visited += 1\n\n        if current == target:\n            return True\n        if index == len(numbers) or current > target:\n            return False\n\n        remaining = sum(numbers[index:])\n        if current + remaining < target:\n            return False\n\n        return (\n            search(index + 1, current + numbers[index])\n            or search(index + 1, current)\n        )\n\n    found = search(0, 0)\n    return found, visited\n\nprint(subset_sum([8, 6, 4, 3], 10))", "choices": ["current == target이면 목표 합을 찾았으므로 True를 반환한다.", "current + remaining < target인 분기는 목표에 도달할 수 없어 제외한다.", "가지치기를 적용하면 어떤 기준을 사용해도 항상 정답이 보장된다.", "visited는 탐색한 상태 수를 비교하는 데 활용할 수 있다.", "current > target인 경우에도 반드시 모든 남은 원소를 선택해야 한다."], "answer": [0, 1, 3], "exp": ["옳음. 현재 선택한 원소의 합이 목표와 일치한다.", "옳음. 남은 원소를 모두 더해도 목표보다 작으므로 더 탐색할 필요가 없다.", "틀림. 정답 후보를 잘못 제거하지 않는 안전한 기준이어야 한다.", "옳음. 탐색 효율을 정량적으로 비교할 수 있다.", "틀림. 양수만 있는 조건에서는 이미 목표를 넘었으므로 해당 분기를 중단할 수 있다."], "id": 27, "source_no": "46", "theme_key": "pruning", "focus": "안전한 배제 기준"}, {"title": "분할정복을 활용한 병합 정렬", "concept": "병합 정렬은 목록을 절반으로 분할하고 각 부분을 재귀적으로 정렬한 뒤 두 정렬 목록을 결합한다. 분할 깊이는 로그 수준이고 각 깊이에서 전체 원소를 처리하므로 시간 복잡도는 O(n log n)이다. 병합을 위한 추가 공간이 필요하다.", "task": "병합 정렬의 분할·정복·결합 함수를 구현하고 빈 목록, 중복값, 정렬·역순 자료에서 결과를 검증한다.", "standard": "분할정복 전략으로 문제를 작은 부분 문제로 나누어 해결하고, 알고리즘의 정확성 및 시간·공간 복잡도를 분석한다.", "code": "def merge(left, right):\n    result = []\n    i = j = 0\n\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:\n            result.append(left[i])\n            i += 1\n        else:\n            result.append(right[j])\n            j += 1\n\n    return result + left[i:] + right[j:]\n\ndef merge_sort(values):\n    if len(values) <= 1:\n        return values\n\n    middle = len(values) // 2\n    left = merge_sort(values[:middle])\n    right = merge_sort(values[middle:])\n    return merge(left, right)\n\nprint(merge_sort([5, 2, 7, 2, 1]))", "choices": ["len(values) <= 1은 재귀 호출을 끝내는 기본 사례이다.", "merge()는 두 정렬된 목록을 하나의 정렬 목록으로 결합한다.", "merge_sort()는 목록을 분할하지 않고 한 번의 비교만 수행한다.", "병합 정렬의 일반적인 시간 복잡도는 O(n log n)이다.", "이 코드는 중복값을 모두 자동으로 삭제한다."], "answer": [0, 1, 3], "exp": ["옳음. 원소가 하나 이하이면 이미 정렬된 상태이다.", "옳음. 두 목록의 앞 원소를 비교하며 작은 값을 결과에 넣는다.", "틀림. 목록을 절반으로 반복 분할하고 재귀적으로 정렬한다.", "옳음. 로그 깊이의 분할마다 전체 n개 원소를 병합한다.", "틀림. 중복값도 원래 개수만큼 유지한다."], "id": 28, "source_no": "47", "theme_key": "merge", "focus": "분할 깊이와 병합 과정"}, {"title": "상태와 점화식을 이용한 동적계획법", "concept": "동적계획법은 중복되는 부분 문제와 최적 부분 구조를 활용한다. 계단 오르기 문제에서 n번째 상태는 n-1번째와 n-2번째 상태의 결과로 계산할 수 있다. 테이블 방식은 작은 상태부터 계산하며, 직전 두 상태만 필요하면 공간을 상수 수준으로 줄일 수 있다.", "task": "계단 오르기 문제의 상태·초기값·점화식을 정의하고 단순 재귀, 메모이제이션, 테이블, 공간 최적화 방식을 비교한다.", "standard": "문제에서 중복 부분 문제를 발견하고 상태와 점화식을 정의하여 동적계획법 알고리즘을 구현하며 효율성을 분석한다.", "code": "def stairs_dp(n):\n    if n < 1:\n        raise ValueError(\"n은 1 이상이어야 합니다.\")\n    if n == 1:\n        return 1\n\n    previous, current = 1, 2\n    for _ in range(3, n + 1):\n        previous, current = current, previous + current\n    return current\n\nfor n in [1, 2, 5, 10]:\n    print(n, stairs_dp(n))", "choices": ["previous와 current는 직전 두 상태의 값을 저장한다.", "n이 1보다 작으면 ValueError가 발생한다.", "이 함수는 모든 상태를 길이 n의 목록에 저장한다.", "stairs_dp(5)의 결과는 8이다.", "반복문이 실행될 때 previous와 current는 항상 같은 값을 유지한다."], "answer": [0, 1, 3], "exp": ["옳음. 다음 상태 계산에 필요한 두 값만 유지한다.", "옳음. 문제의 유효한 입력 범위를 검사한다.", "틀림. 전체 테이블 대신 두 변수만 사용한다.", "옳음. 1칸 또는 2칸씩 이동할 때 5칸을 오르는 방법은 8가지이다.", "틀림. 반복마다 두 변수가 다음 상태 값으로 갱신된다."], "id": 29, "source_no": "48", "theme_key": "dp", "focus": "상태·초기값·점화식"}, {"title": "교실 공기질 데이터 전처리와 환기 알림 프로젝트", "concept": "센서 자료에는 결측값과 물리적으로 타당하지 않은 비정상값이 포함될 수 있다. 분석 전 자료형 변환, 허용 범위 검사, 결측값 보완을 수행해야 하며, 분류 기준은 명시하고 검증해야 한다. 결과는 표와 그래프로 표현하되 센서 오차와 기준의 한계를 함께 설명해야 한다.", "task": "이산화탄소·온도·습도 자료를 전처리하고 이산화탄소 농도에 따라 상태와 환기 안내를 생성하여 CSV와 그래프로 저장한다.", "standard": "실생활 문제를 데이터 기반으로 분석하고, 요구사항에 따라 자료를 수집·전처리·분석·시각화하며 결과의 신뢰성과 윤리적 활용을 평가한다.", "code": "import pandas as pd\n\ndf = pd.DataFrame({\n    \"time\": [\"09:00\", \"09:20\", \"09:40\", \"10:00\"],\n    \"co2\": [620, None, 1120, 5200]\n})\n\ndf[\"co2\"] = pd.to_numeric(df[\"co2\"], errors=\"coerce\")\ndf.loc[~df[\"co2\"].between(350, 5000), \"co2\"] = pd.NA\ndf[\"co2\"] = df[\"co2\"].interpolate(limit_direction=\"both\")\n\ndef classify(value):\n    if value < 800:\n        return \"좋음\"\n    if value < 1000:\n        return \"보통\"\n    if value < 1500:\n        return \"환기 권고\"\n    return \"즉시 환기\"\n\ndf[\"status\"] = df[\"co2\"].apply(classify)\nprint(df)", "choices": ["5200은 허용 범위를 벗어나 결측값으로 바뀐다.", "interpolate()는 결측값을 주변 자료를 바탕으로 보완할 수 있다.", "classify()는 700을 '즉시 환기'로 분류한다.", "pd.to_numeric(..., errors='coerce')는 변환 불가능한 값을 결측값으로 처리할 수 있다.", "이 코드는 센서 자료의 정확성을 검증하지 않아도 실제 정책 기준으로 바로 사용할 수 있다."], "answer": [0, 1, 3], "exp": ["옳음. 350~5000 범위를 벗어난 값은 pd.NA로 변경한다.", "옳음. 앞뒤 값의 흐름을 이용해 누락값을 보완한다.", "틀림. 700은 800 미만이므로 '좋음'으로 분류한다.", "옳음. 숫자로 바꾸기 어려운 값은 NaN으로 변환된다.", "틀림. 센서 정확도와 실제 기준을 추가로 검증해야 한다."], "id": 30, "source_no": "49", "theme_key": "air", "focus": "결측값·비정상값 처리"}, {"title": "오픈소스 라이브러리를 활용한 데이터 협력 프로젝트", "concept": "Pandas는 표 형태 자료의 불러오기·전처리·검색·집계에, Matplotlib는 분석 결과의 시각화에 활용된다. 오픈소스를 사용할 때는 기능뿐 아니라 라이선스, 출처 표시, 개인정보, 변경 기록과 팀원의 기여를 함께 관리해야 한다.", "task": "학교생활 데이터를 CSV로 관리하고 결측값 처리, 조건 검색, 집계, 그래프 저장 기능을 구현하며 라이선스와 협업 기록을 작성한다.", "standard": "오픈소스와 라이브러리를 목적에 맞게 활용하여 협력적으로 프로그램을 개발하고, 저작권·개인정보·데이터 윤리를 고려하여 결과를 공유한다.", "code": "from pathlib import Path\nimport pandas as pd\n\noutput = Path(\"dashboard_output\")\noutput.mkdir(exist_ok=True)\n\ndf = pd.DataFrame({\n    \"category\": [\"공지\", \"행사\", \"공지\", \"급식\"],\n    \"title\": [\"안전교육\", \"체험전\", None, \"식단 안내\"],\n    \"views\": [85, 210, 90, 120]\n})\n\ndf[\"title\"] = df[\"title\"].fillna(\"제목 없음\")\nresult = df[df[\"views\"] >= 100].sort_values(\"views\", ascending=False)\nresult.to_csv(output / \"search_result.csv\", index=False, encoding=\"utf-8-sig\")\nprint(result)", "choices": ["output.mkdir(exist_ok=True)는 출력 폴더가 이미 있어도 오류를 피한다.", "fillna('제목 없음')는 title 열의 결측값을 대체한다.", "views가 100 미만인 행만 result에 남는다.", "sort_values(..., ascending=False)는 조회 수를 내림차순으로 정렬한다.", "to_csv()는 결과를 그래프 이미지로만 저장한다."], "answer": [0, 1, 3], "exp": ["옳음. 폴더가 없으면 만들고 이미 존재하면 계속 실행한다.", "옳음. 누락된 제목을 지정한 문자열로 보완한다.", "틀림. 조건은 views가 100 이상인 행을 선택한다.", "옳음. 큰 조회 수부터 정렬한다.", "틀림. CSV 형식의 텍스트 데이터 파일로 저장한다."], "id": 31, "source_no": "50", "theme_key": "opensource", "focus": "라이선스·출처·정보윤리"}, {"title": "완전 탐색과 가지치기를 이용한 부분집합 합", "concept": "완전 탐색은 가능한 모든 선택을 조사하여 정답을 보장하지만 상태 수가 지수적으로 증가할 수 있다. 가지치기는 현재 상태에서 정답에 도달할 가능성이 없는 분기를 안전하게 제외하여 탐색량을 줄인다. 배제 기준이 정답 후보를 제거하지 않는지 논리적으로 검토해야 한다.", "task": "부분집합 합 문제를 선택·미선택 상태 공간으로 모델링하고 완전 탐색과 가지치기의 방문 상태 수를 비교한다.", "standard": "복잡한 문제를 상태 공간으로 추상화하고 완전 탐색, 가지치기, 탐욕 전략의 특징과 적용 조건을 비교하여 효율적인 알고리즘을 설계한다.", "code": "def subset_sum(numbers, target):\n    numbers = sorted(numbers, reverse=True)\n    visited = 0\n\n    def search(index, current):\n        nonlocal visited\n        visited += 1\n\n        if current == target:\n            return True\n        if index == len(numbers) or current > target:\n            return False\n\n        remaining = sum(numbers[index:])\n        if current + remaining < target:\n            return False\n\n        return (\n            search(index + 1, current + numbers[index])\n            or search(index + 1, current)\n        )\n\n    found = search(0, 0)\n    return found, visited\n\nprint(subset_sum([8, 6, 4, 3], 10))", "choices": ["current == target이면 목표 합을 찾았으므로 True를 반환한다.", "current + remaining < target인 분기는 목표에 도달할 수 없어 제외한다.", "가지치기를 적용하면 어떤 기준을 사용해도 항상 정답이 보장된다.", "visited는 탐색한 상태 수를 비교하는 데 활용할 수 있다.", "current > target인 경우에도 반드시 모든 남은 원소를 선택해야 한다."], "answer": [0, 1, 3], "exp": ["옳음. 현재 선택한 원소의 합이 목표와 일치한다.", "옳음. 남은 원소를 모두 더해도 목표보다 작으므로 더 탐색할 필요가 없다.", "틀림. 정답 후보를 잘못 제거하지 않는 안전한 기준이어야 한다.", "옳음. 탐색 효율을 정량적으로 비교할 수 있다.", "틀림. 양수만 있는 조건에서는 이미 목표를 넘었으므로 해당 분기를 중단할 수 있다."], "id": 32, "source_no": "56", "theme_key": "pruning", "focus": "방문 상태 수와 감소율"}, {"title": "분할정복을 활용한 병합 정렬", "concept": "병합 정렬은 목록을 절반으로 분할하고 각 부분을 재귀적으로 정렬한 뒤 두 정렬 목록을 결합한다. 분할 깊이는 로그 수준이고 각 깊이에서 전체 원소를 처리하므로 시간 복잡도는 O(n log n)이다. 병합을 위한 추가 공간이 필요하다.", "task": "병합 정렬의 분할·정복·결합 함수를 구현하고 빈 목록, 중복값, 정렬·역순 자료에서 결과를 검증한다.", "standard": "분할정복 전략으로 문제를 작은 부분 문제로 나누어 해결하고, 알고리즘의 정확성 및 시간·공간 복잡도를 분석한다.", "code": "def merge(left, right):\n    result = []\n    i = j = 0\n\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:\n            result.append(left[i])\n            i += 1\n        else:\n            result.append(right[j])\n            j += 1\n\n    return result + left[i:] + right[j:]\n\ndef merge_sort(values):\n    if len(values) <= const startDate=new Date();
document.getElementById("startTime").textContent=startDate.toLocaleString("ko-KR");
const units=document.getElementById("units");
const jump=document.getElementById("jump");

function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

DATA.forEach((item,i)=>{
  const option=document.createElement("option");
  option.value="unit-"+i; option.textContent=`${i+1}번 · 예문 ${item.source_no}`;
  jump.appendChild(option);

  const section=document.createElement("section");
  section.className="card unit"; section.id="unit-"+i;
  section.dataset.search=(item.title+" "+item.focus+" "+item.concept+" "+item.source_no).toLowerCase();
  section.innerHTML=`
    <div class="unit-head"><div><span class="badge">${i+1}번</span> <b>원문 예문 번호 ${item.source_no}</b></div><h2>${item.title}</h2></div>
    <div class="source-note"><b>예문 연계 초점:</b> ${item.focus}</div>
    <div class="info-grid">
      <div class="info"><h3>관련 개념</h3><p>${item.concept}</p></div>
      <div class="info"><h3>수행과제</h3><p>${item.task}</p></div>
      <div class="info"><h3>성취기준 연계</h3><p>${item.standard}</p></div>
    </div>
    <h3>파이썬 코드</h3><pre>${esc(item.code)}</pre>
    <h3>코드 상세 설명</h3>
    <p>이 코드는 <b>${item.title}</b>의 핵심 원리를 실행 가능한 형태로 구현한 예시이다. 입력 자료를 준비하고 핵심 알고리즘을 함수 또는 자료구조로 구성한 뒤, 실행 결과를 출력하여 정확성을 확인하도록 설계하였다. 수행평가에서는 정상 입력뿐 아니라 경계값과 오류 입력을 추가하고, 실행 결과·호출 횟수·방문 상태 수·파일 산출물 등 주제에 적합한 근거를 기록해야 한다. 또한 결과가 나온 이유를 코드의 조건문, 반복문, 재귀 호출, 자료구조 연산과 연결하여 설명해야 한다.</p>
    <div class="question"><h3>${i+1}. 위 코드에 대한 설명으로 옳은 것을 모두 고르시오. <small>(3개 선택)</small></h3>
      ${item.choices.map((c,j)=>`<label class="choice" id="choice-${i}-${j}"><input type="checkbox" name="q${i}" value="${j}">${j+1}. ${c}</label>`).join("")}
      <div class="explanation" id="exp-${i}"></div>
    </div>`;
  units.appendChild(section);
});

jump.onchange=()=>{const id=jump.value;if(id)document.getElementById(id).scrollIntoView({behavior:"smooth"})};
function filterUnits(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 document.querySelectorAll(".unit").forEach(x=>x.classList.toggle("hidden",q&&!x.dataset.search.includes(q)));
}
function resetFilter(){document.getElementById("search").value="";document.querySelectorAll(".unit").forEach(x=>x.classList.remove("hidden"));}

let finalScore=0, submitted=false, submitDate=null, detailText="";
function same(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i]);}
function grade(){
 const sid=document.getElementById("sid").value.trim(), name=document.getElementById("sname").value.trim();
 if(!sid||!name){alert("학번과 이름을 입력하세요.");return;}
 let correct=0; detailText="";
 DATA.forEach((item,i)=>{
   const selected=[...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(x=>Number(x.value)).sort((a,b)=>a-b);
   const answer=[...item.answer].sort((a,b)=>a-b);
   const ok=same(selected,answer); if(ok)correct++;
   item.choices.forEach((_,j)=>{
      const label=document.getElementById(`choice-${i}-${j}`);
      label.classList.remove("correct","wrong");
      if(item.answer.includes(j)) label.classList.add("correct");
      else if(selected.includes(j)) label.classList.add("wrong");
   });
   const exp=document.getElementById(`exp-${i}`);
   exp.style.display="block";
   exp.innerHTML=`<b>${ok?"정답":"오답"}</b> · 정답: ${answer.map(x=>x+1).join(", ")}<ol>${item.exp.map(x=>`<li>${x}</li>`).join("")}</ol>`;
   detailText+=`\n[${i+1}번 / 예문 ${item.source_no}] ${ok?"정답":"오답"}\n선택: ${selected.length?selected.map(x=>x+1).join(", "):"미선택"}\n정답: ${answer.map(x=>x+1).join(", ")}\n`;
   item.exp.forEach((x,j)=>detailText+=`${j+1}번 보기: ${x}\n`);
 });
 finalScore=Math.round(correct/DATA.length*100); submitted=true; submitDate=new Date();
 document.getElementById("scoreText").textContent=`${finalScore}점 (${correct}/${DATA.length}문항)`;
 document.getElementById("summary").textContent=`제출 시각: ${submitDate.toLocaleString("ko-KR")}`;
 document.getElementById("result").style.display="block";
 document.getElementById("result").scrollIntoView({behavior:"smooth"});
}
function safeName(s){return s.replace(/[\\/:*?"<>|]/g,"_")}
function stamp(d){const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;}
function saveTxt(){
 if(!submitted){alert("먼저 제출 및 채점을 실행하세요.");return;}
 const sid=document.getElementById("sid").value.trim(), name=document.getElementById("sname").value.trim();
 const content=`정보과학 수행평가 결과\n학번: ${sid}\n이름: ${name}\n점수: ${finalScore}점\n시작 시각: ${startDate.toLocaleString("ko-KR")}\n제출 시각: ${submitDate.toLocaleString("ko-KR")}\n총 문항: ${DATA.length}\n${detailText}`;
 const blob=new Blob([content],{type:"text/plain;charset=utf-8"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);
 a.download=`${safeName(sid)}_${safeName(name)}_${finalScore}_수행평가_${stamp(submitDate)}.txt`;
 a.click();URL.revokeObjectURL(a.href);
}
</script>
</body></html>
